                type: array
                items:
                  $ref: "#/components/schemas/AiInvoice"
  /public/payments/{scheduleId}/submit-proof:
    post:
      operationId: submitPaymentProof
      tags: [payments]
      summary: Customer submits a payment reference for an installment
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProofInput"
      responses:
        "200":
          description: Proof recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  schedule:
                    $ref: "#/components/schemas/AiPaymentSchedule"
        "404":
          description: Not found or already paid
  /public/catalog/requests/{requestId}/checkout:
    post:
      operationId: checkoutServiceRequest
      tags: [catalog, payments]
      summary: Standard (fixed_price) checkout — creates a project + payment schedule, no quotation
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "200":
          description: Already checked out (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "404":
          description: Service request not found
        "409":
          description: Wrong flow, wrong status, or already terminal
  /commercial-gates/{id}/waive:
    post:
      operationId: waiveCommercialGate
      tags: [commercial-gates]
      summary: Waive a commercial gate (admin only, requires reason)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommercialGateWaiveInput"
      responses:
        "200":
          description: Gate waived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCommercialGate"
        "400":
          description: Bad request
        "404":
          description: Not found
