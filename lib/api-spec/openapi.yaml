        ttlSeconds:
          type: integer
          default: 3600
    GenerateTokenResponse:
      type: object
      required: [token, expiresAt, projectId]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        projectId:
          type: integer
    PaymentVerifyInput:
      type: object
      required:
        - verifiedBy
      properties:
        verifiedBy:
          type: string
        reference:
          type: string
    PaymentVerifyResult:
      type: object
      required:
        - schedule
        - project
        - productionStarted
      properties:
