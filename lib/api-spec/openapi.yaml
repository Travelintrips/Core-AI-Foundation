          type: string
        slug:
          type: string
        role:
          type: string
        description:
          type: string
        providerId:
          type: integer
        modelId:
          type: integer
        priority:
          type: integer
        temperature:
          type: number
        maxTokens:
          type: integer
        status:
          type: string
          enum: [active, inactive, draft]
        allowedTools:
          type: array
          items:
            type: string
        knowledgeBaseId:
          type: integer
        version:
          type: string
        owner:
          type: string
        metadata:
          type: object

    AiAgentUpdate:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        role:
          type: string
        description:
          type: string
        providerId:
          type: integer
        modelId:
          type: integer
        priority:
          type: integer
        temperature:
          type: number
        maxTokens:
          type: integer
        status:
          type: string
          enum: [active, inactive, draft]
        allowedTools:
