openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Platform Enterprise API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: registry
    description: AI Provider and Model Registry
  - name: orchestrator
    description: AI Orchestrator - routing and execution
  - name: workflows
    description: AI Workflow Engine
  - name: prompts
    description: AI Prompt Library
  - name: knowledge
    description: AI Knowledge Base
  - name: memory
    description: AI Memory
  - name: audit
    description: AI Audit Log
  - name: analytics
    description: AI Analytics
  - name: settings
    description: AI Settings
  - name: agents
  - name: creative-ai
    description: Creative AI Workflow Engine
  - name: capabilities
    description: AI Capability Matrix
  - name: client-memory
    description: Client Long-Term Memory
  - name: feedback
    description: Human Feedback Loop
  - name: client-review
    description: Client Review Portal — share project results with clients for approval
  - name: public
    description: Public endpoints — token-protected, no admin key required
  - name: events
    description: AI Event Bus — publish, query, and replay inter-module events
  - name: event-subscriptions
    description: AI Event Subscriptions — route events to handler functions
  - name: human-tasks
    description: Human Task Center — AI-to-human handoff, review, approval, and escalation
  - name: service-portfolio
  - name: service-catalog
    description: AI Service Catalog & Pricing Center — departments, services, packages, and customer requests
  - name: commercial-gates
    description: Commercial gate management — payment verification, waiver, and approval before project conversion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/providers:
    get:
      operationId: listProviders
      tags:
        - registry
      summary: List all AI providers
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProvider"
    post:
      operationId: createProvider
      tags:
        - registry
      summary: Register a new AI provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
  /ai/providers/{id}:
    get:
      operationId: getProvider
      tags:
        - registry
      summary: Get an AI provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
    patch:
      operationId: updateProvider
      tags:
        - registry
      summary: Update an AI provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
    delete:
      operationId: deleteProvider
      tags:
        - registry
      summary: Delete an AI provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /ai/models:
    get:
      operationId: listModels
      tags:
        - registry
      summary: List all AI models
      parameters:
        - name: providerId
          in: query
          schema:
            type:
              - integer
              - "null"
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModel"
    post:
      operationId: createModel
      tags:
        - registry
      summary: Register a new AI model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
  /ai/models/{id}:
    get:
      operationId: getModel
      tags:
        - registry
      summary: Get an AI model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
    patch:
      operationId: updateModel
      tags:
        - registry
      summary: Update an AI model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
    delete:
      operationId: deleteModel
      tags:
        - registry
      summary: Delete an AI model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /ai/agents:
