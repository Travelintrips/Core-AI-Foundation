        "204":
          description: Deleted
  /ai/agents/{id}/capabilities:
    get:
      operationId: listAgentCapabilities
      tags:
        - agents
      summary: List capabilities for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAgentCapability"
    post:
      operationId: addAgentCapability
      tags:
        - agents
      summary: Add a capability to an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAgentCapabilityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAgentCapability"
  /ai/agents/{id}/capabilities/{capId}:
    delete:
