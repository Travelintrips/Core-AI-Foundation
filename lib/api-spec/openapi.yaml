              $ref: "#/components/schemas/ClientApprovalInput"
      responses:
        "200":
          description: Project rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientActionResult"

  /public/creative-review/{token}/request-revision:
    post:
      operationId: requestRevisionCreativeReview
      tags: [public]
      summary: Client requests revision
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientApprovalInput"
      responses:
        "200":
          description: Revision requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientActionResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Providers ──────────────────────────────────────────────────────────

    AiProvider:
      type: object
      required: [id, name, slug, baseUrl, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
          description: "e.g. openai, anthropic, gemini, replicate"
        baseUrl:
          type: string
        apiKeyEnvVar:
          type: ["string", "null"]
          description: Name of env var holding the API key
        isActive:
          type: boolean
        metadata:
          type: ["object", "null"]
          description: Extra provider config (JSON)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AiProviderInput:
      type: object
      required: [name, slug, baseUrl]
      properties:
        name:
          type: string
        slug:
          type: string
        baseUrl:
          type: string
        apiKeyEnvVar:
          type: string
        isActive:
          type: boolean
        metadata:
          type: object

    AiProviderUpdate:
      type: object
      properties:
        name:
          type: string
        baseUrl:
          type: string
        apiKeyEnvVar:
          type: string
