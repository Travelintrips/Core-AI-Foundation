        allowedTools:
          type: array
          items:
            type: string
        knowledgeBaseId:
          type: ["integer", "null"]
        version:
          type: string
        owner:
          type: ["string", "null"]
        metadata:
          type: ["object", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AiAgentInput:
      type: object
