components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    Gone:
      description: Resource no longer available (expired or revoked)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    Forbidden:
      description: Action not permitted for this actor
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    Conflict:
      description: State changed concurrently or resource already in a terminal state
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    CpReviewContext:
      type: object
      required: [reviewId, projectId, clientName, reviewStatus, brandName, businessType, documentReady, watermarked, filesUnlocked, totalVersions, totalComments, resolvedComments, pendingComments, comments, sectionsIncluded, sectionsSkipped, qcWarnings, createdAt]
      properties:
        reviewId: { type: integer }
        projectId: { type: string }
        clientName: { type: string }
        reviewStatus: { type: string, enum: [shared, viewed, revision_requested, approved, rejected, revoked] }
        brandName: { type: string }
        businessType: { type: string }
        documentReady: { type: boolean }
        documentVersion: { type: integer, nullable: true }
        documentUrl: { type: string, nullable: true, description: "null when watermarked" }
        watermarked: { type: boolean }
        filesUnlocked: { type: boolean }
        pageCount: { type: integer, nullable: true }
        sectionsIncluded: { type: array, items: { type: string } }
        sectionsSkipped: { type: array, items: { type: string } }
        packageLevel: { type: string, nullable: true }
        pageTarget: { type: integer, nullable: true }
        qcScore: { type: integer, nullable: true }
        qcPassed: { type: boolean, nullable: true }
        qcDimensions: { type: object, nullable: true, additionalProperties: true }
        qcWarnings: { type: array, items: { type: string } }
        currentVersion: { $ref: "#/components/schemas/CpDocumentVersion", nullable: true }
        totalVersions: { type: integer }
        totalComments: { type: integer }
        resolvedComments: { type: integer }
        pendingComments: { type: integer }
        comments:
          type: array
          items: { $ref: "#/components/schemas/CpPageComment" }
        createdAt: { type: string, format: date-time }
        sharedAt: { type: string, format: date-time, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        rejectedAt: { type: string, format: date-time, nullable: true }
        revisionRequestedAt: { type: string, format: date-time, nullable: true }

    CpDocumentVersion:
      type: object
      required: [id, version, versionLabel, sectionsIncluded, approved, createdAt]
      properties:
        id: { type: integer }
        version: { type: integer }
        versionLabel: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        revisionNotes: { type: string, nullable: true }
        sectionsIncluded: { type: array, items: { type: string } }
        qcScore: { type: integer, nullable: true }
        qcPassed: { type: boolean, nullable: true }
        qcDimensions: { type: object, nullable: true, additionalProperties: true }
        approved: { type: boolean }
        approvedAt: { type: string, format: date-time, nullable: true }
        approvedBy: { type: string, nullable: true }
        sentForReviewAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CpPageComment:
      type: object
      required: [id, reviewId, projectId, comment, authorName, authorType, priority, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        reviewId: { type: integer }
        projectId: { type: string }
        documentVersionId: { type: integer, nullable: true }
        parentCommentId: { type: integer, nullable: true, description: "null for top-level comments" }
        pageNumber: { type: integer, nullable: true }
        positionX: { type: number, nullable: true }
        positionY: { type: number, nullable: true }
        sectionId: { type: string, nullable: true, description: "null for page-level comments" }
        comment: { type: string }
        authorName: { type: string }
        authorType: { type: string, enum: [client, admin] }
        priority: { type: string, enum: [low, normal, high, urgent] }
        status: { type: string, enum: [open, resolved, archived] }
        resolvedBy: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CpPageCommentThread:
      allOf:
        - { $ref: "#/components/schemas/CpPageComment" }
        - type: object
          properties:
            replies:
              type: array
              items: { $ref: "#/components/schemas/CpPageComment" }

    CpVersionDiff:
      type: object
      required: [v1, v2, diff]
      properties:
        v1:
          type: object
          required: [version, versionLabel]
          properties:
            version: { type: integer }
            versionLabel: { type: string, nullable: true }
            qcScore: { type: integer, nullable: true }
        v2:
          type: object
          required: [version, versionLabel]
          properties:
            version: { type: integer }
            versionLabel: { type: string, nullable: true }
            qcScore: { type: integer, nullable: true }
        diff:
          type: object
          required: [added, removed, unchanged, totalChanged]
          properties:
            added: { type: array, items: { type: string }, description: "Sections new in v2" }
            removed: { type: array, items: { type: string }, description: "Sections dropped from v1" }
            unchanged: { type: array, items: { type: string }, description: "Sections in both" }
            totalChanged: { type: integer }

    CpAddCommentInput:
      type: object
      required: [comment, authorName]
      properties:
        comment: { type: string, minLength: 1 }
        authorName: { type: string, minLength: 1 }
        pageNumber: { type: integer, nullable: true }
        positionX: { type: number, nullable: true }
        positionY: { type: number, nullable: true }
        sectionId: { type: string, nullable: true }
        parentCommentId: { type: integer, nullable: true, description: "null for top-level comments" }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        documentVersionId: { type: integer, nullable: true }

    CpRevisionInput:
      type: object
      required: [notes]
      properties:
        notes: { type: string, minLength: 1 }
        selectedPages: { type: array, items: { type: integer }, nullable: true }
        selectedSections: { type: array, items: { type: string }, nullable: true }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }

    CpActionResult:
      type: object
      required: [success, status]
      properties:
        success: { type: boolean }
        status: { type: string }

    CpTimelineEvent:
      type: object
      required: [type, label, timestamp]
      properties:
        type: { type: string }
        label: { type: string }
        actor: { type: string, nullable: true }
        meta: { type: object, nullable: true, additionalProperties: true }
        timestamp: { type: string, format: date-time }

    CpReviewStats:
      type: object
      required: [reviewId, reviewStatus, totalVersions, totalComments, openComments, resolvedComments, highPriorityPending, filesUnlocked]
      properties:
        reviewId: { type: integer }
        reviewStatus: { type: string }
        currentVersion: { type: string, nullable: true }
        totalVersions: { type: integer }
        totalComments: { type: integer }
        openComments: { type: integer }
        resolvedComments: { type: integer }
        highPriorityPending: { type: integer }
        commentsByPage: { type: object, additionalProperties: { type: integer } }
        commentsBySection: { type: object, additionalProperties: { type: integer } }
        qcScore: { type: integer, nullable: true }
        qcPassed: { type: boolean, nullable: true }
        filesUnlocked: { type: boolean }
        approvedAt: { type: string, format: date-time, nullable: true }

    CpReviewDashboard:
      type: object
      required: [reviewId, reviewStatus, totalVersions, totalComments, openComments, resolvedComments, pendingRevisions, highPriorityPending, filesUnlocked, approvalStatus]
      properties:
        reviewId: { type: integer }
        reviewStatus: { type: string }
        currentVersion: { type: string, nullable: true }
        totalVersions: { type: integer }
        totalComments: { type: integer }
        openComments: { type: integer }
        resolvedComments: { type: integer }
        pendingRevisions: { type: integer }
        highPriorityPending: { type: integer }
        qcScore: { type: integer, nullable: true }
        qcPassed: { type: boolean, nullable: true }
        filesUnlocked: { type: boolean }
        approvalStatus: { type: string }
        approvedAt: { type: string, format: date-time, nullable: true }
        sharedAt: { type: string, format: date-time, nullable: true }
        revisionRequestedAt: { type: string, format: date-time, nullable: true }

    CompanyProfileConditionalQuestion:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, textarea, multiselect, checklist]
    CompanyProfileQuestionGroup:
      type: object
      required: [key, label, questions]
      properties:
        key:
          type: string
        label:
          type: string
        questions:
          type: array
          items:
