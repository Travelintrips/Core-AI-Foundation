      required: [dispatcherEnabled, workerPollIntervalMs, workerHeartbeatIntervalMs, workerTimeoutMs, jobTimeoutMs, maxConcurrentJobs]
      properties:
        dispatcherEnabled:         { type: boolean }
        workerPollIntervalMs:      { type: integer, minimum: 100 }
        workerHeartbeatIntervalMs: { type: integer, minimum: 100 }
        workerTimeoutMs:           { type: integer, minimum: 1000 }
        jobTimeoutMs:              { type: integer, minimum: 1000 }
        maxConcurrentJobs:         { type: integer, minimum: 1, maximum: 50 }


    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
