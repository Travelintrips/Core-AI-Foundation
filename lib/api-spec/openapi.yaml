    post:
      operationId: runDispatcherTick
      tags: [dispatcher]
      summary: Execute one dispatch cycle immediately
      responses:
        "200":
          description: Dispatcher status plus tick result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DispatcherStatus"
                  - type: object
                    required: [tick]
                    properties:
                      tick:
                        type: object
                        required: [claimed, completed, failed]
                        properties:
                          claimed:   { type: integer }
                          completed: { type: integer }
                          failed:    { type: integer }
        "500":
          description: Tick failed

