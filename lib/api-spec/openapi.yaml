          type: boolean
        metadata:
          type: object

    # ── Models ─────────────────────────────────────────────────────────────

    AiModel:
      type: object
      required: [id, providerId, name, modelId, capabilities, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        providerId:
          type: integer
        providerName:
          type: ["string", "null"]
        name:
          type: string
          description: Human-friendly name
        modelId:
          type: string
          description: Provider model identifier (e.g. gpt-4o, claude-3-5-sonnet)
        capabilities:
          type: array
          items:
            type: string
          description: "e.g. [text, vision, code, embeddings]"
        contextWindow:
          type: ["integer", "null"]
        maxOutputTokens:
          type: ["integer", "null"]
        costPerInputToken:
          type: ["number", "null"]
        costPerOutputToken:
          type: ["number", "null"]
        isActive:
          type: boolean
        metadata:
          type: ["object", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AiModelInput:
      type: object
      required: [providerId, name, modelId, capabilities]
      properties:
        providerId:
          type: integer
        name:
          type: string
        modelId:
          type: string
        capabilities:
          type: array
          items:
            type: string
        contextWindow:
          type: integer
        maxOutputTokens:
          type: integer
        costPerInputToken:
          type: number
        costPerOutputToken:
          type: number
        isActive:
          type: boolean
        metadata:
          type: object

    AiModelUpdate:
      type: object
      properties:
        name:
          type: string
        capabilities:
          type: array
          items:
            type: string
        contextWindow:
          type: integer
        maxOutputTokens:
          type: integer
        costPerInputToken:
          type: number
        costPerOutputToken:
          type: number
        isActive:
          type: boolean
        metadata:
          type: object

    # ── Agents ─────────────────────────────────────────────────────────────

    AiAgent:
      type: object
      required: [id, name, slug, role, status, priority, allowedTools, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        role:
          type: string
        description:
          type: ["string", "null"]
        providerId:
          type: ["integer", "null"]
        providerName:
          type: ["string", "null"]
        modelId:
          type: ["integer", "null"]
        modelName:
          type: ["string", "null"]
        priority:
          type: integer
          description: Higher = higher priority. 100 is default.
        temperature:
          type: ["number", "null"]
          description: Sampling temperature (0–2)
        maxTokens:
          type: ["integer", "null"]
        status:
          type: string
