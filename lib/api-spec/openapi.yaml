        enabled:        { type: boolean }
        running:        { type: boolean }
        workerCount:    { type: integer }
        idleWorkers:    { type: integer }
        busyWorkers:    { type: integer }
        queueLength:    { type: integer }
        runningJobs:    { type: integer }
        lastTick:       { type: ["string", "null"] }
        lastHeartbeat:  { type: ["string", "null"] }
        processedToday: { type: integer }
        failedToday:    { type: integer }

