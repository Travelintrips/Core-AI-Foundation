        notes:
          type: [string, "null"]
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AiInvoice:
      type: object
      required:
        - id
        - invoiceNumber
        - projectId
        - invoiceType
        - amount
        - currency
        - status
        - issuedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        projectId:
          type: integer
        paymentScheduleId:
          type: [integer, "null"]
        invoiceType:
          type: string
          description: deposit | remaining | final | credit_note | receipt
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
          description: draft | issued | paid | void
        lineItemsJson:
          type: [array, "null"]
          items:
            type: object
            properties:
              label:
                type: string
              amount:
                type: number
        issuedAt:
          type: string
          format: date-time
        paidAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaymentKpi:
      type: object
      required: [paidRevenue, outstandingBalance, pendingVerificationCount, lockedProjects, unlockedProjects]
      properties:
        paidRevenue:
          type: number
        outstandingBalance:
          type: number
        pendingVerificationCount:
          type: integer
        lockedProjects:
          type: integer
        unlockedProjects:
          type: integer
    PaymentRejectInput:
      type: object
      required: [rejectedBy, reason]
      properties:
        rejectedBy:
          type: string
        reason:
          type: string
    ManualUnlockInput:
      type: object
      required: [unlockedBy]
      properties:
        unlockedBy:
          type: string
        reason:
          type: string
    GenerateTokenInput:
      type: object
      required: [projectId, fileUrl]
      properties:
        projectId:
