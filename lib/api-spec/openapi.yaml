openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Platform Enterprise API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: registry
    description: AI Provider and Model Registry
  - name: orchestrator
    description: AI Orchestrator - routing and execution
  - name: workflows
    description: AI Workflow Engine
  - name: prompts
    description: AI Prompt Library
  - name: knowledge
    description: AI Knowledge Base
  - name: memory
    description: AI Memory
  - name: audit
    description: AI Audit Log
  - name: analytics
    description: AI Analytics
  - name: settings
    description: AI Settings
  - name: agents
  - name: creative-ai
    description: Creative AI Workflow Engine
  - name: capabilities
    description: AI Capability Matrix
  - name: client-memory
    description: Client Long-Term Memory
  - name: feedback
    description: Human Feedback Loop
  - name: client-review
    description: Client Review Portal — share project results with clients for approval
  - name: public
    description: Public endpoints — token-protected, no admin key required

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── REGISTRY: Providers ───────────────────────────────────────────────────

  /ai/providers:
    get:
      operationId: listProviders
      tags: [registry]
      summary: List all AI providers
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProvider"
    post:
      operationId: createProvider
      tags: [registry]
      summary: Register a new AI provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"

  /ai/providers/{id}:
    get:
      operationId: getProvider
      tags: [registry]
      summary: Get an AI provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
    patch:
      operationId: updateProvider
      tags: [registry]
      summary: Update an AI provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
    delete:
      operationId: deleteProvider
      tags: [registry]
      summary: Delete an AI provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── REGISTRY: Models ──────────────────────────────────────────────────────

  /ai/models:
    get:
      operationId: listModels
      tags: [registry]
      summary: List all AI models
      parameters:
        - name: providerId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModel"
    post:
      operationId: createModel
      tags: [registry]
      summary: Register a new AI model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"

  /ai/models/{id}:
    get:
      operationId: getModel
      tags: [registry]
      summary: Get an AI model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
    patch:
      operationId: updateModel
      tags: [registry]
      summary: Update an AI model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
    delete:
      operationId: deleteModel
      tags: [registry]
      summary: Delete an AI model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── AGENTS ────────────────────────────────────────────────────────────────

  /ai/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all AI agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAgent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Register a new AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAgentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAgent"

  /ai/agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get an AI agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAgent"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an AI agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAgentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAgent"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an AI agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /ai/agents/{id}/capabilities:
    get:
      operationId: listAgentCapabilities
      tags: [agents]
      summary: List capabilities for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAgentCapability"
    post:
      operationId: addAgentCapability
      tags: [agents]
      summary: Add a capability to an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAgentCapabilityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAgentCapability"

  /ai/agents/{id}/capabilities/{capId}:
    delete:
      operationId: deleteAgentCapability
      tags: [agents]
      summary: Remove a capability from an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: capId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── ORCHESTRATOR ──────────────────────────────────────────────────────────

  /ai/orchestrator/execute:
    post:
      operationId: orchestratorExecute
      tags: [orchestrator]
      summary: Execute an AI request through the orchestrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchestratorExecuteInput"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestratorResult"

  /ai/orchestrator/sessions:
    get:
      operationId: listOrchestratorSessions
      tags: [orchestrator]
      summary: List orchestrator sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrchestratorSession"

  /ai/orchestrator/sessions/{id}:
    get:
      operationId: getOrchestratorSession
      tags: [orchestrator]
      summary: Get an orchestrator session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestratorSession"

  # ─── WORKFLOWS ─────────────────────────────────────────────────────────────

  /ai/workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List all AI workflows
      responses:
        "200":
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiWorkflow"
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Create a new workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiWorkflowInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiWorkflow"

  /ai/workflows/{id}:
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Get a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiWorkflow"
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiWorkflowUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiWorkflow"
    delete:
      operationId: deleteWorkflow
      tags: [workflows]
      summary: Delete a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /ai/workflows/{id}/execute:
    post:
      operationId: executeWorkflow
      tags: [workflows]
      summary: Execute a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowExecuteInput"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"

  /ai/workflow-executions:
    get:
      operationId: listWorkflowExecutions
      tags: [workflows]
      summary: List workflow executions
      parameters:
        - name: workflowId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowExecution"

  /ai/workflow-executions/{id}:
    get:
      operationId: getWorkflowExecution
      tags: [workflows]
      summary: Get a workflow execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"

  # ─── PROMPTS ───────────────────────────────────────────────────────────────

  /ai/prompts:
    get:
      operationId: listPrompts
      tags: [prompts]
      summary: List all prompts
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiPrompt"
    post:
      operationId: createPrompt
      tags: [prompts]
      summary: Create a new prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPromptInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPrompt"

  /ai/prompts/{id}:
    get:
      operationId: getPrompt
      tags: [prompts]
      summary: Get a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPrompt"
    patch:
      operationId: updatePrompt
      tags: [prompts]
      summary: Update a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPromptUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPrompt"
    delete:
      operationId: deletePrompt
      tags: [prompts]
      summary: Delete a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /ai/prompts/{id}/versions:
    get:
      operationId: listPromptVersions
      tags: [prompts]
      summary: List prompt versions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiPromptVersion"
    post:
      operationId: createPromptVersion
      tags: [prompts]
      summary: Create a new version of a prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPromptVersionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPromptVersion"

  # ─── KNOWLEDGE BASE ────────────────────────────────────────────────────────

  /ai/knowledge-bases:
    get:
      operationId: listKnowledgeBases
      tags: [knowledge]
      summary: List all knowledge bases
      responses:
        "200":
          description: List of knowledge bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
    post:
      operationId: createKnowledgeBase
      tags: [knowledge]
      summary: Create a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"

  /ai/knowledge-bases/{id}:
    get:
      operationId: getKnowledgeBase
      tags: [knowledge]
      summary: Get a knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
    patch:
      operationId: updateKnowledgeBase
      tags: [knowledge]
      summary: Update a knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
    delete:
      operationId: deleteKnowledgeBase
      tags: [knowledge]
      summary: Delete a knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /ai/knowledge-bases/{id}/documents:
    get:
      operationId: listKnowledgeDocuments
      tags: [knowledge]
      summary: List documents in a knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeDocument"
    post:
      operationId: addKnowledgeDocument
      tags: [knowledge]
      summary: Add a document to a knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeDocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"

  /ai/knowledge-bases/{kbId}/documents/{docId}:
    delete:
      operationId: deleteKnowledgeDocument
      tags: [knowledge]
      summary: Delete a document from a knowledge base
      parameters:
        - name: kbId
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── MEMORY ────────────────────────────────────────────────────────────────

  /ai/memory:
    get:
      operationId: listMemoryEntries
      tags: [memory]
      summary: List memory entries
      parameters:
        - name: agentId
          in: query
          schema:
            type: ["string", "null"]
        - name: sessionId
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of memory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryEntry"
    post:
      operationId: createMemoryEntry
      tags: [memory]
      summary: Create a memory entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"

  /ai/memory/{id}:
    get:
      operationId: getMemoryEntry
      tags: [memory]
      summary: Get a memory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Memory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
    delete:
      operationId: deleteMemoryEntry
      tags: [memory]
      summary: Delete a memory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── AUDIT LOG ─────────────────────────────────────────────────────────────

  /ai/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs
      parameters:
        - name: module
          in: query
          schema:
            type: ["string", "null"]
        - name: action
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  # ─── ANALYTICS ─────────────────────────────────────────────────────────────

  /ai/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get platform-level analytics overview
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /ai/analytics/usage:
    get:
      operationId: getAnalyticsUsage
      tags: [analytics]
      summary: Get usage statistics over time
      parameters:
        - name: days
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Usage data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageDataPoint"

  /ai/analytics/provider-breakdown:
    get:
      operationId: getProviderBreakdown
      tags: [analytics]
      summary: Get token usage breakdown by provider
      responses:
        "200":
          description: Provider breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderBreakdown"

  # ─── SETTINGS ──────────────────────────────────────────────────────────────

  /ai/settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: List all platform settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiSetting"

  /ai/settings/{key}:
    get:
      operationId: getSetting
      tags: [settings]
      summary: Get a specific setting
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSetting"
    put:
      operationId: upsertSetting
      tags: [settings]
      summary: Create or update a setting
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingInput"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSetting"
    delete:
      operationId: deleteSetting
      tags: [settings]
      summary: Delete a setting
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── CREATIVE AI ───────────────────────────────────────────────────────────

  /creative-ai/brief:
    post:
      operationId: createCreativeBrief
      tags: [creative-ai]
