  # ── V4.2C Company Profile Review (public token-auth) ─────────────────────────

  /public/cp-review/{token}:
    get:
      tags: [client-review]
      operationId: getPublicCpReview
      summary: Get CP review context
      description: Resolve the review token, mark as viewed, and return full context including document state, versions, comments, and QC scores.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Review context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CpReviewContext" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /public/cp-review/{token}/pdf:
    get:
      tags: [client-review]
      operationId: getCpReviewPdf
      summary: Serve PDF (watermarked or clean redirect)
      description: |
        If filesUnlocked is false, returns a server-rendered watermarked PDF binary.
        If filesUnlocked is true, redirects (302) to the clean Supabase signed URL.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Watermarked PDF bytes
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to clean signed URL
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /public/cp-review/{token}/versions:
    get:
      tags: [client-review]
      operationId: getCpReviewVersions
      summary: List all document versions
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: List of document versions (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CpDocumentVersion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/cp-review/{token}/versions/{versionId}:
    get:
      tags: [client-review]
      operationId: getCpReviewVersionById
      summary: Get a single document version by version number
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Document version detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CpDocumentVersion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/cp-review/{token}/versions/compare:
    get:
      tags: [client-review]
      operationId: compareCpReviewVersions
      summary: Section-level diff between two versions
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: v1, in: query, required: true, schema: { type: integer }, description: Base version number }
        - { name: v2, in: query, required: true, schema: { type: integer }, description: Compare version number }
      responses:
        "200":
          description: Version diff result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CpVersionDiff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/cp-review/{token}/comments:
    get:
      tags: [client-review]
      operationId: getCpReviewComments
      summary: List comments with threaded replies
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, nullable: true }, description: Filter by page number }
        - { name: section, in: query, required: false, schema: { type: string, nullable: true }, description: Filter by section key }
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, resolved, archived], nullable: true } }
      responses:
        "200":
          description: Threaded comment list
          content:
            application/json:
              schema:
                type: object
                required: [total, open, resolved, comments]
                properties:
                  total: { type: integer }
                  open: { type: integer }
                  resolved: { type: integer }
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/CpPageCommentThread" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [client-review]
      operationId: addCpReviewComment
      summary: Add a page or section comment
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CpAddCommentInput" }
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CpPageComment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/cp-review/{token}/comments/{commentId}:
    patch:
      tags: [client-review]
      operationId: patchCpReviewComment
      summary: Edit or resolve/reopen a comment (client only)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: commentId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, minLength: 1 }
                status: { type: string, enum: [open, resolved, archived] }
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CpPageComment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [client-review]
      operationId: deleteCpReviewComment
      summary: Delete own open comment
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: commentId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /public/cp-review/{token}/approve:
    post:
      tags: [client-review]
      operationId: approveCpReview
      summary: Approve document — requires confirmed:true checkbox
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
                  enum: [true]
                  description: Must be true — customer must check the approval checkbox
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CpActionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /public/cp-review/{token}/request-revision:
    post:
      tags: [client-review]
      operationId: requestCpReviewRevision
      summary: Request a revision with structured notes
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CpRevisionInput" }
      responses:
        "200":
          description: Revision requested
          content:
            application/json:
              schema:
                type: object
                required: [success, status]
                properties:
                  success: { type: boolean }
                  status: { type: string }
                  pages: { type: array, items: { type: integer } }
                  sections: { type: array, items: { type: string } }
                  priority: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /public/cp-review/{token}/reject:
    post:
      tags: [client-review]
      operationId: rejectCpReview
      summary: Reject document — requires reason
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: Detailed reason for rejection (required)
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CpActionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /public/cp-review/{token}/timeline:
    get:
      tags: [client-review]
      operationId: getCpReviewTimeline
      summary: Full chronological event timeline
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: object
                required: [reviewId, projectId, reviewStatus, totalEvents, events]
                properties:
                  reviewId: { type: integer }
                  projectId: { type: string }
                  reviewStatus: { type: string }
                  totalEvents: { type: integer }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/CpTimelineEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/cp-review/{token}/stats:
    get:
      tags: [client-review]
      operationId: getCpReviewStats
      summary: Review KPI stats (comment counts, QC, payment lock)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Review stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CpReviewStats" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/cp-review/{token}/dashboard:
    get:
      tags: [client-review]
      operationId: getCpReviewDashboard
      summary: Review KPI dashboard (extended stats)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Dashboard KPIs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CpReviewDashboard" }
        "404": { $ref: "#/components/responses/NotFound" }

