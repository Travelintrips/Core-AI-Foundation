# Candidate snippet only. Do NOT include in the live vhost until the Core-AI
# route, Owner UI, feature flag, SQL grants and DEV security review all pass.
# Place inside the dev-ai-task.cstlogistic.co.id HTTPS server block.

location = /api/gpt02-owner-approval/prepare {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:18082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 4s;
    proxy_read_timeout 12s;
    add_header Cache-Control "no-store" always;
}

location = /api/gpt02-owner-approval/approve {
    limit_except POST { deny all; }
