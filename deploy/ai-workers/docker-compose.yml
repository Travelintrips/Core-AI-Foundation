name: ${COMPOSE_PROJECT_NAME:-ai-core-workers}

services:
  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    networks:
      - temporal-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.32.0}
    restart: "on-failure:6"
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: temporal-db
      SQL_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
    networks:
      - temporal-data
    volumes:
      - ./temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.32.0}
    restart: unless-stopped
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: temporal-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:${TEMPORAL_GRPC_PORT:-7233}:7233"
    networks:
      - temporal-data
      - control
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.32.0}
    restart: "on-failure:5"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    networks:
      - temporal-data
    volumes:
      - ./temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.54.1}
    restart: unless-stopped
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_CORS_ORIGINS:-http://127.0.0.1:8233}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"
    networks:
      - control

  temporal-coding-worker:
    image: ai-core-temporal-coding-worker:${TEMPORAL_CODING_WORKER_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: temporal/coding-worker.Dockerfile
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      AI_CORE_BASE_URL: ${AI_CORE_BASE_URL:-https://aicore.cstlogistic.co.id/api}
      AI_CORE_TEMPORAL_CODING_TOKEN: ${AI_CORE_TEMPORAL_CODING_TOKEN:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_CODING_TASK_QUEUE: ${TEMPORAL_CODING_TASK_QUEUE:-ai-core-coding-orchestrator}
      TEMPORAL_CODING_DISCOVERY_SECONDS: ${TEMPORAL_CODING_DISCOVERY_SECONDS:-5}
      TEMPORAL_CODING_CYCLE_SECONDS: ${TEMPORAL_CODING_CYCLE_SECONDS:-8}
      TEMPORAL_CODING_LEASE_SECONDS: ${TEMPORAL_CODING_LEASE_SECONDS:-90}
    networks:
      - control
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:?set N8N_POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    networks:
      - n8n-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.40.7}
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:?set N8N_POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-Asia/Jakarta}
      TZ: ${TZ:-Asia/Jakarta}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      AI_CORE_BASE_URL: ${AI_CORE_BASE_URL:-https://aicore.cstlogistic.co.id/api}
      AI_CORE_SCOPED_AGENT_TOKEN: ${AI_CORE_SCOPED_AGENT_TOKEN:-}
    volumes:
      - n8n-state:/home/node/.n8n
      - ./n8n:/opt/ai-core-n8n:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    networks:
      - n8n-data
      - control
    security_opt:
      - no-new-privileges:true

  openhands:
    image: ghcr.io/openhands/agent-canvas:${OPENHANDS_VERSION:-1.24.0}
    restart: unless-stopped
    init: true
    environment:
      LOCAL_BACKEND_API_KEY: ${OPENHANDS_LOCAL_BACKEND_API_KEY:?set OPENHANDS_LOCAL_BACKEND_API_KEY}
      LLM_MODEL: ${OPENHANDS_LLM_MODEL:-}
      LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      AI_CORE_BASE_URL: ${AI_CORE_BASE_URL:-https://aicore.cstlogistic.co.id/api}
      AI_CORE_SCOPED_AGENT_TOKEN: ${AI_CORE_SCOPED_AGENT_TOKEN:-}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - openhands-state:/home/openhands/.openhands
      - "${OPENHANDS_PROJECTS_PATH:-/opt/ai-workers/projects}:/projects"
    ports:
      - "127.0.0.1:${OPENHANDS_PORT:-8000}:8000"
    networks:
      - control
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN

  openclaw:
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_VERSION:-2026.9.6}
    restart: unless-stopped
    init: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_CORE_BASE_URL: ${AI_CORE_BASE_URL:-https://aicore.cstlogistic.co.id/api}
      AI_CORE_SCOPED_AGENT_TOKEN: ${AI_CORE_SCOPED_AGENT_TOKEN:-}
      AI_CORE_AGENT_WORK_POLL_MS: ${AI_CORE_AGENT_WORK_POLL_MS:-5000}
      OPENCLAW_WORK_TIMEOUT_SECONDS: ${OPENCLAW_WORK_TIMEOUT_SECONDS:-180}
      CUSTOM_API_KEY: ${AI_CORE_SCOPED_AGENT_TOKEN:-}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - openclaw-state:/home/node/.openclaw
      - openclaw-auth:/home/node/.config/openclaw
      - ./openclaw-supervisor.mjs:/app/openclaw-supervisor.mjs:ro
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-18789}:18789"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - control
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    command: ["node", "/app/openclaw-supervisor.mjs"]


  openhands-work-supervisor:
    image: python:3.13-slim
    restart: unless-stopped
    depends_on:
      openhands:
        condition: service_started
    environment:
      AI_CORE_BASE_URL: ${AI_CORE_BASE_URL:-https://aicore.cstlogistic.co.id/api}
      AI_CORE_SCOPED_AGENT_TOKEN: ${AI_CORE_SCOPED_AGENT_TOKEN:-}
      AI_CORE_EXTERNAL_AGENT_CLIENT_ID: gcp-openhands-coder
      AI_CORE_EXTERNAL_AGENT_RUNTIME: openhands
      AI_CORE_AGENT_WORK_POLL_SECONDS: ${AI_CORE_AGENT_WORK_POLL_SECONDS:-5}
      AI_CORE_AGENT_WORK_LEASE_SECONDS: ${AI_CORE_AGENT_WORK_LEASE_SECONDS:-120}
      AI_CORE_AGENT_WORK_TIMEOUT_SECONDS: ${OPENHANDS_WORK_TIMEOUT_SECONDS:-180}
      OPENHANDS_INTERNAL_URL: http://openhands:8000
      OPENHANDS_LOCAL_BACKEND_API_KEY: ${OPENHANDS_LOCAL_BACKEND_API_KEY:?set OPENHANDS_LOCAL_BACKEND_API_KEY}
      OPENHANDS_LLM_MODEL: ${OPENHANDS_LLM_MODEL:-openai/ai-core-agent}
      OPENHANDS_LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
      OPENHANDS_LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      OPENHANDS_AI_CORE_WORKSPACE: /projects
    volumes:
      - ./external-agent-supervisor.py:/app/external-agent-supervisor.py:ro
    command: ["python", "/app/external-agent-supervisor.py"]
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  n8n-work-supervisor:
    image: python:3.13-slim
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    environment:
      AI_CORE_BASE_URL: ${AI_CORE_BASE_URL:-https://aicore.cstlogistic.co.id/api}
      AI_CORE_SCOPED_AGENT_TOKEN: ${AI_CORE_SCOPED_AGENT_TOKEN:-}
      AI_CORE_EXTERNAL_AGENT_CLIENT_ID: gcp-n8n-automation
      AI_CORE_EXTERNAL_AGENT_RUNTIME: n8n
      AI_CORE_AGENT_WORK_POLL_SECONDS: ${AI_CORE_AGENT_WORK_POLL_SECONDS:-5}
      AI_CORE_AGENT_WORK_LEASE_SECONDS: ${AI_CORE_AGENT_WORK_LEASE_SECONDS:-120}
      AI_CORE_AGENT_WORK_TIMEOUT_SECONDS: ${N8N_WORK_TIMEOUT_SECONDS:-60}
      N8N_AGENT_WORK_WEBHOOK_URL: http://n8n:5678/webhook/ai-core-external-work
    volumes:
      - ./external-agent-supervisor.py:/app/external-agent-supervisor.py:ro
    command: ["python", "/app/external-agent-supervisor.py"]
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  agent-registrar:
    image: python:3.13-slim
    restart: unless-stopped
    depends_on:
      openclaw:
        condition: service_started
      openhands:
        condition: service_started
      n8n:
        condition: service_started
    environment:
      AI_CORE_BASE_URL: ${AI_CORE_BASE_URL:-https://aicore.cstlogistic.co.id/api}
      AI_CORE_SCOPED_AGENT_TOKEN: ${AI_CORE_SCOPED_AGENT_TOKEN:-}
      AI_CORE_AGENT_HEARTBEAT_SECONDS: ${AI_CORE_AGENT_HEARTBEAT_SECONDS:-20}
      AI_CORE_AGENT_HEALTH_TIMEOUT_SECONDS: ${AI_CORE_AGENT_HEALTH_TIMEOUT_SECONDS:-5}
      OPENHANDS_LOCAL_BACKEND_API_KEY: ${OPENHANDS_LOCAL_BACKEND_API_KEY:?set OPENHANDS_LOCAL_BACKEND_API_KEY}
      OPENCLAW_VERSION: ${OPENCLAW_VERSION:-2026.9.6}
      OPENHANDS_VERSION: ${OPENHANDS_VERSION:-1.24.0}
      N8N_VERSION: ${N8N_VERSION:-2.40.7}
    volumes:
      - ./agent-registrar.py:/app/agent-registrar.py:ro
    command: ["python", "/app/agent-registrar.py"]
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  control:
    driver: bridge
  temporal-data:
    driver: bridge
    internal: true
  n8n-data:
    driver: bridge
    internal: true

volumes:
  temporal-db-data:
  n8n-db-data:
  n8n-state:
  openhands-state:
  openclaw-state:
  openclaw-auth:
