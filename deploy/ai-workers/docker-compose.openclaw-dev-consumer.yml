# DEV-only external work consumer. Never deploy with production credentials.
# Provision /etc/cst-secrets/openclaw-dev-consumer.env via approved secret management:
# AI_CORE_SCOPED_AGENT_TOKEN and OPENCLAW_GATEWAY_TOKEN.
# This compose file does NOT start or reconfigure the existing PROD registrar or OpenClaw.
services:
  dev-openclaw-work-consumer:
    image: python:3.13-slim
    restart: unless-stopped
    env_file:
      - /etc/cst-secrets/openclaw-dev-consumer.env
    environment:
      AI_CORE_BASE_URL: http://core-ai-dev:3000/api
      AI_CORE_EXTERNAL_AGENT_CLIENT_ID: openclaw-vps-main
      AI_CORE_EXTERNAL_AGENT_RUNTIME: openclaw
      AI_CORE_AGENT_WORK_POLL_SECONDS: "5"
      AI_CORE_AGENT_WORK_LEASE_SECONDS: "120"
      AI_CORE_AGENT_WORK_TIMEOUT_SECONDS: "180"
      OPENCLAW_INTERNAL_URL: http://ai-core-workers-openclaw-1:18789
    volumes:
      - ./external-agent-supervisor.py:/app/external-agent-supervisor.py:ro
    command: ["python", "/app/external-agent-supervisor.py"]
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 96m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  control:
    external: true
    name: ai-core-workers_control
