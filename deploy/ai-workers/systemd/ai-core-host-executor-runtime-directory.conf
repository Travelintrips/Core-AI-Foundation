# systemd drop-in for ai-core-host-executor.service
# Keep the existing HOST_EXECUTOR_SOCKET=/run/ai-core-host-executor/executor.sock.
# /run is ephemeral and disappears on reboot; systemd must recreate this
# private root-owned directory before ExecStart.
[Service]
RuntimeDirectory=ai-core-host-executor
RuntimeDirectoryMode=0700
