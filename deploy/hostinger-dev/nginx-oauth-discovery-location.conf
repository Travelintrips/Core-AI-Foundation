# Include inside DEV-only HTTPS Nginx server blocks for:
# dev.cstlogistic.co.id and dev-aicore.cstlogistic.co.id.
# Preserve the existing /.well-known/acme-challenge/ exception.
# Do not add this snippet to PROD vhosts.
location ^~ /.well-known/ {
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
