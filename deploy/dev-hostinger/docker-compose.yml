services:
  ai-core-dev:
    build:
      context: ../..
      dockerfile: deploy/dev-hostinger/Dockerfile
    image: ai-core-dev:develop
    container_name: ai-core-dev
    group_add:
      - "999"
    env_file:
      - ../../.env.dev
    environment:
      NODE_ENV: development
      APP_ENV: development
      SERVE_FRONTEND: "true"
      SERVE_STATIC_FRONTEND: "true"
      PORT: "8080"
      PUBLIC_APP_URL: https://dev.cstlogistic.co.id
      ALLOWED_ORIGINS: https://dev.cstlogistic.co.id,https://dev-aicore.cstlogistic.co.id
      AI_PROVIDER_BILLING_MONITOR_ENABLED: "false"
      GCP_OLLAMA_AUTOSTART_ENABLED: "false"
      GCP_CODING_WORKER_AUTOSTART_ENABLED: "false"
      OLLAMA_WORKER_RUNTIME_ENABLED: "false"
      GPT02_ISSUER_READER_SOCKET_GID: "999"
    volumes:
      - type: bind
        source: /run/gpt02-issuer-reader
        target: /run/gpt02-issuer-reader
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    restart: unless-stopped
