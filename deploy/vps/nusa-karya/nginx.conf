server {
    listen 80;
    listen [::]:80;
    server_name nusakarya.aicst.co.id;

    root /var/www/nusa-karya;
    index index.html;

    access_log /var/log/nginx/nusakarya.access.log;
    error_log /var/log/nginx/nusakarya.error.log warn;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"nusa-karya"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /app.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /styles.css {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:jpg|jpeg|png|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
