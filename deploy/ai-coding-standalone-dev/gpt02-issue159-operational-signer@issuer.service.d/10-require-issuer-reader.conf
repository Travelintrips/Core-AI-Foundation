# GPT02 Issue159 / CST-DEV: issuer ONLY (source-only, NOT installed).
# This mandatory instance-specific drop-in must accompany the common @.service.
# All approval/Hub/Core signers use only the original trusted readers.
# Issuer alone cannot start before the issuer reader's separate custody/opt-in.
[Unit]
After=gpt02-issue159-issuer-reader.service
Requires=gpt02-issue159-issuer-reader.service
ConditionPathExists=/run/gpt02-issuer-reader/reader.sock

[Service]
BindReadOnlyPaths=/run/gpt02-issuer-reader
