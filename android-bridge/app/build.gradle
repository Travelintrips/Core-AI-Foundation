plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'id.cst.openclawbridge'
    compileSdk 35
    defaultConfig { applicationId 'id.cst.openclawbridge.autosend'; minSdk 26; targetSdk 35; versionCode 17; versionName '0.9.2-dev-fcm' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.2'
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-messaging'
}
