plugins { id 'com.android.application' }

// A stable DEV signing identity is mandatory. Never silently fall back to the
// Android/Gradle autogenerated debug keystore: that breaks APK upgrades.
def devKeystoreFile = System.getenv('ANDROID_DEV_SIGNING_KEYSTORE_FILE')
def devSigningPassword = System.getenv('ANDROID_DEV_SIGNING_PASSWORD')
def devSigningAlias = System.getenv('ANDROID_DEV_SIGNING_ALIAS')
if (!devKeystoreFile || !devSigningPassword || !devSigningAlias ||
    !file(devKeystoreFile).isFile()) {
    throw new GradleException('Android DEV signing is not configured: set keystore file, password and alias (never commit signing material).')
}

android {
    namespace 'id.cst.openclawbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'id.cst.openclawbridge.autosend'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '0.11.1-dev-direct-chrome'
    }
    signingConfigs {
        stableDev {
            storeFile file(devKeystoreFile)
            storePassword devSigningPassword
            keyAlias devSigningAlias
            keyPassword devSigningPassword
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.stableDev
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
