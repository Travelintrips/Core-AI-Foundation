kind = "web"
previewPath = "/cargo-finder/"
title = "Cargo Rate Finder"
version = "1.0.0"
id = "artifacts/cargo-finder"
router = "path"

[[services]]
name = "web"
paths = [ "/cargo-finder/" ]
localPort = 20404

[services.development]
run = "pnpm --filter @workspace/cargo-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cargo-finder", "run", "build" ]
serve = "static"
publicDir = "artifacts/cargo-finder/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20404"
BASE_PATH = "/cargo-finder/"
