openapi: 3.1.0
info:
  title: Team 17 — Interior Design Planning API
  version: "1.1.0"
  description: |
    API for the Interior Design Planning domain.
    Supports 9 room types (living_room, bedroom, kitchen, office, cafe, restaurant, hotel, lobby, booth).
    Outputs are design concepts only — NOT construction drawings or pricing (RAB).

tags:
  - name: interior-design-public
    description: Public endpoints (no admin auth — under /api/public/interior-design/)
  - name: interior-design-admin
    description: Admin endpoints (x-admin-api-key required — under /api/ai/interior-design/)

paths:
  # ── Public ──────────────────────────────────────────────────────────────────

  /api/public/interior-design/projects:
    post:
      tags: [interior-design-public]
      operationId: createInteriorDesignProject
      summary: Create a project and optionally submit a brief in one request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        "201":
          description: Project (and optional brief) created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/ServerError'

  /api/public/interior-design/projects/{id}/brief:
    post:
      tags: [interior-design-public]
      operationId: submitInteriorDesignBrief
      summary: Submit or update the brief for an existing project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefInput'
      responses:
        "200":
          description: Brief saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief:
                    $ref: '#/components/schemas/Brief'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/ServerError'

  /api/public/interior-design/projects/{id}/outputs:
    get:
      tags: [interior-design-public]
      operationId: getInteriorDesignOutputs
      summary: View the latest outputs for a project (concept only)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        "200":
          description: Project, brief, and latest output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProjectDetail'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/ServerError'

  # ── Admin ────────────────────────────────────────────────────────────────────

  /api/ai/interior-design/projects:
    get:
      tags: [interior-design-admin]
      operationId: listInteriorDesignProjects
      summary: List all interior design projects (paginated)
      security:
        - adminApiKey: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: roomType
          in: query
          schema:
            $ref: '#/components/schemas/RoomType'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/ServerError'

  /api/ai/interior-design/projects/{id}:
    get:
      tags: [interior-design-admin]
      operationId: getInteriorDesignProject
      summary: Get project with brief and latest output
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        "200":
          description: Full project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProjectDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/ServerError'

    patch:
      tags: [interior-design-admin]
      operationId: updateInteriorDesignProject
      summary: Update project fields (status, notes, etc.)
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/ServerError'

  /api/ai/interior-design/projects/{id}/generate:
    post:
      tags: [interior-design-admin]
      operationId: generateInteriorDesignOutputs
      summary: Trigger AI output generation for a project
      description: |
        Generates: moodboard, space plan, furniture placement, circulation analysis,
        material & lighting recommendations, visual concept, vendor categories,
        validation results, and safety disclaimers.
        Does NOT generate pricing or RAB.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        "200":
          description: Generated output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Project already in a terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: No brief submitted yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          $ref: '#/components/responses/ServerError'

  /api/ai/interior-design/projects/{id}/outputs:
    get:
      tags: [interior-design-admin]
      operationId: listInteriorDesignOutputs
      summary: List all output generations for a project
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        "200":
          description: Output history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Output'
                  total:
                    type: integer
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/ServerError'

  # ── WP-11: approved export packages ─────────────────────────────────────────

  /api/ai/interior-design/projects/{projectUuid}/exports:
    post:
      tags: [interior-design-admin]
      operationId: requestInteriorDesignExport
      summary: Queue an export package from the approved project snapshot
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectUuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteriorExportRequest'
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteriorExportMutationResponse'
        "200":
          description: Existing idempotent export returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteriorExportMutationResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "404":
          $ref: '#/components/responses/NotFound'

    get:
      tags: [interior-design-admin]
      operationId: listInteriorDesignExports
      summary: List recent export packages for an Interior Design project
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/ProjectUuid'
      responses:
        "200":
          description: Recent export packages
          content:
            application/json:
              schema:
                type: object
                required: [exports]
                properties:
                  exports:
                    type: array
                    items:
                      $ref: '#/components/schemas/InteriorExportPackage'
        "400":
          $ref: '#/components/responses/BadRequest'

  /api/ai/interior-design/exports/{id}:
    get:
      tags: [interior-design-admin]
      operationId: getInteriorDesignExport
      summary: Get export package status and a safe signed download URL
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        "200":
          description: Export package status
          content:
            application/json:
              schema:
                type: object
                required: [export]
                properties:
                  export:
                    $ref: '#/components/schemas/InteriorExportPackage'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/ai/interior-design/exports/{id}/cancel:
    post:
      tags: [interior-design-admin]
      operationId: cancelInteriorDesignExport
      summary: Cancel a queued or generating export package
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        "200":
          description: Cancelled export package
          content:
            application/json:
              schema:
                type: object
                required: [export]
                properties:
                  export:
                    $ref: '#/components/schemas/InteriorExportPackage'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/ai/interior-design/exports/{id}/retry:
    post:
      tags: [interior-design-admin]
      operationId: retryInteriorDesignExport
      summary: Queue a new attempt for a failed or cancelled export
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        "202":
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteriorExportMutationResponse'
        "409":
          $ref: '#/components/responses/Conflict'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/public/interior-design/exports/{id}/download:
    get:
      tags: [interior-design-public]
      operationId: downloadInteriorDesignExport
      summary: Redirect to a completed export after validating its signed token
      parameters:
        - $ref: '#/components/parameters/ExportId'
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the object storage URL
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    adminApiKey:
      type: apiKey
      in: header
      name: x-admin-api-key

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProjectUuid:
      name: projectUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    InteriorExportFormat:
      type: string
      enum: [zip, specification_pdf, materials_csv, materials_pdf, furniture_csv, furniture_pdf, moodboard_pdf]

    InteriorExportSection:
      type: string
      enum: [specification, materials, furniture, moodboard]

    InteriorExportRequest:
      type: object
      properties:
        format:
          $ref: '#/components/schemas/InteriorExportFormat'
        includedSections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InteriorExportSection'
        sourceVersionId:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Optional approved WP-10 design_spec version id.
        idempotencyKey:
          type: string
          maxLength: 200

    InteriorExportPackage:
      type: object
      required: [id, projectUuid, sourceVersionHash, format, includedSections, status, retryCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        projectUuid:
          type: string
          format: uuid
        sourceVersionId:
          type: string
          nullable: true
        sourceVersionNumber:
          type: integer
          nullable: true
        sourceVersionHash:
          type: string
        format:
          $ref: '#/components/schemas/InteriorExportFormat'
        includedSections:
          type: array
          items:
            $ref: '#/components/schemas/InteriorExportSection'
        status:
          type: string
          enum: [queued, generating, completed, failed, cancelled]
        fileName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        fileSizeBytes:
          type: integer
          nullable: true
        checksum:
          type: string
          nullable: true
        retryCount:
          type: integer
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        downloadUrl:
          type: string
          format: uri
        downloadExpiresAt:
          type: string
          format: date-time

    InteriorExportMutationResponse:
      type: object
      required: [package, created]
      properties:
        package:
          $ref: '#/components/schemas/InteriorExportPackage'
        created:
          type: boolean

    RoomType:
      type: string
      enum:
        - living_room
        - bedroom
        - kitchen
        - office
        - cafe
        - restaurant
        - hotel
        - lobby
        - booth

    ProjectStatus:
      type: string
      enum:
        - draft
        - brief_submitted
        - analyzing
        - outputs_ready
        - revision_requested
        - completed

    DoorSpec:
      type: object
      required: [id, wall, positionM, widthM]
      properties:
        id:
          type: string
        wall:
          type: string
          enum: [north, south, east, west]
        positionM:
          type: number
        widthM:
          type: number
          minimum: 0.6
        swingInward:
          type: boolean

    WindowSpec:
      type: object
      required: [id, wall, positionM, widthM]
      properties:
        id:
          type: string
        wall:
          type: string
          enum: [north, south, east, west]
        positionM:
          type: number
        widthM:
          type: number
        sillHeightM:
          type: number
        headHeightM:
          type: number

    ColumnSpec:
      type: object
      required: [id, xM, yM, widthM, depthM]
      properties:
        id:
          type: string
        xM:
          type: number
        yM:
          type: number
        widthM:
          type: number
        depthM:
          type: number

    ImmutableZone:
      type: object
      required: [id, label, xM, yM, widthM, depthM]
      properties:
        id:
          type: string
        label:
          type: string
        xM:
          type: number
        yM:
          type: number
        widthM:
          type: number
        depthM:
          type: number
        reason:
          type: string

    BriefInput:
      type: object
      required: [roomLengthM, roomWidthM, ceilingHeightM, style]
      properties:
        roomLengthM:
          type: number
          minimum: 0.1
          description: Room length in metres
        roomWidthM:
          type: number
          minimum: 0.1
        ceilingHeightM:
          type: number
          minimum: 0.5
        doors:
          type: array
          items:
            $ref: '#/components/schemas/DoorSpec'
        windows:
          type: array
          items:
            $ref: '#/components/schemas/WindowSpec'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnSpec'
        immutableZones:
          type: array
          items:
            $ref: '#/components/schemas/ImmutableZone'
        style:
          type: string
          enum:
            - modern
            - minimalist
            - scandinavian
            - industrial
            - traditional
            - rustic
            - art_deco
            - japandi
            - tropical
            - mediterranean
        primaryColors:
          type: array
          items:
            type: string
        secondaryColors:
          type: array
          items:
            type: string
        materialsPreference:
          type: object
          additionalProperties: true
        lightingPreference:
          type: object
          additionalProperties: true
        furnitureNeeds:
          type: array
          items:
            type: string
        budgetNotes:
          type: string
          description: Optional budget context — no price calculation is performed
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        floorPlanUrl:
          type: string
          format: uri
        additionalNotes:
          type: string

    CreateProjectRequest:
      type: object
      required: [title, roomType]
      properties:
        title:
          type: string
        roomType:
          $ref: '#/components/schemas/RoomType'
        clientName:
          type: string
        clientEmail:
          type: string
          format: email
        notes:
          type: string
        brief:
          $ref: '#/components/schemas/BriefInput'

    UpdateProjectRequest:
      type: object
      properties:
        title:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        clientName:
          type: string
        clientEmail:
          type: string
        notes:
          type: string

    Project:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        roomType:
          $ref: '#/components/schemas/RoomType'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        clientName:
          type: string
          nullable: true
        clientEmail:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Brief:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        roomLengthM:
          type: string
        roomWidthM:
          type: string
        ceilingHeightM:
          type: string
        style:
          type: string
        furnitureNeeds:
          type: array
          items:
            type: string
        budgetNotes:
          type: string
          nullable: true
        photoUrls:
          type: array
          items:
            type: string
        floorPlanUrl:
          type: string
          nullable: true

    Output:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        moodboard:
          type: object
          nullable: true
        spacePlan:
          type: object
          nullable: true
        furniturePlacement:
          type: array
          nullable: true
        circulationAnalysis:
          type: string
          nullable: true
        materialRecommendations:
          type: object
          nullable: true
        lightingRecommendations:
          type: object
          nullable: true
        visualConcept:
          type: string
          nullable: true
        vendorCategories:
          type: array
          nullable: true
        validationResults:
          type: object
          nullable: true
        safetyDisclaimers:
          type: array
          items:
            type: string
        aiModelUsed:
          type: string
          nullable: true
        isLatest:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ValidationResults:
      type: object
      properties:
        dimensionWarnings:
          type: array
          items:
            type: string
        clearanceWarnings:
          type: array
          items:
            type: string
        circulationWarnings:
          type: array
          items:
            type: string
        placementWarnings:
          type: array
          items:
            type: string
        passedChecks:
          type: array
          items:
            type: string

    ProjectList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    CreateProjectResponse:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'
        brief:
          $ref: '#/components/schemas/Brief'
          nullable: true

    PublicProjectDetail:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'
        brief:
          $ref: '#/components/schemas/Brief'
          nullable: true
        output:
          $ref: '#/components/schemas/Output'
          nullable: true

    AdminProjectDetail:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'
        brief:
          $ref: '#/components/schemas/Brief'
          nullable: true
        output:
          $ref: '#/components/schemas/Output'
          nullable: true
        outputCount:
          type: integer

    GenerateResponse:
      type: object
      properties:
        output:
          $ref: '#/components/schemas/Output'
        validationResult:
          $ref: '#/components/schemas/ValidationResults'
        safetyDisclaimers:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid admin API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
