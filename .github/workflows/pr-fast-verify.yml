name: PR Fast Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-fast-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-platform:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AI Platform typecheck
        run: pnpm --filter @workspace/ai-platform typecheck

      - name: AI Platform tests
        run: pnpm --filter @workspace/ai-platform test

      - name: AI Platform build
        run: pnpm --filter @workspace/ai-platform build
