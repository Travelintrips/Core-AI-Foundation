name: Hostinger DEV Runtime Diagnostic

on:
  push:
    branches:
      - diag/hostinger-dev-runtime

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      HOSTINGER_API_BASE: https://developers.hostinger.com/api
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_USERNAME: u684045296
      DEV_DOMAIN: dev-aicore.cstlogistic.co.id
    steps:
      - name: Read safe DEV runtime diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_API_TOKEN:-}"
          base="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$DEV_DOMAIN/nodejs"

          echo "=== BUILD_SETTINGS ==="
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$base/builds/settings" \
            | jq '{node_version,app_type,root_directory,output_directory,build_script,entry_file,package_manager}'

          echo "=== ENV_KEYS ==="
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$base/builds/settings/env" \
            | jq -r '.[].key' | sort

          echo "=== LATEST_BUILDS ==="
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$base/builds?per_page=8" \
            | jq '.data | map({uuid,state,created_at,updated_at,options:{node_version:.options.node_version,app_type:.options.app_type,root_directory:.options.root_directory,output_directory:.options.output_directory,build_script:.options.build_script,entry_file:.options.entry_file,package_manager:.options.package_manager}})'

          echo "=== RUNTIME_LOGS ==="
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$base/runtime-logs?period=1h&limit=300" \
            | jq '{started_at,last_deployed_at,total_lines,logs:(.logs | map({timestamp,level,message}))}'
