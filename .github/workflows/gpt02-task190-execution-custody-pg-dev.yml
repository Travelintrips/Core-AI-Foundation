name: GPT02 Task190 inert execution custody PostgreSQL DEV
on:
  pull_request:
    paths:
      - 'ops/dev/gpt02/task190_execution_custody_inert.sql'
      - 'ops/dev/gpt02/test_task190_execution_custody_pg.sh'
      - '.github/workflows/gpt02-task190-execution-custody-pg-dev.yml'
  push:
    branches: [develop]
    paths:
      - 'ops/dev/gpt02/task190_execution_custody_inert.sql'
      - 'ops/dev/gpt02/test_task190_execution_custody_pg.sh'
      - '.github/workflows/gpt02-task190-execution-custody-pg-dev.yml'
permissions:
  contents: read
jobs:
  real-postgres-inert-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: task190_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: task190-ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task190_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: task190_ci
      PGUSER: postgres
      PGPASSWORD: task190-ci-disposable-only
    steps:
      - uses: actions/checkout@v4
      - name: Make psql available for the disposable PostgreSQL 17 service
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Install inert schema without any runtime role grants
        run: psql -X -v ON_ERROR_STOP=1 -f ops/dev/gpt02/task190_execution_custody_inert.sql
      - name: Real two-session durability, immutability and concurrent uniqueness tests
        run: bash ops/dev/gpt02/test_task190_execution_custody_pg.sh
      - name: Prevent this migration from issuing runtime access or execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/dev/gpt02/task190_execution_custody_inert.sql').read_text().lower()
          assert 'revoke all on schema' in s
          assert 'revoke all on table' in s
          for forbidden in ('grant usage', 'grant insert', 'grant execute', 'alter role', 'security definer', 'dispatch_permitted = true'):
            assert forbidden not in s, forbidden
          print('NO_ROLE_ISSUANCE_NO_DISPATCH_PASS')
          PY
