name: AI Coding Control Plane E2E Canary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_CONTROL_PLANE_E2E to execute the controlled production canary"
        required: true
        type: string
      base_sha:
        description: "40-character production repository base SHA used for bounded dispatch"
        required: true
        type: string
  workflow_run:
    workflows:
      - Hostinger Release Manifest
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-coding-control-plane-e2e-canary
  cancel-in-progress: false

jobs:
  controlled-e2e:
    name: Controlled production E2E canary
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      API_BASE_URL: ${{ vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      CONFIRMATION: ${{ github.event_name == 'workflow_run' && 'RUN_CONTROL_PLANE_E2E' || inputs.confirmation }}
      BASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.base_sha }}
    steps:
      - name: Guard explicit execution
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RUN_CONTROL_PLANE_E2E"
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$ADMIN_API_KEY"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$API_BASE_URL/health")
          test "$code" = "200"

      - name: Create fresh isolated canary task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          correlation="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body=$(jq -nc --arg c "$correlation" --arg base "$BASE_SHA" '{
            projectName:"Control Plane E2E Canary",
            repository:"Travelintrips/Core-AI-Foundation",
            branch:"main",
            instruction:("Controlled E2E canary "+$c+" base-sha:"+$base+". Analyze and plan only bounded non-production changes. Do not commit, push, merge, access secrets, or modify production."),
            priority:10
          }')
          code=$(curl -sS -o /tmp/task.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/tasks"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$body")
          if [ "$code" != "201" ]; then
            echo "::error::Create canary task failed with HTTP $code"
            cat /tmp/task.json
            exit 1
          fi
          task_id=$(jq -r '.id // .task.id // empty' /tmp/task.json)
          [[ "$task_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "scope=coding-task:$task_id" >> "$GITHUB_OUTPUT"

      - name: Run repository analysis and wait for completion
        id: analysis
        run: |
          set -euo pipefail
          task="${{ steps.task.outputs.task_id }}"
          code=$(curl -sS -o /tmp/run.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/tasks/$task/run" \
            -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY")
          if [ "$code" != "201" ]; then
            echo "::error::Start repository analysis failed with HTTP $code"
            cat /tmp/run.json
            exit 1
          fi
          run_id=$(jq -r '.id // empty' /tmp/run.json)
          if [[ ! "$run_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::Repository analysis response missing run id"
            cat /tmp/run.json
            exit 1
          fi

          run_status=""
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/task-status.json -w "%{http_code}" "$API_BASE_URL/ai/coding/tasks/$task" \
              -H "x-admin-api-key: $ADMIN_API_KEY")
            if [ "$code" != "200" ]; then
              echo "::error::Read coding task during analysis failed with HTTP $code"
              cat /tmp/task-status.json
              exit 1
            fi
            run_status=$(jq -r --arg run "$run_id" '.runs[]? | select(.id == $run) | .status' /tmp/task-status.json | head -1)
            if [[ "$run_status" == "COMPLETED" || "$run_status" == "FAILED" || "$run_status" == "CANCELLED" ]]; then
              break
            fi
            sleep 5
          done
          if [ "$run_status" != "COMPLETED" ]; then
            echo "::error::Repository analysis run $run_id ended without COMPLETED status: ${run_status:-missing}"
            jq -c --arg run "$run_id" '.runs[]? | select(.id == $run)' /tmp/task-status.json
            exit 1
          fi

          code=$(curl -sS -o /tmp/graph-probe.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/tasks/$task/task-graph/generate" \
            -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY")
          if [ "$code" = "409" ] && [ "$(jq -r '.code // empty' /tmp/graph-probe.json)" = "ANALYSIS_REQUIRED" ]; then
            echo "::error::Repository analysis did not produce a completed bounded context package within the canary timeout"
            cat /tmp/graph-probe.json
            exit 1
          fi
          if [[ "$code" != "200" && "$code" != "201" ]]; then
            echo "::error::Post-analysis planner probe failed with HTTP $code"
            cat /tmp/graph-probe.json
            exit 1
          fi
          cp /tmp/graph-probe.json /tmp/graph.json
          graph_id=$(jq -r '.snapshot.graph.id // .graph.id // empty' /tmp/graph.json)
          [[ "$graph_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "graph_id=$graph_id" >> "$GITHUB_OUTPUT"

      - name: Acquire and assert Planner Authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          holder="gha-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body=$(jq -nc --arg scope "${{ steps.task.outputs.scope }}" --arg holder "$holder" '{
            scope:$scope,holderId:$holder,holderType:"chatgpt",leaseSeconds:300,
            metadata:{purpose:"production-control-plane-e2e-canary"}
          }')
          code=$(curl -sS -o /tmp/authority.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/planner-authority/acquire"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$body")
          if [ "$code" != "201" ]; then
            echo "::error::Acquire planner authority failed with HTTP $code"
            cat /tmp/authority.json
            exit 1
          fi
          token=$(jq -r '.leaseToken // empty' /tmp/authority.json)
          generation=$(jq -r '.fencingGeneration // empty' /tmp/authority.json)
          if [ -z "$token" ] || [ -z "$generation" ]; then
            echo "::error::Planner authority response missing leaseToken or fencingGeneration"
            cat /tmp/authority.json
            exit 1
          fi
          assert=$(jq -nc --arg scope "${{ steps.task.outputs.scope }}" --arg holder "$holder" --arg token "$token" --argjson generation "$generation"             '{scope:$scope,holderId:$holder,leaseToken:$token,fencingGeneration:$generation}')
          code=$(curl -sS -o /tmp/assert.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/planner-authority/assert"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$assert")
          if [ "$code" != "200" ]; then
            echo "::error::Assert planner authority failed with HTTP $code"
            cat /tmp/assert.json
            exit 1
          fi
          echo "holder=$holder" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Verify fresh Plan V1 and task graph
        id: graph
        run: |
          set -euo pipefail
          task="${{ steps.task.outputs.task_id }}"
          graph_id="${{ steps.analysis.outputs.graph_id }}"
          [[ "$graph_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          code=$(curl -sS -o /tmp/graph.json -w "%{http_code}" "$API_BASE_URL/ai/coding/tasks/$task/task-graph" \
            -H "x-admin-api-key: $ADMIN_API_KEY")
          test "$code" = "200"
          bound=$(jq -r '.graph.taskId // empty' /tmp/graph.json)
          test "$bound" = "$task"
          echo "graph_id=$graph_id" >> "$GITHUB_OUTPUT"

      - name: Reassert fence before planner mutation
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -nc --arg scope "${{ steps.task.outputs.scope }}" --arg holder "${{ steps.authority.outputs.holder }}"             --arg token "${{ steps.authority.outputs.token }}" --argjson generation "${{ steps.authority.outputs.generation }}"             '{scope:$scope,holderId:$holder,leaseToken:$token,fencingGeneration:$generation}')
          code=$(curl -sS -o /tmp/fence.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/planner-authority/assert"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$body")
          test "$code" = "200"

      - name: Approve graph and bounded dispatch
        shell: bash
        run: |
          set -euo pipefail
          task="${{ steps.task.outputs.task_id }}"; graph="${{ steps.graph.outputs.graph_id }}"
          code=$(curl -sS -o /tmp/approve.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/tasks/$task/task-graph/$graph/approve"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY")
          test "$code" = "200"
          body=$(jq -nc --arg sha "$BASE_SHA" '{baseSha:$sha,maxParallel:1,leaseSeconds:120,workerPoolId:"production-e2e-canary"}')
          code=$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/tasks/$task/task-graph/$graph/dispatch"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$body")
          test "$code" = "202"

      - name: Verify exact task graph, Mission Control, and observability provenance
        shell: bash
        run: |
          set -euo pipefail
          task="${{ steps.task.outputs.task_id }}"; graph="${{ steps.graph.outputs.graph_id }}"
          for path in "task-graph" "mission-control" "observability"; do
            code=$(curl -sS -o "/tmp/$path.json" -w "%{http_code}" "$API_BASE_URL/ai/coding/tasks/$task/$path"               -H "x-admin-api-key: $ADMIN_API_KEY")
            test "$code" = "200"
          done
          test "$(jq -r '.graph.id' /tmp/task-graph.json)" = "$graph"
          test "$(jq -r '.graph.taskId' /tmp/task-graph.json)" = "$task"
          test "$(jq -r '.taskId' /tmp/mission-control.json)" = "$task"
          test "$(jq -r '.taskId' /tmp/observability.json)" = "$task"

      - name: Assert stale fencing token is rejected
        shell: bash
        run: |
          set -euo pipefail
          stale=$(jq -nc --arg scope "${{ steps.task.outputs.scope }}" --arg holder "${{ steps.authority.outputs.holder }}"             --arg token "00000000-0000-4000-8000-000000000000" --argjson generation "${{ steps.authority.outputs.generation }}"             '{scope:$scope,holderId:$holder,leaseToken:$token,fencingGeneration:$generation}')
          code=$(curl -sS -o /tmp/stale.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/planner-authority/assert"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$stale")
          test "$code" = "409"
          jq -e '.code == "STALE_FENCE" or .code == "NOT_HOLDER"' /tmp/stale.json >/dev/null

      - name: Canary safety summary
        shell: bash
        run: |
          echo "task_id=${{ steps.task.outputs.task_id }}"
          echo "graph_id=${{ steps.graph.outputs.graph_id }}"
          echo "fresh_identity=true"
          echo "planner_fence_asserted=true"
          echo "stale_fence_rejected=true"
          echo "max_parallel=1"
          echo "commit_created=false"
          echo "pushed=false"
          echo "merged=false"
