name: AI Coding Control Plane E2E Canary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_CONTROL_PLANE_E2E to execute the controlled production canary"
        required: true
        type: string
      base_sha:
        description: "40-character production repository base SHA used for bounded dispatch"
        required: true
        type: string
  workflow_run:
    workflows:
      - Hostinger Production Verify
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-coding-control-plane-e2e-canary
  cancel-in-progress: false

jobs:
  controlled-e2e:
    name: Controlled production E2E canary
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      CONFIRMATION: ${{ github.event_name == 'workflow_run' && 'RUN_CONTROL_PLANE_E2E' || inputs.confirmation }}
      BASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.base_sha }}
    steps:
      - name: Guard explicit execution
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RUN_CONTROL_PLANE_E2E"
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$ADMIN_API_KEY"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          health_url="${API_BASE_URL%/}/healthz"
          code=""
          for attempt in $(seq 1 18); do
            rm -f /tmp/health.json /tmp/health.headers
            code=$(curl --http1.1 --retry 2 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 30 -L --silent --show-error \
              -D /tmp/health.headers -o /tmp/health.json -w "%{http_code}" "$health_url" || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [[ "$code" = "403" || "$code" = "307" || "$code" = "308" ]]; then
              server=$(awk -F': ' 'tolower($1)=="server" {gsub("\r","",$2); print $2}' /tmp/health.headers 2>/dev/null | tail -n1)
              location=$(awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' /tmp/health.headers 2>/dev/null | tail -n1)
              echo "Production health edge response (attempt $attempt/18, HTTP=$code, server=${server:-missing}, location=${location:-missing}); retrying in 10s..."
            else
              echo "Production health not ready yet (attempt $attempt/18, HTTP=${code:-curl-error}); retrying in 10s..."
            fi
            sleep 10
          done
          echo "::error::Production health did not become ready after bounded retries (last HTTP=${code:-curl-error})"
          if [ -f /tmp/health.json ]; then
            cat /tmp/health.json
          fi
          exit 1

      - name: Create fresh isolated canary task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          correlation="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body=$(jq -nc --arg c "$correlation" --arg base "$BASE_SHA" '{
            projectName:"Control Plane E2E Canary",
            repository:"Travelintrips/Core-AI-Foundation",
            branch:"main",
            instruction:("Controlled E2E canary "+$c+" base-sha:"+$base+". Analyze and plan only bounded non-production changes. Do not commit, push, merge, access secrets, or modify production."),
            priority:10
          }')
          code=""
          task_id=""
          for attempt in $(seq 1 6); do
            rm -f /tmp/task.json /tmp/task.headers
            code=$(curl -sS -D /tmp/task.headers -o /tmp/task.json -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -X POST "$API_BASE_URL/ai/coding/tasks" \
              -H "Content-Type: application/json" \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              -d "$body" || true)

            if [ "$code" = "201" ]; then
              task_id=$(jq -r '.id // .task.id // empty' /tmp/task.json 2>/dev/null || true)
              break
            fi

            if [[ "$code" = "000" || "$code" = "307" || "$code" = "308" || "$code" = "500" || "$code" = "502" || "$code" = "503" || "$code" = "504" ]]; then
              echo "Create canary task transient HTTP ${code:-curl-error} (attempt $attempt/6); retrying in 5s..."
              sleep 5
              continue
            fi

            echo "::error::Create canary task failed with non-transient HTTP $code"
            cat /tmp/task.json 2>/dev/null || true
            exit 1
          done

          if [[ ! "$task_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::Create canary task did not succeed after bounded retries (last HTTP=${code:-curl-error})"
            cat /tmp/task.json 2>/dev/null || true
            exit 1
          fi
          [[ "$task_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "scope=coding-task:$task_id" >> "$GITHUB_OUTPUT"

          stop_code=$(curl -sS -o /tmp/autonomous-stop.json -w "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            -X POST "$API_BASE_URL/ai/coding/tasks/$task_id/autonomous/stop" \
            -H "Content-Type: application/json" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d '{}' || true)
          if [ "$stop_code" != "200" ]; then
            echo "::error::Failed to place canary task in explicit manual-control mode (HTTP=$stop_code)"
            cat /tmp/autonomous-stop.json 2>/dev/null || true
            exit 1
          fi
          jq -e --arg task "$task_id" '.enabled == false and .taskId == $task' /tmp/autonomous-stop.json >/dev/null
          state_code=$(curl -sS -o /tmp/autonomous-state.json -w "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            "$API_BASE_URL/ai/coding/tasks/$task_id/autonomous" \
            -H "x-admin-api-key: $ADMIN_API_KEY" || true)
          test "$state_code" = "200"
          jq -e --arg task "$task_id" '.task_id == $task and .enabled == false and .status == "DISABLED"' /tmp/autonomous-state.json >/dev/null
          echo "Canary task $task_id is explicitly autonomous=DISABLED; workflow owns approval and dispatch."

      - name: Run repository analysis and wait for completion
        id: analysis
        run: |
          set -euo pipefail
          task="${{ steps.task.outputs.task_id }}"
          code=""
          run_id=""
          for attempt in $(seq 1 6); do
            rm -f /tmp/run.json /tmp/run.headers
            code=$(curl -sS -D /tmp/run.headers -o /tmp/run.json -w "%{http_code}"               --connect-timeout 15 --max-time 30               -X POST "$API_BASE_URL/ai/coding/tasks/$task/run"               -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" || true)

            if [ "$code" = "201" ]; then
              run_id=$(jq -r '.id // empty' /tmp/run.json 2>/dev/null || true)
              break
            fi

            if [ "$code" = "409" ]; then
              # A timed-out POST can still create the run server-side. The API
              # now returns the authoritative activeRunId directly on conflict,
              # so adopt it before relying on the eventually-consistent task view.
              run_id=$(jq -r '.activeRunId // empty' /tmp/run.json 2>/dev/null || true)
              if [[ "$run_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
                echo "Repository analysis was already started; adopting active run $run_id from HTTP 409 response"
                break
              fi

              # Backward-compatible fallback while older production instances
              # may still be serving during a rolling deployment.
              for adopt_attempt in $(seq 1 12); do
                status_code=$(curl -sS -o /tmp/task-after-start.json -w "%{http_code}" \
                  --connect-timeout 15 --max-time 30 \
                  "$API_BASE_URL/ai/coding/tasks/$task" \
                  -H "x-admin-api-key: $ADMIN_API_KEY" || true)
                if [ "$status_code" = "200" ]; then
                  run_id=$(jq -r '.runs[]? | select(.status == "RUNNING") | .id' /tmp/task-after-start.json | head -1)
                  if [[ "$run_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
                    echo "Repository analysis was already started; adopting active run $run_id from task projection (attempt $adopt_attempt/12)"
                    break
                  fi
                fi
                echo "Active run not visible yet after HTTP 409 (attempt $adopt_attempt/12); retrying in 3s..."
                sleep 3
              done
              if [[ "$run_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
                break
              fi
              echo "HTTP 409 active-run conflict could not yet be adopted; retrying start loop."
              sleep 5
              continue
            fi

            if [[ "$code" = "307" || "$code" = "308" || "$code" = "500" || "$code" = "502" || "$code" = "503" || "$code" = "504" || "$code" = "000" ]]; then
              echo "Start repository analysis transient HTTP ${code:-curl-error} (attempt $attempt/6); retrying in 5s..."
              sleep 5
              continue
            fi

            echo "::error::Start repository analysis failed with HTTP $code"
            cat /tmp/run.json 2>/dev/null || true
            exit 1
          done

          if [[ ! "$run_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::Repository analysis did not start after bounded retries (last HTTP=${code:-curl-error})"
            cat /tmp/run.json 2>/dev/null || true
            exit 1
          fi

          run_status=""
          for attempt in $(seq 1 120); do
            rm -f /tmp/run-status.json /tmp/run-status.headers
            code=$(curl -sS -D /tmp/run-status.headers -o /tmp/run-status.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 15 \
              "$API_BASE_URL/ai/coding/tasks/$task/runs/$run_id/status" \
              -H "x-admin-api-key: $ADMIN_API_KEY" || true)

            if [ "$code" = "200" ]; then
              run_status=$(jq -r '.status // empty' /tmp/run-status.json 2>/dev/null || true)
              if [[ "$run_status" == "COMPLETED" || "$run_status" == "FAILED" || "$run_status" == "CANCELLED" ]]; then
                break
              fi
              sleep 5
              continue
            fi

            if [[ "$code" = "307" || "$code" = "308" || "$code" = "500" || "$code" = "502" || "$code" = "503" || "$code" = "504" || "$code" = "000" ]]; then
              echo "Read coding run status transient HTTP ${code:-curl-error} (attempt $attempt/120); retrying in 5s..."
              sleep 5
              continue
            fi

            echo "::error::Read coding run status during analysis failed with HTTP $code"
            cat /tmp/run-status.json 2>/dev/null || true
            exit 1
          done
          if [ "$run_status" != "COMPLETED" ]; then
            echo "::error::Repository analysis run $run_id exceeded the bounded canary wait or ended without COMPLETED status: ${run_status:-missing}"
            jq -c '{id,taskId,agentName,status,errorMessage,startedAt,finishedAt}' /tmp/run-status.json 2>/dev/null || true
            exit 1
          fi

          graph_id=""
          planner_job_id=""
          code=""
          for planner_attempt in $(seq 1 36); do
            rm -f /tmp/graph-probe.json /tmp/planner-authority-probe.json

            graph_code=$(curl -sS -o /tmp/graph-probe.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 15 \
              "$API_BASE_URL/ai/coding/tasks/$task/task-graph" \
              -H "x-admin-api-key: $ADMIN_API_KEY" || true)
            if [ "$graph_code" = "200" ]; then
              graph_status=$(jq -r '.graph.status // empty' /tmp/graph-probe.json 2>/dev/null || true)
              graph_id=$(jq -r 'select(.graph.status == "PREPARED" or .graph.status == "APPROVED") | .graph.id // empty' /tmp/graph-probe.json 2>/dev/null || true)
              if [[ "$graph_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
                echo "Adopting $graph_status task graph $graph_id produced by the in-flight planner."
                break
              fi
              if [ -n "$graph_status" ]; then
                echo "::error::Task graph already exists in unexpected status $graph_status before canary approval"
                cat /tmp/graph-probe.json 2>/dev/null || true
                exit 1
              fi
            elif [[ "$graph_code" != "404" && "$graph_code" != "307" && "$graph_code" != "308" && "$graph_code" != "500" && "$graph_code" != "502" && "$graph_code" != "503" && "$graph_code" != "504" && "$graph_code" != "000" ]]; then
              echo "::error::Task graph probe failed with non-transient HTTP $graph_code"
              cat /tmp/graph-probe.json 2>/dev/null || true
              exit 1
            fi

            authority_code=$(curl -sS -G -o /tmp/planner-authority-probe.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 15 \
              "$API_BASE_URL/ai/coding/planner-authority" \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              --data-urlencode "scope=coding-task:$task" || true)
            if [ "$authority_code" = "200" ]; then
              authority_state=$(jq -r '.state // empty' /tmp/planner-authority-probe.json 2>/dev/null || true)
              if [[ "$authority_state" = "PRIMARY_ACTIVE" || "$authority_state" = "FALLBACK_ACTIVE" ]]; then
                echo "Planner authority is already active for this task (state=$authority_state, attempt $planner_attempt/36); waiting for its graph."
                sleep 5
                continue
              fi
            elif [[ "$authority_code" != "500" && "$authority_code" != "502" && "$authority_code" != "503" && "$authority_code" != "504" && "$authority_code" != "000" ]]; then
              echo "::error::Planner authority probe failed with non-transient HTTP $authority_code"
              cat /tmp/planner-authority-probe.json 2>/dev/null || true
              exit 1
            fi

            if [ "$planner_attempt" -le 2 ]; then
              echo "No planner authority visible yet (attempt $planner_attempt/36); allowing the repository analyzer planner a short acquisition grace period."
              sleep 2
              continue
            fi

            code=$(curl --http1.1 -sS -o /tmp/graph-probe.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 20 \
              -X POST "$API_BASE_URL/ai/coding/tasks/$task/task-graph/generate" \
              -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" || true)

            if [ "$code" = "200" ]; then
              graph_id=$(jq -r '.snapshot.graph.id // empty' /tmp/graph-probe.json 2>/dev/null || true)
              if [[ "$graph_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
                echo "Planner generate returned existing PREPARED graph $graph_id."
                break
              fi
              echo "::error::Planner generate returned HTTP 200 without a valid graph id"
              cat /tmp/graph-probe.json 2>/dev/null || true
              exit 1
            fi

            if [ "$code" = "202" ]; then
              planner_job_id=$(jq -r '.jobId // empty' /tmp/graph-probe.json 2>/dev/null || true)
              if [[ "$planner_job_id" =~ ^[0-9]+$ ]]; then
                echo "Planner job $planner_job_id accepted for bounded execution."
                break
              fi
              authority_held=$(jq -r '.authorityHeld // false' /tmp/graph-probe.json 2>/dev/null || true)
              if [ "$authority_held" = "true" ]; then
                echo "Planner generate adopted an active planner (attempt $planner_attempt/36); waiting for its graph."
                sleep 5
                continue
              fi
              echo "::error::Planner enqueue response did not include a valid numeric jobId or active-authority marker"
              cat /tmp/graph-probe.json 2>/dev/null || true
              exit 1
            fi

            if [[ "$code" = "307" || "$code" = "308" || "$code" = "500" || "$code" = "502" || "$code" = "503" || "$code" = "504" || "$code" = "000" ]]; then
              echo "Planner enqueue transient HTTP ${code:-curl-error} (attempt $planner_attempt/36); retrying in 5s..."
              sleep 5
              continue
            fi

            echo "::error::Planner enqueue failed with non-transient HTTP $code"
            cat /tmp/graph-probe.json 2>/dev/null || true
            exit 1
          done

          if [[ ! "$graph_id" =~ ^[0-9a-fA-F-]{36}$ && ! "$planner_job_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Planner graph/job was not obtained after bounded retries (last HTTP=${code:-missing})"
            cat /tmp/graph-probe.json 2>/dev/null || true
            exit 1
          fi

          if [[ "$planner_job_id" =~ ^[0-9]+$ ]]; then
            for attempt in $(seq 1 36); do
              job_code=$(curl -sS -o /tmp/planner-job.json -w "%{http_code}" \
                --connect-timeout 15 --max-time 30 \
                "$API_BASE_URL/ai/jobs/$planner_job_id" \
                -H "x-admin-api-key: $ADMIN_API_KEY" || true)

              if [ "$job_code" = "200" ]; then
                planner_status=$(jq -r '.status // empty' /tmp/planner-job.json 2>/dev/null || true)
                case "$planner_status" in
                  completed)
                    break
                    ;;
                  failed|cancelled|blocked)
                    echo "::error::Planner job $planner_job_id ended as $planner_status"
                    jq -c '{id,status,jobType,retryCount,maxRetry,errorMessage,startedAt,completedAt,updatedAt}' /tmp/planner-job.json 2>/dev/null || cat /tmp/planner-job.json
                    exit 1
                    ;;
                  queued|waiting|running|retrying)
                    echo "Planner job $planner_job_id status=$planner_status (attempt $attempt/36); retrying in 5s..."
                    ;;
                  *)
                    echo "Planner job $planner_job_id returned unknown status=${planner_status:-missing} (attempt $attempt/36); retrying in 5s..."
                    ;;
                esac
              elif [[ "$job_code" != "404" && "$job_code" != "500" && "$job_code" != "502" && "$job_code" != "503" && "$job_code" != "504" && "$job_code" != "000" ]]; then
                echo "::error::Planner job status poll failed with HTTP $job_code"
                cat /tmp/planner-job.json 2>/dev/null || true
                exit 1
              else
                echo "Planner job status temporarily unavailable (HTTP=${job_code:-curl-error}, attempt $attempt/36); retrying in 5s..."
              fi
              sleep 5
            done

            planner_status=$(jq -r '.status // empty' /tmp/planner-job.json 2>/dev/null || true)
            if [ "$planner_status" != "completed" ]; then
              echo "::error::Planner job $planner_job_id exceeded the 180s canary execution budget"
              jq -c '{id,status,jobType,retryCount,maxRetry,errorMessage,startedAt,completedAt,updatedAt}' /tmp/planner-job.json 2>/dev/null || true
              exit 1
            fi
          fi

          expected_graph_id="$graph_id"
          graph_id=""
          code=""
          for graph_read_attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/graph.json -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              "$API_BASE_URL/ai/coding/tasks/$task/task-graph" \
              -H "x-admin-api-key: $ADMIN_API_KEY" || true)

            if [ "$code" = "200" ]; then
              graph_status=$(jq -r '.graph.status // empty' /tmp/graph.json 2>/dev/null || true)
              observed_graph_id=$(jq -r 'select(.graph.status == "PREPARED" or .graph.status == "APPROVED") | .graph.id // empty' /tmp/graph.json 2>/dev/null || true)
              if [[ "$observed_graph_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
                if [[ "$expected_graph_id" =~ ^[0-9a-fA-F-]{36}$ && "$observed_graph_id" != "$expected_graph_id" ]]; then
                  echo "::error::Task graph identity changed during canary read: expected $expected_graph_id, observed $observed_graph_id"
                  cat /tmp/graph.json 2>/dev/null || true
                  exit 1
                fi
                graph_id="$observed_graph_id"
                break
              fi
              echo "::error::Planner graph read returned HTTP 200 without PREPARED/APPROVED graph"
              cat /tmp/graph.json 2>/dev/null || true
              exit 1
            fi

            if [[ "$code" = "404" || "$code" = "307" || "$code" = "308" || "$code" = "500" || "$code" = "502" || "$code" = "503" || "$code" = "504" || "$code" = "000" ]]; then
              echo "Task graph final read transient HTTP ${code:-curl-error} (attempt $graph_read_attempt/12); retrying in 2s..."
              sleep 2
              continue
            fi

            echo "::error::Planner job completed but task graph read failed with non-transient HTTP $code"
            cat /tmp/graph.json 2>/dev/null || true
            exit 1
          done

          if [[ ! "$graph_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::Planner job completed but task graph was not readable after bounded retries (last HTTP=${code:-missing})"
            cat /tmp/graph.json 2>/dev/null || true
            exit 1
          fi
          echo "graph_id=$graph_id" >> "$GITHUB_OUTPUT"

      - name: Read and assert Planner Authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          scope="${{ steps.task.outputs.scope }}"
          code=$(curl -sS -G -o /tmp/authority.json -w "%{http_code}"             "$API_BASE_URL/ai/coding/planner-authority"             -H "x-admin-api-key: $ADMIN_API_KEY"             --data-urlencode "scope=$scope")
          if [ "$code" != "200" ]; then
            echo "::error::Read planner authority failed with HTTP $code"
            cat /tmp/authority.json
            exit 1
          fi
          if [ "$(jq -r '.state // empty' /tmp/authority.json)" = "UNCLAIMED" ]; then
            holder="production-e2e-canary-$GITHUB_RUN_ID"
            body=$(jq -nc --arg scope "$scope" --arg holder "$holder" '{scope:$scope,holderId:$holder,holderType:"chatgpt",leaseSeconds:300,metadata:{source:"production-e2e-canary"}}')
            code=$(curl -sS -o /tmp/authority.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/planner-authority/acquire" -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$body")
            test "$code" = "201"
          fi
          holder=$(jq -r '.holderId // empty' /tmp/authority.json)
          token=$(jq -r '.leaseToken // empty' /tmp/authority.json)
          generation=$(jq -r '.fencingGeneration // empty' /tmp/authority.json)
          state=$(jq -r '.state // empty' /tmp/authority.json)
          if [ -z "$holder" ] || [ -z "$token" ] || [ -z "$generation" ]; then
            echo "::error::Planner authority response missing holderId, leaseToken, or fencingGeneration"
            cat /tmp/authority.json
            exit 1
          fi
          if [[ "$state" != "PRIMARY_ACTIVE" && "$state" != "FALLBACK_ACTIVE" ]]; then
            echo "::error::Planner authority is not active: state=${state:-missing}"
            cat /tmp/authority.json
            exit 1
          fi
          assert=$(jq -nc --arg scope "$scope" --arg holder "$holder" --arg token "$token" --argjson generation "$generation"             '{scope:$scope,holderId:$holder,leaseToken:$token,fencingGeneration:$generation}')
          code=$(curl -sS -o /tmp/assert.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/planner-authority/assert"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$assert")
          if [ "$code" != "200" ]; then
            echo "::error::Assert planner authority failed with HTTP $code"
            cat /tmp/assert.json
            exit 1
          fi
          echo "holder=$holder" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Verify fresh Plan V1 and task graph
        id: graph
        run: |
          set -euo pipefail
          task="${{ steps.task.outputs.task_id }}"
          graph_id="${{ steps.analysis.outputs.graph_id }}"
          [[ "$graph_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          code=$(curl -sS -o /tmp/graph.json -w "%{http_code}" "$API_BASE_URL/ai/coding/tasks/$task/task-graph" \
            -H "x-admin-api-key: $ADMIN_API_KEY")
          test "$code" = "200"
          bound=$(jq -r '.graph.taskId // empty' /tmp/graph.json)
          test "$bound" = "$task"
          echo "graph_id=$graph_id" >> "$GITHUB_OUTPUT"

      - name: Reassert fence before planner mutation
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -nc --arg scope "${{ steps.task.outputs.scope }}" --arg holder "${{ steps.authority.outputs.holder }}"             --arg token "${{ steps.authority.outputs.token }}" --argjson generation "${{ steps.authority.outputs.generation }}"             '{scope:$scope,holderId:$holder,leaseToken:$token,fencingGeneration:$generation}')
          code=$(curl -sS -o /tmp/fence.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/planner-authority/assert"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$body")
          test "$code" = "200"

      - name: Approve graph and bounded dispatch
        shell: bash
        run: |
          set -euo pipefail
          task="${{ steps.task.outputs.task_id }}"; graph="${{ steps.graph.outputs.graph_id }}"

          code=""
          for attempt in 1 2 3; do
            code=$(curl -sS -D /tmp/approve.headers -o /tmp/approve.json -w "%{http_code}" \
              -X POST "$API_BASE_URL/ai/coding/tasks/$task/task-graph/$graph/approve" \
              -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY")
            if [[ "$code" != "307" && "$code" != "308" ]]; then
              break
            fi
            echo "Approve graph received transient HTTP $code from production edge (attempt $attempt/3); retrying same canonical API URL in 5s..."
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "::error::Approve graph failed with HTTP $code"
            if [[ "$code" = "307" || "$code" = "308" ]]; then
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/approve.headers)
              if [ -n "$location" ]; then
                echo "Production edge redirect location: $location"
              fi
            fi
            cat /tmp/approve.json
            exit 1
          fi

          body=$(jq -nc --arg sha "$BASE_SHA" '{baseSha:$sha,maxParallel:1,leaseSeconds:120,workerPoolId:"production-e2e-canary"}')
          code=""
          for attempt in 1 2 3; do
            code=$(curl -sS -D /tmp/dispatch.headers -o /tmp/dispatch.json -w "%{http_code}" \
              -X POST "$API_BASE_URL/ai/coding/tasks/$task/task-graph/$graph/dispatch" \
              -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$body")
            if [[ "$code" != "307" && "$code" != "308" ]]; then
              break
            fi
            echo "Bounded dispatch received transient HTTP $code from production edge (attempt $attempt/3); retrying same canonical API URL in 5s..."
            sleep 5
          done
          if [ "$code" != "202" ]; then
            echo "::error::Bounded dispatch failed with HTTP $code"
            if [[ "$code" = "307" || "$code" = "308" ]]; then
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/dispatch.headers)
              if [ -n "$location" ]; then
                echo "Production edge redirect location: $location"
              fi
            fi
            cat /tmp/dispatch.json
            exit 1
          fi

      - name: Verify exact task graph, Mission Control, and observability provenance
        shell: bash
        run: |
          set -euo pipefail
          task="${{ steps.task.outputs.task_id }}"; graph="${{ steps.graph.outputs.graph_id }}"
          for path in "task-graph" "mission-control" "observability"; do
            code=$(curl -sS -o "/tmp/$path.json" -w "%{http_code}" "$API_BASE_URL/ai/coding/tasks/$task/$path"               -H "x-admin-api-key: $ADMIN_API_KEY")
            test "$code" = "200"
          done
          test "$(jq -r '.graph.id' /tmp/task-graph.json)" = "$graph"
          test "$(jq -r '.graph.taskId' /tmp/task-graph.json)" = "$task"
          test "$(jq -r '.taskId' /tmp/mission-control.json)" = "$task"
          test "$(jq -r '.taskId' /tmp/observability.json)" = "$task"

      - name: Assert stale fencing token is rejected
        shell: bash
        run: |
          set -euo pipefail
          stale=$(jq -nc --arg scope "${{ steps.task.outputs.scope }}" --arg holder "${{ steps.authority.outputs.holder }}"             --arg token "00000000-0000-4000-8000-000000000000" --argjson generation "${{ steps.authority.outputs.generation }}"             '{scope:$scope,holderId:$holder,leaseToken:$token,fencingGeneration:$generation}')
          code=$(curl -sS -o /tmp/stale.json -w "%{http_code}" -X POST "$API_BASE_URL/ai/coding/planner-authority/assert"             -H "Content-Type: application/json" -H "x-admin-api-key: $ADMIN_API_KEY" -d "$stale")
          test "$code" = "409"
          jq -e '.code == "STALE_FENCE" or .code == "NOT_HOLDER"' /tmp/stale.json >/dev/null

      - name: Canary safety summary
        shell: bash
        run: |
          echo "task_id=${{ steps.task.outputs.task_id }}"
          echo "graph_id=${{ steps.graph.outputs.graph_id }}"
          echo "fresh_identity=true"
          echo "planner_fence_asserted=true"
          echo "stale_fence_rejected=true"
          echo "max_parallel=1"
          echo "commit_created=false"
          echo "pushed=false"
          echo "merged=false"
