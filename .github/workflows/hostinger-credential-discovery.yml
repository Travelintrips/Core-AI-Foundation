name: Hostinger Credential Discovery

on:
  push:
    branches:
      - release/7a12-prod-readiness
    paths:
      - .github/workflows/hostinger-credential-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Report credential aliases
        env:
          HAS_HOSTINGER_SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST != '' }}
          HAS_HOSTINGER_SFTP_USERNAME: ${{ secrets.HOSTINGER_SFTP_USERNAME != '' }}
          HAS_HOSTINGER_SFTP_PRIVATE_KEY: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY != '' }}
          HAS_HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST != '' }}
          HAS_HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER != '' }}
          HAS_HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY != '' }}
          HAS_SSH_HOST: ${{ secrets.SSH_HOST != '' }}
          HAS_SSH_USER: ${{ secrets.SSH_USER != '' }}
          HAS_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          HAS_FTP_SERVER: ${{ secrets.FTP_SERVER != '' }}
          HAS_FTP_USERNAME: ${{ secrets.FTP_USERNAME != '' }}
          HAS_FTP_PASSWORD: ${{ secrets.FTP_PASSWORD != '' }}
          HAS_HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST != '' }}
          HAS_HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME != '' }}
          HAS_HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD != '' }}
          HAS_HOSTINGER_DEPLOY_HOOK: ${{ secrets.HOSTINGER_DEPLOY_HOOK != '' }}
          HAS_DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK != '' }}
          HAS_ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY != '' }}
          VAR_HOSTINGER_AI_PATH: ${{ vars.HOSTINGER_AI_PATH != '' }}
          VAR_HOSTINGER_CUSTOMER_PATH: ${{ vars.HOSTINGER_CUSTOMER_PATH != '' }}
          VAR_HOSTINGER_API_PATH: ${{ vars.HOSTINGER_API_PATH != '' }}
          SECRET_HOSTINGER_AI_PATH: ${{ secrets.HOSTINGER_AI_PATH != '' }}
          SECRET_HOSTINGER_CUSTOMER_PATH: ${{ secrets.HOSTINGER_CUSTOMER_PATH != '' }}
          SECRET_HOSTINGER_API_PATH: ${{ secrets.HOSTINGER_API_PATH != '' }}
        run: |
          printf '%s\n' \
            "HOSTINGER_SFTP_HOST=$HAS_HOSTINGER_SFTP_HOST" \
            "HOSTINGER_SFTP_USERNAME=$HAS_HOSTINGER_SFTP_USERNAME" \
            "HOSTINGER_SFTP_PRIVATE_KEY=$HAS_HOSTINGER_SFTP_PRIVATE_KEY" \
            "HOSTINGER_SSH_HOST=$HAS_HOSTINGER_SSH_HOST" \
            "HOSTINGER_SSH_USER=$HAS_HOSTINGER_SSH_USER" \
            "HOSTINGER_SSH_PRIVATE_KEY=$HAS_HOSTINGER_SSH_PRIVATE_KEY" \
            "SSH_HOST=$HAS_SSH_HOST" \
            "SSH_USER=$HAS_SSH_USER" \
            "SSH_PRIVATE_KEY=$HAS_SSH_PRIVATE_KEY" \
            "FTP_SERVER=$HAS_FTP_SERVER" \
            "FTP_USERNAME=$HAS_FTP_USERNAME" \
            "FTP_PASSWORD=$HAS_FTP_PASSWORD" \
            "HOSTINGER_FTP_HOST=$HAS_HOSTINGER_FTP_HOST" \
            "HOSTINGER_FTP_USERNAME=$HAS_HOSTINGER_FTP_USERNAME" \
            "HOSTINGER_FTP_PASSWORD=$HAS_HOSTINGER_FTP_PASSWORD" \
            "HOSTINGER_DEPLOY_HOOK=$HAS_HOSTINGER_DEPLOY_HOOK" \
            "DEPLOY_HOOK=$HAS_DEPLOY_HOOK" \
            "ADMIN_API_KEY=$HAS_ADMIN_API_KEY" \
            "VAR_HOSTINGER_AI_PATH=$VAR_HOSTINGER_AI_PATH" \
            "VAR_HOSTINGER_CUSTOMER_PATH=$VAR_HOSTINGER_CUSTOMER_PATH" \
            "VAR_HOSTINGER_API_PATH=$VAR_HOSTINGER_API_PATH" \
            "SECRET_HOSTINGER_AI_PATH=$SECRET_HOSTINGER_AI_PATH" \
            "SECRET_HOSTINGER_CUSTOMER_PATH=$SECRET_HOSTINGER_CUSTOMER_PATH" \
            "SECRET_HOSTINGER_API_PATH=$SECRET_HOSTINGER_API_PATH"
