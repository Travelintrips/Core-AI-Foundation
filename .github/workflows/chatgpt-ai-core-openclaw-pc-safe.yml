name: ChatGPT AI Core OpenClaw PC Safe Bridge
run-name: PC safe control #${{ github.event.issue.number }} by ${{ github.actor }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: pc-safe-control-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'Travelintrips/Core-AI-Foundation' &&
      github.actor == 'Travelintrips' &&
      github.event.issue.user.login == 'Travelintrips' &&
      startsWith(github.event.issue.title, '[PC-SAFE] ')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 7
    steps:
      - name: Validate exact allowlisted action and enqueue for PC2
        id: enqueue
        shell: bash
        env:
          TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          API_BASE_URL: ${{ vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          target_client='openclaw-pc-worker-2'
          case "$TITLE" in
            '[PC-SAFE] PING')
              action='PING'
              instruction='ping'
              ;;
            '[PC-SAFE] PING_PC1')
              action='PING'
              target_client='openclaw-pc-worker'
              instruction='ping'
              ;;
            '[PC-SAFE] HOSTNAME_PC1')
              action='HOSTNAME'
              target_client='openclaw-pc-worker'
              instruction='hostname'
              ;;
            '[PC-SAFE] DEPLOY_NUSA_KARYA')
              action='DEPLOY_NUSA_KARYA'
              target_client='openclaw-pc-worker'
              instruction='Owner-authorized bounded Nusa Karya deployment only. Use the real local exec tool on PC1. From PowerShell, use the existing SSH identity C:\Users\user\.ssh\openclaw_vps to connect non-interactively to root@72.61.210.205. On that VPS, deploy only Travelintrips/Core-AI-Foundation commit 404e258792f521d297f150a5499a969b8d235ad4 into /opt/nusa-karya-source, then run bash deploy/vps/nusa-karya/install.sh /opt/nusa-karya-source. Do not modify databases, AI Core containers, unrelated Nginx vhosts, firewall, SSH settings, or other services. Capture the actual exit code and output. Report COMPLETED only if the installer emits exactly NUSA_KARYA_PUBLIC_HTTPS=PASS domain=nusakarya.aicst.co.id. Otherwise report FAILED/BLOCKED with the real error; never infer success from SSH connection or local health alone.'
              ;;
            '[PC-SAFE] OPEN_NOTEPAD')
              action='OPEN_NOTEPAD'
              instruction='This is an owner-authorized safe PC test. Use the real local exec tool to run: powershell.exe -NoProfile -Command Start-Process -FilePath notepad.exe . Do not write or delete files. Report the actual execution result. Do not claim success without a tool call.'
              ;;
            '[PC-SAFE] CLOSE_NOTEPAD')
              action='CLOSE_NOTEPAD'
              instruction='Owner-authorized safe request. Close only the test Notepad window with PID 12124 using a graceful window-close request. Do not force-close, modify any files, or discard unsaved work. Verify the window is closed. If a save prompt appears, leave it open and report BLOCKED.'
              ;;
            '[PC-SAFE] MOVE_MOUSE_TOP')
              action='MOVE_MOUSE_TOP'
              instruction='This is an owner-authorized safe PC test. Use the real local exec tool to run: powershell.exe -NoProfile -File C:\Users\user\AppData\Local\Temp\oc-mouse-up-20261011.ps1 . Leave the cursor near the top of the desktop; do not restore its prior position. Report the actual execution result.'
              ;;
            *)
              echo 'Not an allowlisted safe PC action; nothing dispatched.'
              exit 1
              ;;
          esac
          external_id="pc-safe:issue:${REPOSITORY}:${ISSUE_NUMBER}"
          payload="$(jq -nc \
            --arg externalId "$external_id" \
            --arg instruction "$instruction" \
            --arg action "$action" \
            --arg targetClient "$target_client" \
            --arg issue "$ISSUE_NUMBER" \
            --arg repo "$REPOSITORY" \
            '{externalCommandId:$externalId,instruction:$instruction,source:"chatgpt-github-pc-safe",commandType:"EXTERNAL_AGENT_WORK",assignedClientId:$targetClient,metadata:{assignedClientId:$targetClient,safePcAction:$action,issueNumber:$issue,repository:$repo,conversationId:("pc-safe-issue-" + $issue)}}')"
          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$API_BASE_URL/ai/coding/bridge/commands")"
          command_id="$(jq -r '.command.id // empty' <<< "$response")"
          test "$command_id" != ''
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "AI Core accepted bounded $action for OpenClaw PC2 (command $command_id)."

      - name: Observe verified agent result and report to issue
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          API_BASE_URL: ${{ vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMAND_ID: ${{ steps.enqueue.outputs.command_id }}
          ACTION: ${{ steps.enqueue.outputs.action }}
        run: |
          set -euo pipefail
          # Register a fresh, bounded subscription before awaiting terminal events.
          # A read-only GET cannot create the missing subscription.
          subscription_id="pc-safe-issue-$ISSUE_NUMBER"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 20 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg conversationId "$subscription_id" '{conversationId:$conversationId,eventTypes:["COMPLETED","FAILED"],leaseSeconds:300}')" \
            "$API_BASE_URL/ai/coding/bridge/subscriptions" | jq -e '.subscription'
          status='PENDING_UNVERIFIED'
          ack_status='ACK_NOT_VERIFIED'
          for i in $(seq 1 24); do
            response="$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 15 \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              "$API_BASE_URL/ai/coding/bridge/subscriptions/pc-safe-issue-$ISSUE_NUMBER/events?limit=100")"
            event="$(jq -c --arg id "$COMMAND_ID" \
              '[.events[] | select(.commandId == $id and (.kind == "COMPLETED" or .kind == "FAILED"))] | last // empty' \
              <<< "$response")"
            if [ -n "$event" ] && [ "$event" != 'null' ]; then
              kind="$(jq -r '.kind' <<< "$event")"
              if [ "$kind" = 'COMPLETED' ]; then status='VERIFIED_COMPLETED'; else status='VERIFIED_FAILED'; fi
              # A returned hostname must be machine-verified, not merely completed.
              if [ "$ACTION" = 'HOSTNAME' ] && [ "$status" = 'VERIFIED_COMPLETED' ]; then
                jq -e '.message == "Travelintrips" and .checkpoint.statusCode == "RESULT_VERIFIED"' <<< "$event" >/dev/null || status='HOSTNAME_PROOF_FAILED'
              fi
              if [ "$ACTION" = 'DEPLOY_NUSA_KARYA' ] && [ "$status" = 'VERIFIED_COMPLETED' ]; then
                jq -e '.checkpoint.statusCode == "RESULT_VERIFIED" and (.message | contains("NUSA_KARYA_PUBLIC_HTTPS=PASS domain=nusakarya.aicst.co.id"))' <<< "$event" >/dev/null || status='DEPLOY_PROOF_FAILED'
              fi
              response_id="$(jq -r '.id // empty' <<< "$event")"
              if [ -n "$response_id" ]; then
                receipt="$(curl --fail-with-body --silent --show-error \
                  --connect-timeout 10 --max-time 20 \
                  -H "x-admin-api-key: $ADMIN_API_KEY" -H "Content-Type: application/json" \
                  -X POST "$API_BASE_URL/ai/coding/bridge/responses/$response_id/ack")"
                if jq -e --arg id "$response_id" '.id == $id and .acknowledgedAt != null' <<< "$receipt" >/dev/null; then
                  ack_status='ACK_VERIFIED'
                fi
              fi
              break
            fi
            sleep 5
          done
          message="ChatGPT → GitHub Actions → AI Core → OpenClaw PC worker check: **${status}**; ${ack_status}. Action: ${ACTION}. AI Core command: \`${COMMAND_ID}\`. AI Core callback reception is confirmed only with a persisted terminal response and receiver ACK. This does not assert delivery to a separate ChatGPT conversation."
          gh api -X POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$message" >/dev/null
          printf '### OpenClaw PC safe bridge\n\nAction: %s\nAI Core command: %s\nStatus: %s\nReceipt: %s\n' "$ACTION" "$COMMAND_ID" "$status" "$ack_status" >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = 'VERIFIED_COMPLETED' ] && [ "$ack_status" = 'ACK_VERIFIED' ]
