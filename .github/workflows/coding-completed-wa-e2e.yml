name: Coding Terminal WhatsApp Suppression E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Verify terminal task events stay out of WhatsApp
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      API_BASE_URL: https://aicore.cstlogistic.co.id/api
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}

    steps:
      - name: Verify production secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

      - name: Create isolated coding task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          correlation="terminal-wa-suppression-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body=$(jq -nc --arg c "$correlation" '{
            projectName:"Coding Terminal WhatsApp Suppression E2E",
            repository:"Travelintrips/Core-AI-Foundation",
            branch:"main",
            instruction:("Isolated terminal lifecycle suppression canary "+$c+". Verification only; no repository analysis, code edit, commit, push, merge, deploy, or model execution is required."),
            priority:1
          }')
          code=$(curl -sS -o /tmp/task.json -w "%{http_code}"             --retry 4 --retry-delay 2 --retry-all-errors             --connect-timeout 15 --max-time 60             -X POST "$API_BASE_URL/ai/coding/tasks"             -H "Content-Type: application/json"             -H "x-admin-api-key: $ADMIN_API_KEY"             -d "$body")
          echo "create_task_http=$code"
          cat /tmp/task.json
          test "$code" = "201"
          task_id=$(jq -r '.id // .task.id // empty' /tmp/task.json)
          [[ "$task_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

      - name: Bind task to lifecycle reporting
        id: binding
        shell: bash
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
        run: |
          set -euo pipefail
          external_id="terminal-wa-suppression-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          conversation_id="$external_id"
          payload=$(jq -nc --arg external "$external_id" --arg conversation "$conversation_id" --arg task "$TASK_ID" --arg run "$GITHUB_RUN_ID" '{
            externalCommandId:$external,
            instruction:"Passive lifecycle reporting binding for WhatsApp suppression canary.",
            taskId:$task,
            source:"github-actions",
            commandType:"EVENT_BINDING",
            metadata:{
              passiveEventBinding:true,
              conversationId:$conversation,
              eventTypes:["COMPLETED","FAILED","BLOCKED","MERGED","DEPLOYED"],
              workflow:"Coding Terminal WhatsApp Suppression E2E",
              runId:$run
            }
          }')
          code=$(curl -sS -o /tmp/binding.json -w "%{http_code}"             --retry 4 --retry-delay 2 --retry-all-errors             --connect-timeout 15 --max-time 60             -X POST "$API_BASE_URL/ai/coding/bridge/commands"             -H "Content-Type: application/json"             -H "x-admin-api-key: $ADMIN_API_KEY"             -d "$payload")
          test "$code" = "201" -o "$code" = "200"
          command_id=$(jq -r '.command.id // empty' /tmp/binding.json)
          [[ "$command_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "conversation_id=$conversation_id" >> "$GITHUB_OUTPUT"

      - name: Transition coding task to COMPLETED
        shell: bash
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
        run: |
          set -euo pipefail
          body=$(jq -nc '{
            status:"COMPLETED",
            resultSummary:"Suppression canary completed. Terminal lifecycle remains available in bridge/inbox but must not notify WhatsApp."
          }')
          code=$(curl -sS -o /tmp/completed.json -w "%{http_code}"             --retry 4 --retry-delay 2 --retry-all-errors             --connect-timeout 15 --max-time 60             -X PATCH "$API_BASE_URL/ai/coding/tasks/$TASK_ID"             -H "Content-Type: application/json"             -H "x-admin-api-key: $ADMIN_API_KEY"             -d "$body")
          test "$code" = "200"
          jq -e '.status == "COMPLETED"' /tmp/completed.json >/dev/null

      - name: Verify COMPLETED response is suppressed from WhatsApp
        id: suppression
        shell: bash
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
          CONVERSATION_ID: ${{ steps.binding.outputs.conversation_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 35); do
            code=$(curl -sS -o /tmp/responses.json -w "%{http_code}"               --retry 2 --retry-delay 1 --retry-all-errors               --connect-timeout 15 --max-time 60               -H "x-admin-api-key: $ADMIN_API_KEY"               "$API_BASE_URL/ai/coding/bridge/subscriptions/$CONVERSATION_ID/events?limit=20")
            test "$code" = "200"

            if node -e 'const fs=require("fs");const taskId=process.env.TASK_ID;const v=JSON.parse(fs.readFileSync("/tmp/responses.json","utf8"));const rows=Array.isArray(v.events)?v.events:[];const hit=rows.find(r=>(r.taskId===taskId||r.task_id===taskId)&&r.kind==="COMPLETED");if(!hit)process.exit(2);const metadata=hit.metadata||hit.metadataJson||hit.metadata_json||{};const wa=metadata.whatsappNotification||{};if(wa.dispatch?.status!=="skipped"||wa.dispatch?.reason!=="human_review_only_policy"){console.error("Unexpected WhatsApp policy",JSON.stringify({id:hit.id,wa}));process.exit(3);}fs.writeFileSync("/tmp/completed-response.json",JSON.stringify(hit));console.log("terminal_whatsapp_suppressed=PASS response_id="+hit.id);'; then
              break
            fi

            if [ "$attempt" = "35" ]; then
              echo "::error::COMPLETED response did not reach WhatsApp suppression state"
              cat /tmp/responses.json
              exit 2
            fi
            sleep 3
          done

          response_id=$(jq -r '.id' /tmp/completed-response.json)
          echo "response_id=$response_id" >> "$GITHUB_OUTPUT"

      - name: Verify Inbox still receives COMPLETED event
        shell: bash
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
          RESPONSE_ID: ${{ steps.suppression.outputs.response_id }}
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 15); do
            code=$(curl -sS -o /tmp/inbox.json -w "%{http_code}"               --retry 2 --retry-delay 1 --retry-all-errors               --connect-timeout 15 --max-time 60               -H "x-admin-api-key: $ADMIN_API_KEY"               "$API_BASE_URL/ai/core-chat/inbox?limit=100")
            test "$code" = "200"
            if jq -e --arg task "$TASK_ID" --arg response "$RESPONSE_ID"               '.messages[]? | select(.taskId == $task and .responseId == $response and .eventType == "COMPLETED")'               /tmp/inbox.json >/dev/null; then
              found=1
              break
            fi
            sleep 2
          done
          test "$found" = "1"

      - name: Summary
        shell: bash
        run: |
          echo "Terminal task event: PASS"
          echo "WhatsApp terminal notification: SUPPRESSED"
          echo "AI Core Inbox terminal event: PASS"
