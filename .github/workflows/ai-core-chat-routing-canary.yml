name: AI Core Chat Routing Canary

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Hostinger Production Verify
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-core-chat-routing-canary
  cancel-in-progress: true

jobs:
  scope:
    name: Scope chat routing canary
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
      reason: ${{ steps.scope.outputs.reason }}
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 2

      - name: Detect routing-sensitive change
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            echo "Manual routing canary requested."
            exit 0
          fi

          latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$latest_main_sha" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=stale_verified_sha" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping routing canary for stale verified SHA $EXPECTED_SHA; current main is $latest_main_sha."
            exit 0
          fi

          if ! git rev-parse "${EXPECTED_SHA}^1" >/dev/null 2>&1; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=parent_unavailable_fail_safe" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha=$(git rev-parse "${EXPECTED_SHA}^1")
          changed_files=$(git diff --name-only "$base_sha" "$EXPECTED_SHA")
          printf 'routing_canary_changed_files=\n%s\n' "$changed_files"

          should_run=false
          reason="no_routing_sensitive_change"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/ai-core-chat-routing-canary.yml|\
              artifacts/api-server/src/routes/ai-core-chat.ts|\
              artifacts/api-server/src/services/aiCoreWorkloadRouterService.ts|\
              artifacts/api-server/src/services/aiCoreChat*.ts|\
              artifacts/api-server/src/services/aiCoreConversation*.ts|\
              artifacts/api-server/src/services/aiCoreCapabilityRegistryService.ts|\
              artifacts/api-server/src/services/externalAgentRegistryService.ts|\
              artifacts/api-server/src/services/workerMonitor*.ts|\
              artifacts/api-server/src/services/aiExecution*.ts|\
              lib/api-spec/*|\
              lib/api-zod/*)
                should_run=true
                reason="routing_sensitive_path:$file"
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "routing_canary_scope=$should_run reason=$reason"

  routing-canary:
    name: Production chat routing canary
    needs: scope
    if: needs.scope.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
    steps:
      - name: Guard production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

      - name: Verify AI Core health
        shell: bash
        run: |
          set -euo pipefail
          # Hostinger's public edge can intermittently blackhole a GitHub runner
          # even after the production verification job has just succeeded.
          # Use bounded backoff here so the routing canary tests routing rather
          # than failing immediately on a short-lived edge/network condition.
          code=""
          for attempt in $(seq 1 6); do
            code=$(curl --http1.1 -sS -L --max-redirs 3 --proto-redir '=https' \
              --connect-timeout 15 --max-time 30 -o /tmp/healthz -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "User-Agent: CST-AI-Core-Health-Probe/1.0" \
              "$API_BASE_URL/healthz" || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$code" = "000" ] || [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ] || [ -z "$code" ]; then
              echo "Transient AI Core health HTTP ${code:-curl-error} (attempt $attempt/6); retrying..."
              sleep $((attempt * 10))
              continue
            fi
            echo "::error::AI Core health returned non-retryable HTTP $code"
            cat /tmp/healthz 2>/dev/null || true
            exit 1
          done
          echo "::error::AI Core health remained unreachable after bounded retries"
          exit 1

      - name: Assert runtime inventory routing
        shell: bash
        run: |
          set -euo pipefail
          ask() {
            local message="$1" context="${2:-[]}" out="$3"
            jq -nc --arg m "$message" --argjson c "$context" \
              '{message:$m,mode:"ask",modelPolicy:"cloud",conversationId:"production-chat-routing-canary",context:$c}' > /tmp/chat-request.json
            local code=""
            for attempt in $(seq 1 4); do
              code=$(curl --http1.1 -sS -L --max-redirs 3 --proto-redir '=https' \
                --retry 3 --retry-delay 2 --retry-all-errors \
                --post301 --post302 --post303 \
                --connect-timeout 15 --max-time 90 -o "$out" -w "%{http_code}" \
                -X POST "$API_BASE_URL/ai/core-chat/messages" \
                -H "Accept: application/json" \
                -H "User-Agent: CST-AI-Core-Health-Probe/1.0" \
                -H "Content-Type: application/json" \
                -H "x-admin-api-key: $ADMIN_API_KEY" \
                --data-binary @/tmp/chat-request.json || true)
              if [ "$code" = "200" ]; then return 0; fi
              if [ "$code" = "503" ] || [ "$code" = "502" ] || [ "$code" = "504" ] || [ "$code" = "000" ] || [ -z "$code" ]; then
                echo "Transient chat HTTP ${code:-curl-error} (attempt $attempt/4); retrying..."
                sleep $((attempt * 5))
                continue
              fi
              break
            done
            if [ "$code" = "403" ] && grep -Eqi 'Checking your browser before accessing|/hcdn-cgi/jschallenge' "$out" 2>/dev/null; then
              echo "::error::EDGE_WAF_BROWSER_CHALLENGE: Hostinger edge returned an interactive JavaScript challenge for the authenticated AI Core API request. Configure AI_CORE_VERIFY_BASE_URL to a trusted server-to-server origin that bypasses the browser challenge while preserving x-admin-api-key authentication."
              return 1
            fi
            echo "::error::AI Core Chat request failed after bounded retries with HTTP ${code:-curl-error}"
            jq -c '{error,warning}' "$out" 2>/dev/null || cat "$out"
            return 1
          }

          assert_not_financial_db() {
            local file="$1"
            if jq -e '
              ((.route // "" | ascii_downcase) | contains("admin_db")) or
              ((.kind // "" | ascii_downcase) | contains("admin_db")) or
              ((.reply // "" | ascii_downcase) |
                test("pendapatan|omzet|revenue|price_per_hour|ai_approval_queue\\.amount"))
            ' "$file" >/dev/null; then
              echo "::error::Runtime inventory question was misrouted into financial/Admin DB semantics"
              jq -c '{kind,route,status,reply}' "$file"
              exit 1
            fi
          }

          ask "Worker apa yang terpasang" '[]' /tmp/worker.json
          assert_not_financial_db /tmp/worker.json

          ask "Agent apa saja yang sudah terinstall disini" '[]' /tmp/agent.json
          assert_not_financial_db /tmp/agent.json

          context='[{"role":"user","text":"Berapa pendapatan minggu ini?"},{"role":"assistant","text":"Permintaan sebelumnya membahas pendapatan."}]'
          ask "Bukan pendapatan maksudnya agent ai" "$context" /tmp/correction.json
          assert_not_financial_db /tmp/correction.json

          ask "Worker apa yang terpasang" "$context" /tmp/context-leak.json
          assert_not_financial_db /tmp/context-leak.json

          echo "AI Core chat runtime-inventory routing canary passed."
