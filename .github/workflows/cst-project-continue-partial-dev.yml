name: CST Projects OpenClaw continue-partial DEV

on:
  pull_request:
    branches: [develop]
    paths:
      - 'artifacts/api-server/src/routes/cst-project-continue-partial-job.ts'
      - 'artifacts/api-server/src/services/devChatGptWakeService.ts'
      - 'artifacts/api-server/src/routes/__tests__/cst-project-continue-partial-job.test.ts'
      - 'artifacts/api-server/src/app.ts'
      - '.github/workflows/cst-project-continue-partial-dev.yml'
  push:
    branches: [develop]
    paths:
      - 'artifacts/api-server/src/routes/cst-project-continue-partial-job.ts'
      - 'artifacts/api-server/src/routes/__tests__/cst-project-continue-partial-job.test.ts'
      - 'artifacts/api-server/src/app.ts'
      - '.github/workflows/cst-project-continue-partial-dev.yml'

permissions:
  contents: read

jobs:
  scoped-project-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      APP_ENV: development
      SUPABASE_URL_DEV: https://xssrfshdrtdfupgqwfdw.supabase.co
      SUPABASE_DEV_DATABASE_URL: postgresql://test:test@db.xssrfshdrtdfupgqwfdw.supabase.co:1/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test all CST project continuation scopes and original GPT02 path
        run: pnpm -C artifacts/api-server exec vitest run src/routes/__tests__/cst-project-continue-partial-job.test.ts src/routes/__tests__/gpt02-continue-partial-job.test.ts
      - name: Verify no widening of DEV worker or privileges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('artifacts/api-server/src/routes/cst-project-continue-partial-job.ts').read_text()
          assert 'requireAgentServiceScope("agent:work")' in s
          assert 'resolveVerifiedDevWakeTarget(accountAlias, DEV_HOST, undefined, DEV_WAKE_DELL_WORKER, targetConversationId)' in s
          assert 'expectedBindingFingerprint' in s
          assert 'assistantContinued: false' in s and 'browserConfirmed: false' in s
          assert 'CST_DEV_PROJECTS' in s
          assert 'ALTER ROLE ' not in s and 'postgresql://' not in s
          print('CST_PROJECTS_CONTINUE_PARTIAL_FAIL_CLOSED_PASS')
          PY
