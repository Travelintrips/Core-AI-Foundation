name: Hostinger AI Core Archive Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI Verify
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hostinger-aicore-archive-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      HOSTINGER_API_BASE: https://developers.hostinger.com/api
      HOSTINGER_USERNAME: u684045296
      HOSTINGER_DOMAIN: aicore.cstlogistic.co.id
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      HEALTH_URL: https://aicore.cstlogistic.co.id/api/healthz
      ARCHIVE_NAME: aicore-release.zip

    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Validate Hostinger deployment credential
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOSTINGER_API_TOKEN:-}" ]; then
            echo "::error::HOSTINGER_API_TOKEN is not configured in the production environment."
            exit 1
          fi

      - name: Check whether exact commit is already live
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          live_sha=$(curl --http1.1 -sS -D - -o /tmp/preflight-body \
            --connect-timeout 15 --max-time 30 \
            -H "Accept: application/json" \
            -H "User-Agent: CST-AI-Core-Archive-Deploy/1.0" \
            "$HEALTH_URL" | awk -F": " 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2); print $2}' | tail -n1 || true)
          echo "live_sha=${live_sha:-missing}"
          echo "expected_sha=$EXPECTED_SHA"
          if [ "$live_sha" = "$EXPECTED_SHA" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package clean source archive
        if: steps.preflight.outputs.live != 'true'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/aicore-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          git archive --format=tar "$EXPECTED_SHA" | tar -xf - -C "$stage"

          # The API build embeds the release SHA by calling git rev-parse HEAD.
          # Add only the minimal metadata required for rev-parse; no history or credentials.
          mkdir -p "$stage/.git/refs/heads" "$stage/.git/objects/info" "$stage/.git/objects/pack"
          cat > "$stage/.git/config" <<'EOF'
          [core]
            repositoryformatversion = 0
            filemode = true
            bare = false
          EOF
          echo "ref: refs/heads/main" > "$stage/.git/HEAD"
          echo "$EXPECTED_SHA" > "$stage/.git/refs/heads/main"

          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/$ARCHIVE_NAME" .)
          test -s "$ARCHIVE_NAME"
          echo "archive_bytes=$(stat -c%s "$ARCHIVE_NAME")"

      - name: Read stored Node.js build settings
        if: steps.preflight.outputs.live != 'true'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds/settings"
          code=$(curl -sS -o /tmp/build-settings.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$endpoint")
          echo "build_settings_http=$code"
          if [ "$code" != "200" ]; then
            cat /tmp/build-settings.json
            exit 1
          fi
          jq -e '.node_version and .package_manager' /tmp/build-settings.json >/dev/null
          jq '{node_version,app_type,root_directory,output_directory,build_script,entry_file,package_manager}' /tmp/build-settings.json

      - name: Upload source archive to Hostinger
        if: steps.preflight.outputs.live != 'true'
        id: upload
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg username "$HOSTINGER_USERNAME" --arg domain "$HOSTINGER_DOMAIN" '{username:$username,domain:$domain}')
          code=$(curl -sS -o /tmp/upload-url.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -d "$payload" \
            "$HOSTINGER_API_BASE/hosting/v1/files/upload-urls")
          echo "upload_url_http=$code"
          test "$code" = "200"

          upload_url=$(jq -r '.url' /tmp/upload-url.json)
          auth_key=$(jq -r '.auth_key' /tmp/upload-url.json)
          rest_auth_key=$(jq -r '.rest_auth_key' /tmp/upload-url.json)
          test -n "$upload_url"
          test "$auth_key" != "null"
          test "$rest_auth_key" != "null"

          target="${upload_url%/}/$ARCHIVE_NAME?override=true"
          size=$(stat -c%s "$ARCHIVE_NAME")
          create_code=$(curl -sS -o /tmp/tus-create -w "%{http_code}" -X POST "$target" \
            --connect-timeout 15 --max-time 30 \
            -H "X-Auth: $auth_key" \
            -H "X-Auth-Rest: $rest_auth_key" \
            -H "Tus-Resumable: 1.0.0" \
            -H "Upload-Length: $size" \
            -H "Upload-Offset: 0")
          echo "tus_create_http=$create_code"
          test "$create_code" = "201"

          patch_code=$(curl -sS -o /tmp/tus-patch -w "%{http_code}" -X PATCH "$target" \
            --connect-timeout 15 --max-time 180 \
            -H "X-Auth: $auth_key" \
            -H "X-Auth-Rest: $rest_auth_key" \
            -H "Tus-Resumable: 1.0.0" \
            -H "Content-Type: application/offset+octet-stream" \
            -H "Upload-Offset: 0" \
            --data-binary "@$ARCHIVE_NAME")
          echo "tus_patch_http=$patch_code"
          test "$patch_code" = "204"

      - name: Start Hostinger Node.js build
        if: steps.preflight.outputs.live != 'true'
        id: build
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jq --arg archive "$ARCHIVE_NAME" '. + {source_type:"archive",source_options:{archive_path:$archive}}' \
            /tmp/build-settings.json > /tmp/build-request.json
          endpoint="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds"
          code=$(curl -sS -o /tmp/build-response.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -d @/tmp/build-request.json \
            "$endpoint")
          echo "start_build_http=$code"
          cat /tmp/build-response.json
          test "$code" = "200"
          uuid=$(jq -r '.uuid' /tmp/build-response.json)
          test "$uuid" != "null"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for Hostinger build completion
        if: steps.preflight.outputs.live != 'true'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          uuid="${{ steps.build.outputs.uuid }}"
          endpoint="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds/$uuid"
          logs_endpoint="$endpoint/logs"
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/build-state.json -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              "$endpoint")
            test "$code" = "200"
            state=$(jq -r '.state' /tmp/build-state.json)
            echo "build_attempt=$attempt state=$state"
            if [ "$state" = "completed" ]; then
              exit 0
            fi
            if [ "$state" = "failed" ]; then
              curl -sS -H "Authorization: Bearer $HOSTINGER_API_TOKEN" "$logs_endpoint" | jq -r '.logs // .' || true
              exit 1
            fi
            sleep 10
          done
          echo "::error::Hostinger build timed out."
          exit 1

      - name: Restart Node.js server
        if: steps.preflight.outputs.live != 'true'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/server/restart"
          code=$(curl -sS -o /tmp/restart.json -w "%{http_code}" -X POST \
            --connect-timeout 15 --max-time 30 \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$endpoint")
          echo "restart_http=$code"
          test "$code" = "200"

      - name: Verify exact release is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            rm -f /tmp/headers /tmp/body
            code=$(curl --http1.1 -sS -D /tmp/headers -o /tmp/body -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -H "Accept: application/json" \
              -H "User-Agent: CST-AI-Core-Archive-Deploy/1.0" \
              "$HEALTH_URL" || true)
            live_sha=$(awk -F": " 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2); print $2}' /tmp/headers | tail -n1)
            echo "verify_attempt=$attempt http=$code live_sha=${live_sha:-missing} expected_sha=$EXPECTED_SHA"
            if [ "$code" = "200" ] && [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "hostinger_archive_deploy=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Exact release did not become live."
          exit 1
