name: DEV Fast Verify

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Fast DEV verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build referenced libraries
        run: pnpm run typecheck:libs
      - name: API typecheck
        run: pnpm --filter @workspace/api-server run typecheck
      - name: AI Platform typecheck
        run: pnpm --filter @workspace/ai-platform run typecheck
