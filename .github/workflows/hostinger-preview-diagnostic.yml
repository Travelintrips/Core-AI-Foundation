name: Hostinger Canary Rollback and Preview Diagnostic

on:
  push:
    branches:
      - infra/hostinger-runtime-cleanup-20261021

permissions:
  contents: read

jobs:
  cleanup-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Remove canary A and inspect preview metadata
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_API_TOKEN:-}" || { echo "HOSTINGER_API_TOKEN missing"; exit 2; }
          base="https://developers.hostinger.com/api"
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          zone="cstlogistic.co.id"

          body='{"filters":[{"name":"www.dev-bizportal","type":"A"}]}'
          code=$(curl -sS --connect-timeout 8 --max-time 25             -X DELETE -H "$auth" -H "Content-Type: application/json"             --data-binary "$body" -o /tmp/delete.json -w "%{http_code}"             "$base/dns/v1/zones/$zone") || code=000
          echo "delete_canary_http=$code"
          cat /tmp/delete.json | jq -c 'if type=="object" then with_entries(select(.key|test("token|secret|key|password|auth";"i")|not)) else . end'
          [ "$code" = "200" ] || [ "$code" = "204" ]

          echo "=== STANDARD HOSTING WEBSITE PREVIEW FIELDS ==="
          curl -fsS --connect-timeout 8 --max-time 25 -H "$auth" "$base/hosting/v1/websites?per_page=100" -o /tmp/websites.json
          jq -c '.data[] | select(.domain=="aicore.cstlogistic.co.id" or .domain=="dev-aicore.cstlogistic.co.id" or .domain=="dev-bizportal.cstlogistic.co.id") |
            {domain,username,website_type,vhost_type,is_enabled,uid,uuid,preview_domain,preview,preview_url}' /tmp/websites.json

          echo "=== AGENCY API PROBE ==="
          acode=$(curl -sS --connect-timeout 8 --max-time 25 -H "$auth" -o /tmp/agency.json -w "%{http_code}" "$base/agency-hosting/v1/websites") || acode=000
          echo "agency_http=$acode"
          if [ "$acode" = "200" ]; then
            jq -c 'if .data? then [.data[] | {uid,description,state,preview_domain,domains,type,username}] else . end' /tmp/agency.json
          else
            cat /tmp/agency.json | jq -c 'if type=="object" then with_entries(select(.key|test("token|secret|key|password|auth";"i")|not)) else . end'
          fi

          echo "=== VERIFY API ZONE ==="
          curl -fsS --connect-timeout 8 --max-time 25 -H "$auth" "$base/dns/v1/zones/$zone" |
            jq -c '[.[] | select(.name=="www.dev-bizportal") | {name,type,ttl,records}]'
