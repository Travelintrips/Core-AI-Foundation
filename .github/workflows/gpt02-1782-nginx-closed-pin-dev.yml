name: GPT02-1782 verified closed Nginx boot pin (DEV source-only)

on:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/vps/gpt02_1782_failclosed_boot_precheck.py'
      - 'scripts/vps/test_gpt02_1782_failclosed_boot_precheck.py'
      - '.github/workflows/gpt02-1782-nginx-closed-pin-dev.yml'
  push:
    branches: [develop]
    paths:
      - 'scripts/vps/gpt02_1782_failclosed_boot_precheck.py'
      - 'scripts/vps/test_gpt02_1782_failclosed_boot_precheck.py'
      - '.github/workflows/gpt02-1782-nginx-closed-pin-dev.yml'

permissions:
  contents: read

jobs:
  boot-gate-regression-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile source without opening any live services
        run: python3 -B -m py_compile scripts/vps/gpt02_1782_failclosed_boot_precheck.py scripts/vps/test_gpt02_1782_failclosed_boot_precheck.py
      - name: Test exact pin-only source, safe startup denial and bounded restore
        run: python3 -B -m unittest discover -s scripts/vps -p test_gpt02_1782_failclosed_boot_precheck.py -v
      - name: Verify startup precheck has no administrative executor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("scripts/vps/gpt02_1782_failclosed_boot_precheck.py").read_text()
          assert "GPT02_LEDGER_READER_NOT_PROVISIONED" in source
          assert 'ff4a9c5c3a6399898b90c8990647c9430aee5251c84eb3fe38db92ddf0621d6d' in source
          for forbidden in ("import subprocess", "subprocess.run(", "os.system(", "requests.", "psycopg", "password", "ssh ", "nginx -s reload"):
              assert forbidden not in source, forbidden
          print("GPT02_BOOT_GATE_OFFLINE_PIN_BOUNDARY=PASS")
          PY
