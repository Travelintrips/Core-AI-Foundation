name: GPT02-1782 full-vhost 4-upstream allowlist boot guard (DEV source-only)

on:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/vps/gpt02_1782_failclosed_boot_precheck.py'
      - 'scripts/vps/test_gpt02_1782_failclosed_boot_precheck.py'
      - 'scripts/vps/gpt02_owner_ledger_nginx_restore_guard.py'
      - 'scripts/vps/test_gpt02_owner_ledger_nginx_restore_guard.py'
      - '.github/workflows/gpt02-1782-nginx-closed-pin-dev.yml'
  push:
    branches: [develop]
    paths:
      - 'scripts/vps/gpt02_1782_failclosed_boot_precheck.py'
      - 'scripts/vps/test_gpt02_1782_failclosed_boot_precheck.py'
      - 'scripts/vps/gpt02_owner_ledger_nginx_restore_guard.py'
      - 'scripts/vps/test_gpt02_owner_ledger_nginx_restore_guard.py'
      - '.github/workflows/gpt02-1782-nginx-closed-pin-dev.yml'

permissions:
  contents: read

jobs:
  boot-gate-regression-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile source without opening any live services
        run: python3 -B -m py_compile scripts/vps/gpt02_1782_failclosed_boot_precheck.py scripts/vps/test_gpt02_1782_failclosed_boot_precheck.py scripts/vps/gpt02_owner_ledger_nginx_restore_guard.py scripts/vps/test_gpt02_owner_ledger_nginx_restore_guard.py
      - name: Test full-vhost SHA with only four approved upstream cutovers and safe rollback
        run: |
          python3 -B -m unittest discover -s scripts/vps -p test_gpt02_1782_failclosed_boot_precheck.py -v
          python3 -B -m unittest discover -s scripts/vps -p test_gpt02_owner_ledger_nginx_restore_guard.py -v
      - name: Verify startup precheck has no administrative executor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("scripts/vps/gpt02_1782_failclosed_boot_precheck.py").read_text()
          assert "GPT02_LEDGER_READER_NOT_PROVISIONED" in source
          assert 'e34dde83f676dec15d27b56241b830cbffe7cb3ba0b07e6699f011d48fb651ed' in source
          assert 'ORIGINAL_CLOSED_SHA256' in source
          assert 'ALLOWED_UPSTREAM_TRANSITIONS' in source
          assert 'df256e23dae4cf20dbd23c33f3c259e341d86719363ccd1e0b0b80a3dff6777c' in source
          assert '1d8b8fd3492845c6fd0586d0fc43ff9fb366f5f62772eb4d968c84e0c3b31846' in source
          assert 'PR252_CLOSED_SNAPSHOTS' in source
          assert 'canonical_closed(data)' in source
          assert 'EXPECTED_OWNER_BLOCK_SHA256' not in source
          for forbidden in ("import subprocess", "subprocess.run(", "os.system(", "requests.", "psycopg", "password", "ssh ", "nginx -s reload"):
              assert forbidden not in source, forbidden
          source2 = Path("scripts/vps/gpt02_owner_ledger_nginx_restore_guard.py").read_text()
          assert 'LIVE_BOOT = Path("/usr/local/sbin/gpt02-1782-failclosed-boot-precheck.py")' in source2
          assert 'BOOT_SOURCE_SHA256 = "bff267b4cc76cca990f0cc03af30b3fa76604ce4e97e3340726ffce20e1c0bf4"' in source2
          assert "os.O_NOFOLLOW" in source2
          assert "load_pinned_boot_canonical" in source2
          assert "from gpt02_1782_failclosed_boot_precheck import" not in source2
          assert "permitted_open_to_closed" in source2
          assert "ACTIVE_CHANGED_BEFORE_RESTORE" in source2
          print("GPT02_CONCURRENT_ALLOWED_CUTOVER_ROLLBACK_BOUNDARY=PASS")
          print("GPT02_BOOT_GATE_WHOLE_VHOST_EXACT_4_CUTOVERS=PASS")
          PY
