name: CI Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify ZeroLLM deployment scripts
        run: |
          pnpm run zerollm:verify
          python3 -m py_compile services/zerollm/server.py
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        env:
          SUPABASE_DEV_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci_test
        run: pnpm run ci:test
      - name: Build
        env:
          PORT: 4173
          BASE_PATH: /
          HOSTINGER_FRONTEND: customer-portal
          ZEROLLM_INSTALL_ENABLED: "false"
        run: pnpm run build
      - name: Report CI failure to incident inbox
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          API_BASE_URL: https://aicore.cstlogistic.co.id/api
        run: |
          set +e
          payload=$(node -e 'console.log(JSON.stringify({
            source:"github",
            kind:"ci_failed",
            title:"GitHub CI Verify failed",
            summary:"CI Verify failed for "+process.env.GITHUB_REPOSITORY+" @ "+process.env.GITHUB_SHA,
            severity:"critical",
            riskClass:"GUARDED",
            repository:process.env.GITHUB_REPOSITORY,
            branch:process.env.GITHUB_REF_NAME,
            headSha:process.env.GITHUB_SHA,
            environment:"production",
            fingerprint:"github:ci:"+process.env.GITHUB_REPOSITORY+":"+process.env.GITHUB_SHA,
            metadata:{workflow:"CI Verify",runId:process.env.GITHUB_RUN_ID}
          }))')
          curl --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d "$payload" \
            "$API_BASE_URL/ai/incidents" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: core-ai-foundation-build
          path: |
            artifacts/ai-platform/dist
            artifacts/customer-portal/dist
            artifacts/api-server/dist
