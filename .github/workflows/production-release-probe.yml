name: Production Release Probe

on:
  push:
    branches:
      - release/7a12-prod-readiness
    paths:
      - .github/workflows/production-release-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deterministic production marker
        shell: bash
        run: |
          set +e
          DOMAIN="https://aicore.cstlogistic.co.id"
          EXPECTED_MARKER="phase7a12-prod-ready-20260924"

          curl -sS -D /tmp/headers -o /tmp/body --connect-timeout 15 --max-time 30 "$DOMAIN/api/healthz"
          rc=$?
          code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}' /tmp/headers)
          marker=$(awk 'BEGIN{IGNORECASE=1} /^X-CST-Release-Marker:/ {sub(/\r$/,"",$2); print $2}' /tmp/headers | tail -1)

          echo "curl_rc=$rc"
          echo "http_code=$code"
          echo "release_marker=${marker:-missing}"
          echo "body=$(head -c 500 /tmp/body | tr '\n' ' ')"

          if [ "$rc" -ne 0 ] || [ "$code" != "200" ]; then
            echo "PROBE_RESULT=production_unhealthy_or_unreachable"
            exit 2
          fi

          if [ "$marker" = "$EXPECTED_MARKER" ]; then
            echo "PROBE_RESULT=release_marker_live"
            exit 0
          fi

          echo "PROBE_RESULT=release_marker_not_live"
          exit 3
