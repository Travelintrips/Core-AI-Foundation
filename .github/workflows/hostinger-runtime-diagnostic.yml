name: Hostinger Node Runtime Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read Hostinger website and Node runtime status
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://developers.hostinger.com/api"
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          curl -fsS --connect-timeout 8 --max-time 25 -H "$auth" "$base/hosting/v1/websites?per_page=100" -o /tmp/hostinger-websites.json
          for domain in aicore.cstlogistic.co.id aifront.cstlogistic.co.id; do
            username=$(jq -r --arg domain "$domain" '.data[] | select(.domain == $domain and .website_type == "nodejs") | .username' /tmp/hostinger-websites.json | head -1)
            enabled=$(jq -r --arg domain "$domain" '.data[] | select(.domain == $domain and .website_type == "nodejs") | .is_enabled' /tmp/hostinger-websites.json | head -1)
            echo "domain=$domain found=$([ -n "$username" ] && echo yes || echo no) enabled=${enabled:-unknown}"
            if [ -z "$username" ]; then continue; fi
            root="$base/hosting/v1/accounts/$username/websites/$domain/nodejs"
            # Hostinger runtime logs are read-only; never emit raw messages,
            # stack traces, environment variables, credential-like strings or
            # unchecked "timestamp"/"severity" values in GitHub logs.
            runtime_code=$(curl --silent --show-error --connect-timeout 8 --max-time 25 \
              -H "$auth" -o /tmp/aicore-runtime-logs.json -w "%{http_code}" \
              "$root/runtime-logs?period=1h&limit=150") || runtime_code=000
            echo "domain=$domain endpoint=runtime-logs http=$runtime_code"
            if [ "$runtime_code" = "200" ]; then
              jq -c -f scripts/hostinger-runtime-classify.jq \
                /tmp/aicore-runtime-logs.json || echo "runtime_logs_format_unavailable"
            fi
            for path in builds/settings server/status builds; do
              code=$(curl -sS --connect-timeout 8 --max-time 25 -H "$auth" -o /tmp/diag.json -w "%{http_code}" "$root/$path") || code=000
              echo "domain=$domain endpoint=$path http=$code"
              if [ "$code" = "200" ]; then
                if [ "$path" = "builds/settings" ]; then
                  jq -c '{node_version,app_type,root_directory,output_directory,build_script,entry_file,package_manager}' /tmp/diag.json
                elif [ "$path" = "server/status" ]; then
                  jq -c 'if type == "object" then with_entries(select(.key | test("token|secret|key|password|auth|env";"i") | not)) else {type:type} end' /tmp/diag.json
                else
                  jq -c 'if .data? then [.data[:3][] | {uuid,state,status,created_at,updated_at}] else {type:type} end' /tmp/diag.json
                fi
              fi
            done
          done
