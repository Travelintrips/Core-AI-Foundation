name: OpenClaw Consumer Recovery
on:
  pull_request:
    paths:
      - 'deploy/ai-workers/**'
      - '.github/workflows/openclaw-consumer-tests.yml'
  push:
    branches: [develop]
    paths:
      - 'deploy/ai-workers/**'
      - '.github/workflows/openclaw-consumer-tests.yml'
permissions:
  contents: read
jobs:
  consumer-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s deploy/ai-workers -p 'test_external_agent_supervisor.py' -v
      - run: python -m py_compile deploy/ai-workers/external-agent-supervisor.py
