name: DEV SOP Checkpoint Secret Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-sop-checkpoint-secret-bootstrap
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    steps:
      - name: Validate DEV-only configuration
        env:
          PROVIDER: ${{ vars.AICORE_DEV_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.AICORE_DEV_GCP_SERVICE_ACCOUNT }}
          VPS_HOST: ${{ vars.AICORE_DEV_VPS_HOST }}
          VPS_USER: ${{ vars.AICORE_DEV_VPS_USER }}
          SSH_KEY: ${{ secrets.AICORE_DEV_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AICORE_DEV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for value in "$PROVIDER" "$SERVICE_ACCOUNT" "$VPS_HOST" "$VPS_USER" "$SSH_KEY" "$KNOWN_HOSTS"; do
            if [ -z "$value" ]; then echo "::error::DEV bootstrap settings are missing"; exit 1; fi
          done
          if [ "$SERVICE_ACCOUNT" != "aicore@aicore-505614.iam.gserviceaccount.com" ]; then
            echo "::error::Unexpected service account"; exit 1
          fi
          if [ "$VPS_HOST" != "srv1792369.hstgr.cloud" ] || [ "$VPS_USER" != "root" ]; then
            echo "::error::Unexpected DEV VPS target"; exit 1
          fi
          if ! printf '%s\n' "$KNOWN_HOSTS" | grep -Fq "srv1792369.hstgr.cloud ssh-ed25519 "; then
            echo "::error::Pinned DEV SSH host key missing"; exit 1
          fi

      - name: Authenticate to GCP with DEV OIDC identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.AICORE_DEV_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.AICORE_DEV_GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Stage two scoped checkpoint secrets on DEV VPS
        env:
          VPS_HOST: ${{ vars.AICORE_DEV_VPS_HOST }}
          VPS_USER: ${{ vars.AICORE_DEV_VPS_USER }}
          SSH_KEY: ${{ secrets.AICORE_DEV_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AICORE_DEV_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/checkpoint_dev_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/checkpoint_dev_key ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/checkpoint_dev_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          remote="$VPS_USER@$VPS_HOST"
          ssh "${ssh_opts[@]}" "$remote" 'install -d -m 700 /root/.config/aicore-dev-checkpoint'
          for kind in private public; do
            if [ "$kind" = private ]; then
              secret=aicore-dev-sop-checkpoint-ed25519-private-pkcs8
            else
              secret=aicore-dev-sop-checkpoint-ed25519-public-spki
            fi
            # Secret bytes travel only over the pinned SSH stream; never print them.
            gcloud secrets versions access latest --project=aicore-505614 --secret="$secret" |
              ssh "${ssh_opts[@]}" "$remote" "umask 077; test ! -e /root/.config/aicore-dev-checkpoint/$kind.b64 || exit 10; cat > /root/.config/aicore-dev-checkpoint/$kind.b64; chmod 600 /root/.config/aicore-dev-checkpoint/$kind.b64"
          done
          ssh "${ssh_opts[@]}" "$remote" '
            test -s /root/.config/aicore-dev-checkpoint/private.b64 &&
            test -s /root/.config/aicore-dev-checkpoint/public.b64 &&
            test "$(stat -c %a /root/.config/aicore-dev-checkpoint/private.b64)" = 600 &&
            test "$(stat -c %a /root/.config/aicore-dev-checkpoint/public.b64)" = 600
          '
          echo "DEV checkpoint secrets staged via OIDC and pinned SSH; no containers restarted."
