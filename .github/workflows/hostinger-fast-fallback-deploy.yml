name: Hostinger AI Core Fast Fallback Deploy

on:
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Skip native Git grace and deploy through Hostinger API immediately"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - CI Verify
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hostinger-aicore-fast-fallback-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy exact main commit with bounded native-Git grace
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      HOSTINGER_API_BASE: https://developers.hostinger.com/api
      HOSTINGER_USERNAME: u684045296
      HOSTINGER_DOMAIN: aicore.cstlogistic.co.id
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      HEALTH_URL: https://aicore.cstlogistic.co.id/api/healthz
      ARCHIVE_NAME: aicore-release.zip
      NATIVE_GRACE_ATTEMPTS: "6"
      NATIVE_GRACE_DELAY_SECONDS: "10"

    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 2

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "latest_main_sha=$latest_main_sha" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA"

          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$EXPECTED_SHA" != "$latest_main_sha" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale deploy trigger. expected_sha=$EXPECTED_SHA latest_main_sha=$latest_main_sha"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Give native Git a short grace period
        id: preflight
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          FORCE_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fallback || false }}
        run: |
          set -euo pipefail

          if [ "$FORCE_FALLBACK" = "true" ]; then
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "reason=manual_force" >> "$GITHUB_OUTPUT"
            echo "native_git_grace=SKIPPED reason=manual_force"
            exit 0
          fi

          for attempt in $(seq 1 "$NATIVE_GRACE_ATTEMPTS"); do
            latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
            if [ "$EXPECTED_SHA" != "$latest_main_sha" ]; then
              echo "live=false" >> "$GITHUB_OUTPUT"
              echo "stale=true" >> "$GITHUB_OUTPUT"
              echo "reason=newer_main_commit" >> "$GITHUB_OUTPUT"
              echo "::notice::Stopping fallback because a newer main commit exists: $latest_main_sha"
              exit 0
            fi

            rm -f /tmp/native-headers /tmp/native-body
            code=$(curl --http1.1 --retry 1 --retry-delay 1 --retry-all-errors -sS               -D /tmp/native-headers -o /tmp/native-body -w "%{http_code}"               --connect-timeout 10 --max-time 20               -H "Accept: application/json"               -H "User-Agent: CST-AI-Core-Fast-Deploy/1.0"               "$HEALTH_URL" || true)
            live_sha=$(awk -F': ' 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2); print $2}' /tmp/native-headers 2>/dev/null | tail -n1)

            echo "native_grace_attempt=$attempt/$NATIVE_GRACE_ATTEMPTS http=${code:-000} live_sha=${live_sha:-missing} expected_sha=$EXPECTED_SHA"
            if [ "$code" = "200" ] && [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "live=true" >> "$GITHUB_OUTPUT"
              echo "stale=false" >> "$GITHUB_OUTPUT"
              echo "reason=native_git_live" >> "$GITHUB_OUTPUT"
              echo "native_git_grace=PASS"
              exit 0
            fi

            if [ "$attempt" -lt "$NATIVE_GRACE_ATTEMPTS" ]; then
              sleep "$NATIVE_GRACE_DELAY_SECONDS"
            fi
          done

          echo "live=false" >> "$GITHUB_OUTPUT"
          echo "stale=false" >> "$GITHUB_OUTPUT"
          echo "reason=native_git_timeout" >> "$GITHUB_OUTPUT"
          echo "::notice::Native Git did not publish the exact SHA within the short grace period; starting Hostinger API fallback."

      - name: Validate Hostinger deployment credential
        if: >-
          steps.target.outputs.stale != 'true' &&
          steps.preflight.outputs.stale != 'true' &&
          steps.preflight.outputs.live != 'true'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOSTINGER_API_TOKEN:-}" ]; then
            echo "::error::HOSTINGER_API_TOKEN is not configured in the production environment."
            exit 1
          fi

      - name: Package clean source archive
        if: >-
          steps.target.outputs.stale != 'true' &&
          steps.preflight.outputs.stale != 'true' &&
          steps.preflight.outputs.live != 'true'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/aicore-stage"
          rm -rf "$stage" "$ARCHIVE_NAME"
          mkdir -p "$stage"
          git archive --format=tar "$EXPECTED_SHA" | tar -xf - -C "$stage"

          # Build metadata must identify the exact verified commit without
          # shipping repository history or credentials.
          mkdir -p "$stage/.git/refs/heads" "$stage/.git/objects/info" "$stage/.git/objects/pack"
          cat > "$stage/.git/config" <<'EOF'
          [core]
            repositoryformatversion = 0
            filemode = true
            bare = false
          EOF
          echo "ref: refs/heads/main" > "$stage/.git/HEAD"
          echo "$EXPECTED_SHA" > "$stage/.git/refs/heads/main"

          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/$ARCHIVE_NAME" .)
          test -s "$ARCHIVE_NAME"
          echo "archive_bytes=$(stat -c%s "$ARCHIVE_NAME")"

      - name: Read stored Node.js build settings
        if: >-
          steps.target.outputs.stale != 'true' &&
          steps.preflight.outputs.stale != 'true' &&
          steps.preflight.outputs.live != 'true'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds/settings"
          code=$(curl -sS -o /tmp/build-settings.json -w "%{http_code}"             --connect-timeout 15 --max-time 30             -H "Accept: application/json"             -H "Authorization: Bearer $HOSTINGER_API_TOKEN"             "$endpoint")
          echo "build_settings_http=$code"
          if [ "$code" != "200" ]; then
            cat /tmp/build-settings.json
            exit 1
          fi
          jq -e '.node_version and .package_manager' /tmp/build-settings.json >/dev/null
          jq '{node_version,app_type,root_directory,output_directory,build_script,entry_file,package_manager}' /tmp/build-settings.json

      - name: Upload source archive to Hostinger
        if: >-
          steps.target.outputs.stale != 'true' &&
          steps.preflight.outputs.stale != 'true' &&
          steps.preflight.outputs.live != 'true'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg username "$HOSTINGER_USERNAME" --arg domain "$HOSTINGER_DOMAIN" '{username:$username,domain:$domain}')
          code=$(curl -sS -o /tmp/upload-url.json -w "%{http_code}"             --connect-timeout 15 --max-time 30             -H "Content-Type: application/json"             -H "Authorization: Bearer $HOSTINGER_API_TOKEN"             -d "$payload"             "$HOSTINGER_API_BASE/hosting/v1/files/upload-urls")
          echo "upload_url_http=$code"
          test "$code" = "200"

          upload_url=$(jq -r '.url' /tmp/upload-url.json)
          auth_key=$(jq -r '.auth_key' /tmp/upload-url.json)
          rest_auth_key=$(jq -r '.rest_auth_key' /tmp/upload-url.json)
          test -n "$upload_url"
          test "$upload_url" != "null"
          test "$auth_key" != "null"
          test "$rest_auth_key" != "null"

          target="${upload_url%/}/$ARCHIVE_NAME?override=true"
          size=$(stat -c%s "$ARCHIVE_NAME")
          create_code=$(curl -sS -o /tmp/tus-create -w "%{http_code}" -X POST "$target"             --connect-timeout 15 --max-time 30             -H "X-Auth: $auth_key"             -H "X-Auth-Rest: $rest_auth_key"             -H "Tus-Resumable: 1.0.0"             -H "Upload-Length: $size"             -H "Upload-Offset: 0")
          echo "tus_create_http=$create_code"
          test "$create_code" = "201"

          patch_code=$(curl -sS -o /tmp/tus-patch -w "%{http_code}" -X PATCH "$target"             --connect-timeout 15 --max-time 180             -H "X-Auth: $auth_key"             -H "X-Auth-Rest: $rest_auth_key"             -H "Tus-Resumable: 1.0.0"             -H "Content-Type: application/offset+octet-stream"             -H "Upload-Offset: 0"             --data-binary "@$ARCHIVE_NAME")
          echo "tus_patch_http=$patch_code"
          test "$patch_code" = "204"

      - name: Reconfirm latest main before fallback build
        id: fallback_target
        if: >-
          steps.target.outputs.stale != 'true' &&
          steps.preflight.outputs.stale != 'true' &&
          steps.preflight.outputs.live != 'true'
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "latest_main_sha=$latest_main_sha"
          if [ "$EXPECTED_SHA" != "$latest_main_sha" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Archive was prepared but build is skipped because main advanced to $latest_main_sha."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Hostinger Node.js fallback build
        id: build
        if: >-
          steps.target.outputs.stale != 'true' &&
          steps.preflight.outputs.stale != 'true' &&
          steps.preflight.outputs.live != 'true' &&
          steps.fallback_target.outputs.stale != 'true'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jq --arg archive "$ARCHIVE_NAME" '. + {source_type:"archive",source_options:{archive_path:$archive}}'             /tmp/build-settings.json > /tmp/build-request.json
          endpoint="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds"
          code=$(curl -sS -o /tmp/build-response.json -w "%{http_code}"             --connect-timeout 15 --max-time 30             -H "Content-Type: application/json"             -H "Authorization: Bearer $HOSTINGER_API_TOKEN"             -d @/tmp/build-request.json             "$endpoint")
          echo "start_build_http=$code"
          if [ "$code" != "200" ]; then
            cat /tmp/build-response.json
            exit 1
          fi
          uuid=$(jq -r '.uuid' /tmp/build-response.json)
          test -n "$uuid"
          test "$uuid" != "null"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for Hostinger fallback build completion
        if: steps.build.outputs.uuid != ''
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          uuid="${{ steps.build.outputs.uuid }}"
          endpoint="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds/$uuid"
          logs_endpoint="$endpoint/logs"
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/build-state.json -w "%{http_code}"               --connect-timeout 15 --max-time 30               -H "Authorization: Bearer $HOSTINGER_API_TOKEN"               "$endpoint")
            test "$code" = "200"
            state=$(jq -r '.state' /tmp/build-state.json)
            echo "build_attempt=$attempt state=$state"
            if [ "$state" = "completed" ]; then
              exit 0
            fi
            if [ "$state" = "failed" ]; then
              curl -sS -H "Authorization: Bearer $HOSTINGER_API_TOKEN" "$logs_endpoint" | jq -r '.logs // .' || true
              exit 1
            fi
            sleep 10
          done
          echo "::error::Hostinger fallback build timed out."
          exit 1

      - name: Restart Node.js server
        if: steps.build.outputs.uuid != ''
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/server/restart"
          code=$(curl -sS -o /tmp/restart.json -w "%{http_code}" -X POST             --connect-timeout 15 --max-time 30             -H "Authorization: Bearer $HOSTINGER_API_TOKEN"             "$endpoint")
          echo "restart_http=$code"
          if [ "$code" != "200" ]; then
            cat /tmp/restart.json
            exit 1
          fi

      - name: Verify exact release is live
        if: >-
          steps.target.outputs.stale != 'true' &&
          steps.preflight.outputs.stale != 'true' &&
          steps.fallback_target.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
            if [ "$EXPECTED_SHA" != "$latest_main_sha" ]; then
              echo "::notice::Verification stops because main advanced to $latest_main_sha."
              exit 0
            fi

            rm -f /tmp/headers /tmp/body
            code=$(curl --http1.1 -sS -D /tmp/headers -o /tmp/body -w "%{http_code}"               --connect-timeout 15 --max-time 30               -H "Accept: application/json"               -H "User-Agent: CST-AI-Core-Fast-Deploy/1.0"               "$HEALTH_URL" || true)
            live_sha=$(awk -F': ' 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2); print $2}' /tmp/headers | tail -n1)
            echo "verify_attempt=$attempt http=$code live_sha=${live_sha:-missing} expected_sha=$EXPECTED_SHA"
            if [ "$code" = "200" ] && [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "hostinger_fast_deploy=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Exact release did not become live after fallback deploy."
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Initial target stale: ${{ steps.target.outputs.stale || 'unknown' }}"
          echo "Native Git live: ${{ steps.preflight.outputs.live || 'unknown' }}"
          echo "Native Git result: ${{ steps.preflight.outputs.reason || 'not-run' }}"
          echo "Fallback target stale: ${{ steps.fallback_target.outputs.stale || 'not-run' }}"
          echo "Fallback build UUID: ${{ steps.build.outputs.uuid || 'not-run' }}"
