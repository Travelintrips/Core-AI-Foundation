name: DEV DELL wake component gate

on:
  pull_request:
    branches: [develop]
    paths:
      - scripts/dev/dell-wake-executor.mjs
      - scripts/dev/test-dell-wake-executor.mjs
      - scripts/windows/ai-core/dev-chatgpt-wake-once.py
      - scripts/windows/ai-core/test_dev_chatgpt_wake_once.py
      - scripts/windows/ai-core/dev-chatgpt-native-composer.psm1
      - scripts/windows/ai-core/test-dev-chatgpt-native-composer.ps1
      - scripts/windows/ai-core/test-dev-chatgpt-native-focus-activation.ps1
      - scripts/windows/ai-core/dev-chatgpt-native-bridge.ps1
      - scripts/windows/ai-core/dev_chatgpt_native_*.py
      - scripts/windows/ai-core/test_dev_chatgpt_native_*.py
      - .github/workflows/dev-dell-wake-component-tests.yml
  push:
    branches: [develop]
    paths:
      - scripts/dev/dell-wake-executor.mjs
      - scripts/dev/test-dell-wake-executor.mjs
      - scripts/windows/ai-core/dev-chatgpt-wake-once.py
      - scripts/windows/ai-core/test_dev_chatgpt_wake_once.py
      - scripts/windows/ai-core/dev-chatgpt-native-composer.psm1
      - scripts/windows/ai-core/test-dev-chatgpt-native-composer.ps1
      - scripts/windows/ai-core/test-dev-chatgpt-native-focus-activation.ps1
      - scripts/windows/ai-core/dev-chatgpt-native-bridge.ps1
      - scripts/windows/ai-core/dev_chatgpt_native_*.py
      - scripts/windows/ai-core/test_dev_chatgpt_native_*.py
      - .github/workflows/dev-dell-wake-component-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-dell-wake-component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated Python test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/dell-wake-tests"
          "$RUNNER_TEMP/dell-wake-tests/bin/python" -m pip install cryptography==50.0.2
      - name: Validate executor binding and receipt gates
        run: |
          node --check scripts/dev/dell-wake-executor.mjs
          node scripts/dev/test-dell-wake-executor.mjs
      - name: Validate helper routing, idempotency and signatures
        run: |
          "$RUNNER_TEMP/dell-wake-tests/bin/python" -m py_compile scripts/windows/ai-core/dev-chatgpt-wake-once.py scripts/windows/ai-core/dev_chatgpt_native_reader.py scripts/windows/ai-core/dev_chatgpt_native_transport.py scripts/windows/ai-core/dev_chatgpt_native_lease.py
          "$RUNNER_TEMP/dell-wake-tests/bin/python" -m unittest discover -s scripts/windows/ai-core -p 'test_dev_chatgpt_*.py' -v
  native-composer-components:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate native composer guards without a live browser
        shell: powershell
        run: scripts/windows/ai-core/test-dev-chatgpt-native-composer.ps1
      - name: Validate bounded native focus recovery without a live browser
        shell: powershell
        run: scripts/windows/ai-core/test-dev-chatgpt-native-focus-activation.ps1
