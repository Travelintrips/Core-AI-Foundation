name: AI Core Live Coding Delegation

on:
  workflow_run:
    workflows:
      - Hostinger Production Verify
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-core-live-coding-delegation
  cancel-in-progress: false

jobs:
  delegate:
    name: Delegate real coding task through AI Core Chat
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
    steps:
      - name: Submit goal-level coding instruction
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          instruction='Audit AI Core Chat pada repository Core-AI-Foundation. Cari satu masalah kecil tetapi nyata pada reliability atau error handling yang aman untuk diperbaiki. Analisis penyebabnya, buat rencana kerja, bagi pekerjaan ke agent/worker yang sesuai bila diperlukan, implementasikan perbaikannya, tambahkan atau perbarui regression test, jalankan verification yang relevan, lalu laporkan hasil akhirnya beserta bukti test. Jangan melakukan perubahan production yang destruktif dan jangan melewati approval gate yang diwajibkan.'
          jq -nc --arg m "$instruction" '{message:$m,mode:"agent",modelPolicy:"auto",projectName:"AI Core",repository:"Travelintrips/Core-AI-Foundation",branch:"main",conversationId:"live-coding-delegation-20260930"}' > /tmp/request.json
          code=""
          for attempt in $(seq 1 5); do
            code=$(curl -sS --connect-timeout 10 --max-time 90 -o /tmp/response.json -w "%{http_code}" \
              -X POST "$API_BASE_URL/ai/core-chat/messages" \
              -H "Content-Type: application/json" \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              --data-binary @/tmp/request.json || true)
            if [ "$code" = "202" ] || [ "$code" = "200" ]; then break; fi
            if [ "$code" = "503" ] || [ "$code" = "502" ] || [ "$code" = "504" ] || [ "$code" = "000" ] || [ -z "$code" ]; then
              echo "Transient AI Core Chat HTTP ${code:-curl-error} (attempt $attempt/5); retrying..."
              sleep $((attempt * 5))
              continue
            fi
            break
          done
          if [ "$code" != "202" ] && [ "$code" != "200" ]; then
            if [ "$code" = "403" ] && grep -Eqi 'Checking your browser before accessing|/hcdn-cgi/jschallenge' /tmp/response.json 2>/dev/null; then
              echo "::error::EDGE_WAF_BROWSER_CHALLENGE: Hostinger edge returned an interactive JavaScript challenge for the authenticated AI Core API request. Configure AI_CORE_VERIFY_BASE_URL to a trusted server-to-server origin that bypasses the browser challenge while preserving x-admin-api-key authentication."
              exit 1
            fi
            echo "::error::AI Core Chat delegation failed after bounded retries with HTTP ${code:-curl-error}"
            jq -c '{error,warning}' /tmp/response.json 2>/dev/null || cat /tmp/response.json
            exit 1
          fi
          jq -c '{kind,status,route,taskId,reply}' /tmp/response.json
          task_id=$(jq -r '.taskId // empty' /tmp/response.json)
          test -n "$task_id"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

      - name: Verify task is observable
        shell: bash
        run: |
          set -euo pipefail
          task="${{ steps.submit.outputs.task_id }}"
          for attempt in $(seq 1 240); do
            code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/progress.json -w "%{http_code}"               "$API_BASE_URL/ai/core-chat/tasks/$task/progress"               -H "x-admin-api-key: $ADMIN_API_KEY" || true)
            if [ "$code" = "200" ]; then
              jq -c '{task:.task, autonomous:.autonomous, latestRun:.latestRun, workspaceUrl:.workspaceUrl}' /tmp/progress.json
              observed_id=$(jq -r '.task.id // empty' /tmp/progress.json)
              observed_status=$(jq -r '.task.status // empty' /tmp/progress.json)
              autonomous_status=$(jq -r '.autonomous.status // empty' /tmp/progress.json)
              test "$observed_id" = "$task"
              test -n "$observed_status"
              case "$autonomous_status" in
                FAILED|BLOCKED|DISABLED)
                  echo "::error::Delegated coding autonomous runtime reached terminal failure state: $autonomous_status"
                  jq -c '{task:.task,latestRun:.latestRun,autonomous:.autonomous}' /tmp/progress.json
                  exit 1
                  ;;
                APPROVAL_REQUIRED)
                  echo "Delegated coding autonomous runtime reached approval state: $autonomous_status"
                  jq -c '{task:.task,latestRun:.latestRun,autonomous:.autonomous}' /tmp/progress.json
                  exit 0
                  ;;
                COMPLETED)
                  case "$observed_status" in
                    COMPLETED|AWAITING_APPROVAL|REVIEW_AI_PATCH)
                      echo "Delegated coding task reached an accepted state before autonomous completion: $observed_status"
                      jq -c '{task:.task,latestRun:.latestRun,autonomous:.autonomous}' /tmp/progress.json
                      exit 0
                      ;;
                    *)
                      echo "::error::Autonomous runtime completed before the delegated coding task reached an accepted terminal/approval state"
                      jq -c '{task:.task,latestRun:.latestRun,autonomous:.autonomous}' /tmp/progress.json
                      exit 1
                      ;;
                  esac
                  ;;
              esac
              case "$observed_status" in
                FAILED|CANCELLED)
                  echo "::error::Delegated coding task reached terminal failure state: $observed_status"
                  jq -c '{task:.task,latestRun:.latestRun,autonomous:.autonomous}' /tmp/progress.json
                  exit 1
                  ;;
                COMPLETED|AWAITING_APPROVAL|REVIEW_AI_PATCH)
                  echo "Delegated coding task reached an accepted terminal/approval state: $observed_status"
                  jq -c '{task:.task,latestRun:.latestRun,autonomous:.autonomous}' /tmp/progress.json
                  exit 0
                  ;;
                *)
                  echo "Task is still in progress: $observed_status"
                  ;;
              esac
            fi
            sleep 5
          done
          echo "::error::Delegated coding task did not reach a terminal/approval state within bounded polling window"
          exit 1
