name: Provision isolated DEV AI Task DNS once

on:
  push:
    branches:
      - feat/ai-task-automatic-lifecycle-20261014
    paths:
      - .github/workflows/provision-dev-ai-task-dns-once.yml

permissions:
  contents: read

jobs:
  provision-dev-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: development
    steps:
      - name: Validate Hostinger credentials and check DNS ownership
        env:
          API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$API_TOKEN"
          base=https://developers.hostinger.com/api/dns/v1/zones/cstlogistic.co.id
          curl --fail-with-body -sS -H "Authorization: Bearer $API_TOKEN" "$base" -o /tmp/dev-zone.json
          if jq -e '.[] | select(.name == "dev-ai-task" and .type == "A")' /tmp/dev-zone.json >/dev/null; then
            if jq -e '.[] | select(.name == "dev-ai-task" and .type == "A") | .records[] | select(.content == "72.61.210.205")' /tmp/dev-zone.json >/dev/null; then
              echo "DEV DNS record already exists with correct address; no update needed"
              exit 0
            fi
            echo "DEV DNS record exists but points elsewhere; refusing overwrite"
            exit 1
          fi
          cat >/tmp/dev-zone-update.json <<'JSON'
          {
            "overwrite": false,
            "zone": [
              {
                "name": "dev-ai-task",
                "records": [{"content": "72.61.210.205"}],
                "ttl": 300,
                "type": "A"
              }
            ]
          }
          JSON
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/dev-zone-update.json "$base/validate" -o /dev/null
          curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/dev-zone-update.json "$base" -o /dev/null
          echo "DEV DNS A record requested: dev-ai-task.cstlogistic.co.id -> 72.61.210.205"
