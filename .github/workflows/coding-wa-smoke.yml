name: Coding WA Policy Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify critical-review-only WhatsApp policy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      API_BASE_URL: https://aicore.cstlogistic.co.id/api
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}

    steps:
      - name: Verify admin secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

      - name: Check production WhatsApp notifier config
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/wa-status.json -w "%{http_code}"             --retry 4 --retry-delay 2 --retry-all-errors             --connect-timeout 15 --max-time 60             -H "x-admin-api-key: $ADMIN_API_KEY"             "$API_BASE_URL/ai/coding/bridge/whatsapp-status")
          test "$code" = "200"
          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("/tmp/wa-status.json","utf8"));const c=v.configured||{};if(!(c.baseUrl&&c.apiKey&&c.to)){console.error("WhatsApp notifier config incomplete:",c);process.exit(2)};console.log("whatsapp_config=COMPLETE")'

      - name: Verify no-message diagnostic policy
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/wa-test.json -w "%{http_code}"             --retry 4 --retry-delay 2 --retry-all-errors             --connect-timeout 15 --max-time 60             -X POST             -H "x-admin-api-key: $ADMIN_API_KEY"             -H "content-type: application/json"             -d '{}'             "$API_BASE_URL/ai/coding/bridge/whatsapp-test")
          test "$code" = "200"
          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("/tmp/wa-test.json","utf8"));if(!(v.ok&&v.policy==="critical_human_review_only")){console.error("Unexpected WhatsApp policy:",v);process.exit(2)};console.log("whatsapp_policy=CRITICAL_HUMAN_REVIEW_ONLY")'

      - name: Summary
        run: |
          echo "WhatsApp config: PASS"
          echo "Policy: critical human review only"
          echo "No diagnostic message sent to admin"
