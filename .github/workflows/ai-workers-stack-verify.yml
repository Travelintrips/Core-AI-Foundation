name: AI Workers Stack Verify

on:
  pull_request:
    paths:
      - "deploy/ai-workers/**"
      - "scripts/install-ai-workers.sh"
      - "scripts/ai-workers-healthcheck.sh"
      - "scripts/ai-workers-agent-token-hash.sh"
      - "scripts/connect-ai-workers-to-aicore.sh"
      - "scripts/tests/test_ai_workers_connect.py"
      - ".github/workflows/ai-workers-stack-verify.yml"
      - ".github/workflows/ai-workers-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/ai-workers/**"
      - "scripts/install-ai-workers.sh"
      - "scripts/ai-workers-healthcheck.sh"
      - "scripts/ai-workers-agent-token-hash.sh"
      - "scripts/connect-ai-workers-to-aicore.sh"
      - "scripts/tests/test_ai_workers_connect.py"
      - ".github/workflows/ai-workers-stack-verify.yml"
      - ".github/workflows/ai-workers-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-workers-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEMPORAL_POSTGRES_PASSWORD: ci-temporal-password
      N8N_POSTGRES_PASSWORD: ci-n8n-password
      N8N_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      OPENHANDS_LOCAL_BACKEND_API_KEY: ci-openhands-key
      OPENCLAW_GATEWAY_TOKEN: ci-openclaw-token

    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n scripts/install-ai-workers.sh
          bash -n scripts/ai-workers-healthcheck.sh
          bash -n scripts/ai-workers-agent-token-hash.sh
          bash -n scripts/connect-ai-workers-to-aicore.sh
          sh -n deploy/ai-workers/temporal/scripts/setup-postgres.sh
          sh -n deploy/ai-workers/temporal/scripts/create-namespace.sh
          python3 -m py_compile deploy/ai-workers/temporal/coding-worker.py

      - name: Worker verification regression tests (offline)
        run: python3 -m unittest discover -s scripts/tests -p 'test_ai_workers_connect.py' -v

      - name: Validate Compose model
        run: |
          set -euo pipefail
          docker compose \
            --env-file deploy/ai-workers/.env.example \
            -f deploy/ai-workers/docker-compose.yml \
            config --quiet

      - name: Verify Temporal coding worker runtime imports
        run: |
          set -euo pipefail
          docker build             -t ai-core-temporal-coding-worker-ci             -f deploy/ai-workers/temporal/coding-worker.Dockerfile             deploy/ai-workers
          docker run --rm --entrypoint python             ai-core-temporal-coding-worker-ci             -c 'import runpy; runpy.run_path("/app/coding-worker.py", run_name="ci_import")'

      - name: Verify Temporal image pins
        shell: bash
        run: |
          set -euo pipefail
          docker manifest inspect temporalio/server:1.32.0 >/dev/null
          docker manifest inspect temporalio/admin-tools:1.32.0 >/dev/null
          docker manifest inspect temporalio/ui:2.54.1 >/dev/null

          file=deploy/ai-workers/docker-compose.yml
          grep -q 'temporalio/server:' "$file"
          grep -q 'temporalio/admin-tools:' "$file"
          ! grep -q 'temporalio/auto-setup:' "$file"

      - name: Verify isolation invariants
        shell: bash
        run: |
          set -euo pipefail
          file=deploy/ai-workers/docker-compose.yml

          published=$(grep -E '^[[:space:]]+- "127\.0\.0\.1:' "$file" | wc -l)
          test "$published" -ge 5

          ! grep -q '/var/run/docker.sock' "$file"
          ! grep -q 'ADMIN_API_KEY' "$file"

          grep -A3 '^  temporal-data:' "$file" | grep -q 'internal: true'
          grep -A3 '^  n8n-data:' "$file" | grep -q 'internal: true'

      - name: Verify secret template contract
        shell: bash
        run: |
          set -euo pipefail
          file=deploy/ai-workers/.env.example
          for key in \
            TEMPORAL_POSTGRES_PASSWORD \
            N8N_POSTGRES_PASSWORD \
            N8N_ENCRYPTION_KEY \
            OPENHANDS_LOCAL_BACKEND_API_KEY \
            AI_CORE_SCOPED_AGENT_TOKEN \
            AI_CORE_TEMPORAL_CODING_TOKEN \
            OPENCLAW_GATEWAY_TOKEN
          do
            grep -q "^$key=$" "$file"
          done

          grep -q '^TEMPORAL_ADMINTOOLS_VERSION=1.32.0$' "$file"
          grep -q '^TEMPORAL_CODING_WORKER_VERSION=1.0.0$' "$file"
          ! grep -Eq '^(OPENAI_API_KEY|GEMINI_API_KEY|ANTHROPIC_API_KEY)=.+$' "$file"

      - name: Summary
        run: |
          echo "AI worker stack static verification: PASS"
          echo "Current Temporal server/admin-tools manifests: PASS"
          echo "Compose interpolation: PASS"
          echo "Loopback-only published ports: PASS"
          echo "No Docker socket mount: PASS"
          echo "No AI Core ADMIN_API_KEY injection: PASS"
