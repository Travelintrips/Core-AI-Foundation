name: GPT02 DEV Native Readiness Proof
on:
  pull_request:
    paths:
      - 'scripts/windows/ai-core/dev_gpt02_readiness_proof.py'
      - 'scripts/windows/ai-core/test_dev_gpt02_readiness_proof.py'
      - '.github/workflows/gpt02-dev-native-readiness-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile scripts/windows/ai-core/dev_gpt02_readiness_proof.py
      - run: python -m unittest discover -s scripts/windows/ai-core -p test_dev_gpt02_readiness_proof.py -v
