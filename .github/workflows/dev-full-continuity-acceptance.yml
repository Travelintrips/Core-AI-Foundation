name: DEV Full Continuity Acceptance Contract
on:
  pull_request:
    branches: [develop]
    paths:
      - 'deploy/ai-workers/dev-full-continuity-acceptance*.mjs'
      - '.github/workflows/dev-full-continuity-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed acceptance regression
        run: node --test deploy/ai-workers/dev-full-continuity-acceptance.test.mjs
      - name: Identify scope truthfully
        run: |
          echo 'ACCEPTANCE_CONTRACT_TEST=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'LIVE_DEV_FULL_E2E=NOT_TESTED' >> "$GITHUB_STEP_SUMMARY"
