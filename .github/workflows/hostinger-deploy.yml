name: Hostinger Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - ai-platform
          - customer-portal
          - api

permissions:
  contents: read

jobs:
  deploy:
    name: Prepare Hostinger deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: core-ai-foundation-build

      - name: Validate deployment target
        run: |
          echo "Target: ${{ inputs.target }}"
          test -d . || exit 1

      - name: Prepare frontend deployment packages
        if: inputs.target == 'all' || inputs.target == 'ai-platform' || inputs.target == 'customer-portal'
        run: |
          echo "Frontend deployment adapter ready"
          find . -maxdepth 5 -type d | sort

      - name: Prepare API deployment package
        if: inputs.target == 'all' || inputs.target == 'api'
        run: |
          echo "API deployment adapter ready"
          find . -maxdepth 5 -type d | sort

      - name: Transport configuration check
        run: |
          if [ -z "${{ secrets.HOSTINGER_DEPLOY_METHOD }}" ]; then
            echo "Hostinger transport is not configured yet."
            echo "Add HOSTINGER_DEPLOY_METHOD and required deployment secrets before enabling upload."
          else
            echo "Hostinger transport configured: ${{ secrets.HOSTINGER_DEPLOY_METHOD }}"
          fi
