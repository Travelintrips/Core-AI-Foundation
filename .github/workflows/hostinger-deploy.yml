name: Hostinger Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - ai-platform
          - customer-portal
          - api
      method:
        description: Hostinger transport method
        required: true
        default: check
        type: choice
        options:
          - check
          - sftp
          - git

permissions:
  contents: read

jobs:
  deploy:
    name: Prepare Hostinger deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: core-ai-foundation-build

      - name: Validate deployment target
        run: |
          echo "Target: ${{ inputs.target }}"
          test -d . || exit 1

      - name: Prepare deployment packages
        run: |
          echo "Preparing deployment packages"
          find . -maxdepth 5 -type d | sort

      - name: Transport configuration guard
        run: |
          echo "Selected method: ${{ inputs.method }}"
          if [ "${{ inputs.method }}" = "check" ]; then
            echo "Transport validation only. Upload disabled."
            exit 0
          fi
          if [ "${{ inputs.method }}" = "sftp" ]; then
            test -n "${{ secrets.HOSTINGER_SFTP_HOST }}" || exit 1
            test -n "${{ secrets.HOSTINGER_SFTP_USERNAME }}" || exit 1
            test -n "${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}" || exit 1
          fi

      - name: SFTP deploy artifact upload
        if: inputs.method == 'sftp'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          key: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
          source: "./"
          target: ${{ secrets.HOSTINGER_DEPLOY_PATH }}

      - name: Git deploy placeholder
        if: inputs.method == 'git'
        run: |
          echo "Hostinger Git transport selected"
          echo "Waiting for Hostinger Git deployment configuration"

      - name: Deployment health check placeholder
        run: |
          echo "Health check stage ready after transport configuration"
