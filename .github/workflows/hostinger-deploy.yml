          const target = models.find((m) => m.modelId === "gemini-3.8-flash" && m.isActive === true);
          if (!target) throw new Error("Active gemini-3.8-flash is not registered");
          console.log("gemini_primary_registered=PASS id="+target.id);
          NODE

          payload='{"message":"Reply with exactly AI_CORE_CLOUD_OK","mode":"ask","modelPolicy":"cloud"}'
          smoke_code=""
          for attempt in $(seq 1 4); do
            rm -f /tmp/ai-core-cloud-smoke
            smoke_code=$(curl --http1.1 -L -sS \
              -o /tmp/ai-core-cloud-smoke -w "%{http_code}" \
              --connect-timeout 15 --max-time 75 \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              -d "$payload" \
              "$API_BASE_URL/ai/core-chat/messages" || true)
            echo "ai_core_cloud_smoke_attempt=$attempt/4 http=${smoke_code:-curl-error}"

            if [ "$smoke_code" = "200" ]; then
              break
            fi

            if [[ "$smoke_code" = "500" || "$smoke_code" = "502" || "$smoke_code" = "503" || "$smoke_code" = "504" || "$smoke_code" = "000" ]]; then
              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 5))
                continue
              fi
            fi

            echo "::error::AI Core cloud routing smoke failed with HTTP ${smoke_code:-curl-error}"
            cat /tmp/ai-core-cloud-smoke 2>/dev/null || true
            exit 1
          done
          test "$smoke_code" = "200"

          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-cloud-smoke", "utf8"));
          if (!["CLOUD","CLOUD_FALLBACK"].includes(value.route)) {
            throw new Error("Expected CLOUD or CLOUD_FALLBACK route, got "+String(value.route));
          }
          if (typeof value.provider !== "string" || !value.provider) {
            throw new Error("Cloud smoke returned no provider");
          }
          if (["ollama","zerollm"].includes(value.provider)) {
            throw new Error("Cloud policy must not fall back to local provider");
          }
          if (typeof value.reply !== "string" || value.reply.trim().length === 0) {
            throw new Error("Cloud routing returned no reply text");
          }
          console.log(
            "ai_core_cloud_routing=PASS route="+value.route+
            " provider="+value.provider+
            " model="+String(value.model ?? "unknown")+
            " totalTokens="+String(value.usage?.totalTokens ?? "unknown")
          );
          NODE



  verify_zerollm:
    name: Smoke ZeroLLM readiness
    needs: [plan, baseline]
    if: >-
      needs.baseline.result == 'success' &&
      needs.plan.outputs.verify_zerollm == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}

    steps:
      - name: Inspect ZeroLLM host readiness
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/zerollm/readiness" > /tmp/zerollm-readiness
          cat /tmp/zerollm-readiness
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/zerollm-readiness","utf8")); if(v.provider!=="zerollm"||v.loopbackOnly!==true) throw new Error("Invalid ZeroLLM readiness payload");'



  verify_sitemap:
    name: Smoke public sitemap
    needs: [plan, baseline]
    if: >-
      needs.baseline.result == 'success' &&
      needs.plan.outputs.verify_sitemap == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
      PUBLIC_SITEMAP_URL: https://aifront.cstlogistic.co.id/sitemap.xml
      LEGACY_SITEMAP_URL: https://aicore.cstlogistic.co.id/sitemap.xml

    steps:
      - name: Verify public sitemap for Googlebot
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -sS -D /tmp/sitemap-headers -o /tmp/sitemap-body -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "User-Agent: Googlebot" \
            "$PUBLIC_SITEMAP_URL")
          content_type=$(awk -F': ' 'tolower($1)=="content-type" {gsub("\r","",$2); print tolower($2)}' /tmp/sitemap-headers | tail -n1)
          echo "public_sitemap_http=$code content_type=${content_type:-missing}"
          test "$code" = "200"
          case "$content_type" in
            application/xml*|text/xml*) ;;
            *)
              echo "Unexpected sitemap Content-Type: ${content_type:-missing}"
              cat /tmp/sitemap-headers
              exit 1
              ;;
          esac
          grep -q '<urlset' /tmp/sitemap-body
          grep -q '<loc>https://aifront.cstlogistic.co.id/' /tmp/sitemap-body
          if grep -q 'https://aicore.cstlogistic.co.id/' /tmp/sitemap-body; then
            echo "Public sitemap still contains retired aicore URLs"
            exit 1
          fi

          legacy_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -sS -D /tmp/legacy-sitemap-headers -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "User-Agent: Googlebot" \
            "$LEGACY_SITEMAP_URL")
          legacy_location=$(awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' /tmp/legacy-sitemap-headers | tail -n1)
          echo "legacy_sitemap_http=$legacy_code location=${legacy_location:-missing}"
          test "$legacy_code" = "301"
          test "$legacy_location" = "$PUBLIC_SITEMAP_URL"



  finalize:
    name: Finalize production verification
    needs:
      - plan
      - baseline
      - verify_mcp
      - verify_coding
      - verify_chat
      - verify_whatsapp
      - verify_data
      - verify_ollama
      - verify_cloud
      - verify_zerollm
      - verify_sitemap
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.stale != 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}

    steps:
      - name: Aggregate parallel smoke results
        id: aggregate
        shell: bash
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          MCP_RESULT: ${{ needs.verify_mcp.result }}
          CODING_RESULT: ${{ needs.verify_coding.result }}
          CHAT_RESULT: ${{ needs.verify_chat.result }}
          WHATSAPP_RESULT: ${{ needs.verify_whatsapp.result }}
          DATA_RESULT: ${{ needs.verify_data.result }}
          OLLAMA_RESULT: ${{ needs.verify_ollama.result }}
          CLOUD_RESULT: ${{ needs.verify_cloud.result }}
          ZEROLLM_RESULT: ${{ needs.verify_zerollm.result }}
          SITEMAP_RESULT: ${{ needs.verify_sitemap.result }}
        run: |
          set -euo pipefail
          ok=true
          for pair in             "baseline=$BASELINE_RESULT"             "mcp=$MCP_RESULT"             "coding=$CODING_RESULT"             "chat=$CHAT_RESULT"             "whatsapp=$WHATSAPP_RESULT"             "data=$DATA_RESULT"             "ollama=$OLLAMA_RESULT"             "cloud=$CLOUD_RESULT"             "zerollm=$ZEROLLM_RESULT"             "sitemap=$SITEMAP_RESULT"
          do
            name=${pair%%=*}
            result=${pair#*=}
            echo "parallel_result $name=$result"
            case "$result" in
              success|skipped) ;;
              *) ok=false ;;
            esac
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Skip GCP Ollama cold-start for unrelated deploys
        if: needs.plan.outputs.verify_ollama != 'true'
        shell: bash
        run: |
          echo "::notice::Skipping GCP Ollama/Economy smoke because this deploy does not touch Ollama-sensitive paths."
          echo "ollama_economy=SKIPPED reason=${{ needs.plan.outputs.ollama_reason }}"

      - name: Report Hostinger verification failure
        if: steps.aggregate.outputs.ok != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set +e
          payload=$(node -e 'console.log(JSON.stringify({
            source:"hostinger",
            kind:"production_verification_failed",
            title:"Hostinger production verification failed",
            summary:"GitHub Actions Hostinger Production Verify failed for expected commit "+process.env.EXPECTED_SHA,
            severity:"critical",
            riskClass:"GUARDED",
            repository:"Travelintrips/Core-AI-Foundation",
            branch:"main",
            headSha:process.env.EXPECTED_SHA,
            environment:"production",
            fingerprint:"hostinger:production:"+process.env.EXPECTED_SHA,
            metadata:{workflow:"Hostinger Production Verify",runId:process.env.GITHUB_RUN_ID}
          }))')
          curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d "$payload" \
            "$API_BASE_URL/ai/incidents" || true

      - name: Resolve superseded Hostinger verification incidents
        if: steps.aggregate.outputs.ok == 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          payload=$(node -e 'console.log(JSON.stringify({
            source:"hostinger",
            kind:"production_verification_failed",
            environment:"production",
            successfulHeadSha:process.env.EXPECTED_SHA,
            successfulRunId:process.env.GITHUB_RUN_ID
          }))')
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -sS             -o /tmp/incident-resolve -w "%{http_code}"             --connect-timeout 15 --max-time 30             -H "Content-Type: application/json"             -H "x-admin-api-key: $ADMIN_API_KEY"             -d "$payload"             "$API_BASE_URL/ai/incidents/resolve-superseded")
          echo "incident_resolve_http=$code"
          cat /tmp/incident-resolve
          echo
          test "$code" = "200"
          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/incident-resolve", "utf8"));
          if (value.ok !== true) throw new Error("Incident auto-resolve did not report ok=true");
          if (!Number.isInteger(value.resolved) || value.resolved < 0) {
            throw new Error("Incident auto-resolve returned an invalid resolved count");
          }
          if (!Number.isInteger(value.activeRepairTasksSkipped) || value.activeRepairTasksSkipped < 0) {
            throw new Error("Incident auto-resolve returned an invalid activeRepairTasksSkipped count");
          }
          console.log(
            "incident_auto_resolve=PASS resolved="+value.resolved+
            " repairTasksCompleted="+String(value.repairTasksCompleted ?? 0)+
            " activeRepairTasksSkipped="+value.activeRepairTasksSkipped
          );
          NODE

      - name: Verification summary
        if: steps.aggregate.outputs.ok == 'true'
        shell: bash
        env:
          VERIFY_MCP: ${{ needs.plan.outputs.verify_mcp }}
          VERIFY_CODING: ${{ needs.plan.outputs.verify_coding }}
          VERIFY_CHAT: ${{ needs.plan.outputs.verify_chat }}
          VERIFY_WHATSAPP: ${{ needs.plan.outputs.verify_whatsapp }}
          WHATSAPP_REASON: ${{ needs.plan.outputs.whatsapp_reason }}
          VERIFY_DATA: ${{ needs.plan.outputs.verify_data }}
          VERIFY_OLLAMA: ${{ needs.plan.outputs.verify_ollama }}
          OLLAMA_REASON: ${{ needs.plan.outputs.ollama_reason }}
          VERIFY_CLOUD: ${{ needs.plan.outputs.verify_cloud }}
          VERIFY_ZEROLLM: ${{ needs.plan.outputs.verify_zerollm }}
          VERIFY_SITEMAP: ${{ needs.plan.outputs.verify_sitemap }}
          SCOPE_REASON: ${{ needs.plan.outputs.scope_reason }}
        run: |
          echo "Production commit verified: $EXPECTED_SHA"
          echo "Baseline exact-SHA/readiness/auth/SMTP: PASS"
          echo "Verification scope reason: $SCOPE_REASON"
          echo "MCP: $([ "$VERIFY_MCP" = "true" ] && echo PASS || echo SKIPPED)"
          echo "Coding Workspace + GitHub discovery: $([ "$VERIFY_CODING" = "true" ] && echo PASS || echo SKIPPED)"
          echo "Deterministic AI Core Chat: $([ "$VERIFY_CHAT" = "true" ] && echo PASS || echo SKIPPED)"
          echo "WhatsApp E2E: $([ "$VERIFY_WHATSAPP" = "true" ] && echo "PASS ($WHATSAPP_REASON)" || echo "SKIPPED ($WHATSAPP_REASON)")"
          echo "Data Tool + schema-aware DB queries: $([ "$VERIFY_DATA" = "true" ] && echo PASS || echo SKIPPED)"
          echo "Cloud routing: $([ "$VERIFY_CLOUD" = "true" ] && echo PASS || echo SKIPPED)"
          echo "ZeroLLM readiness: $([ "$VERIFY_ZEROLLM" = "true" ] && echo PASS || echo SKIPPED)"
          echo "Sitemap: $([ "$VERIFY_SITEMAP" = "true" ] && echo PASS || echo SKIPPED)"
          if [ "$VERIFY_OLLAMA" = "true" ]; then
            echo "GCP Ollama worker + Economy routing: PASS"
          else
            echo "GCP Ollama worker + Economy routing: SKIPPED ($OLLAMA_REASON)"
          fi
          echo "Parallel production verification: PASS"

      - name: Fail final gate when any parallel smoke failed
        if: steps.aggregate.outputs.ok != 'true'
        shell: bash
        run: |
          echo "::error::One or more parallel production smoke jobs failed or were cancelled."
          exit 1
