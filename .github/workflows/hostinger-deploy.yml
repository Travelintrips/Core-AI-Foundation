name: Hostinger Production Verify

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI Verify
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hostinger-production-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Hostinger native deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
      PUBLIC_SITEMAP_URL: https://aifront.cstlogistic.co.id/sitemap.xml
      LEGACY_SITEMAP_URL: https://aicore.cstlogistic.co.id/sitemap.xml

    steps:
      - uses: actions/checkout@v7

      - name: Wait for stable exact production commit
        shell: bash
        run: bash scripts/hostinger-production-probe.sh

      - name: Verify readiness
        shell: bash
        run: |
          set -euo pipefail

          # Hostinger starts accepting traffic before all sequential runtime
          # initializers have necessarily finished. Keep readiness strict, but
          # allow the autonomous runtime a bounded startup grace period.
          max_attempts=12
          for attempt in $(seq 1 "$max_attempts"); do
            code=$(curl --http1.1 --retry 2 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 30 -L --silent --show-error \
              -o /tmp/full -w "%{http_code}" "$API_BASE_URL/healthz/full" || true)

            echo "readiness_attempt=$attempt/$max_attempts http=$code"
            cat /tmp/full 2>/dev/null || true
            echo

            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/full; then
              echo "readiness=PASS"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Readiness did not become healthy within the bounded startup grace period."
              exit 1
            fi

            sleep 10
          done

      - name: Verify admin auth guard
        shell: bash
        run: |
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o /tmp/tasks -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 "$API_BASE_URL/ai/coding/tasks")
          echo "coding_tasks_unauthenticated_http=$code"
          test "$code" = "401"

      - name: Verify authenticated Coding Workspace
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o /tmp/tasks-auth -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/tasks")
          echo "coding_tasks_authenticated_http=$code"
          test "$code" = "200"
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/tasks-auth","utf8")); if(!Array.isArray(v)) throw new Error("Expected coding tasks array"); console.log("coding_tasks_authenticated_payload=array");'

      - name: Verify deterministic AI Core Chat smoke
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          smoke_chat() {
            local message="$1"
            local output="$2"
            local payload
            payload=$(node -e 'console.log(JSON.stringify({message:process.argv[1],mode:"ask",modelPolicy:"smart"}))' "$message")
            code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o "$output" -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -H "Content-Type: application/json" \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              -d "$payload" \
              "$API_BASE_URL/ai/core-chat/messages")
            echo "ai_core_chat_smoke_http=$code message=$message"
            cat "$output"
            test "$code" = "200"
            node - "$output" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const value = JSON.parse(fs.readFileSync(path, "utf8"));
          if (value.kind !== "answer") throw new Error("Expected answer response");
          if (value.route !== "NO_LLM") throw new Error("Expected NO_LLM deterministic route");
          if (value.usage?.totalTokens !== 0) throw new Error("Deterministic smoke must use 0 tokens");
          if (value.estimatedCostUsd !== 0) throw new Error("Deterministic smoke must cost 0 USD");
          if (value.workload !== "DETERMINISTIC") throw new Error("Expected DETERMINISTIC workload");
          if (value.costClass !== "ZERO") throw new Error("Expected ZERO cost class");
          NODE
          }

          smoke_chat "hello" /tmp/ai-core-chat-hello
          smoke_chat "/routing" /tmp/ai-core-chat-routing

          stream_payload='{"message":"hello","mode":"ask","modelPolicy":"smart"}'
          stream_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -N -sS \
            -o /tmp/ai-core-chat-stream -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d "$stream_payload" \
            "$API_BASE_URL/ai/core-chat/messages/stream")
          echo "ai_core_chat_stream_smoke_http=$stream_code"
          cat /tmp/ai-core-chat-stream
          test "$stream_code" = "200"
          grep -q '^event: meta' /tmp/ai-core-chat-stream
          grep -q '^event: delta' /tmp/ai-core-chat-stream
          grep -q '^event: done' /tmp/ai-core-chat-stream
          node - <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("/tmp/ai-core-chat-stream", "utf8").replace(/\r/g, "");
          const blocks = raw.split("\n\n").filter(Boolean);
          const events = blocks.map((block) => {
            const lines = block.split("\n");
            const event = lines.find((line) => line.startsWith("event:"))?.slice(6).trim();
            const data = lines.filter((line) => line.startsWith("data:")).map((line) => line.slice(5).trimStart()).join("\n");
            return { event, data: data ? JSON.parse(data) : null };
          });
          const meta = events.find((item) => item.event === "meta")?.data;
          const delta = events.find((item) => item.event === "delta")?.data;
          const done = events.find((item) => item.event === "done")?.data;
          if (meta?.route !== "NO_LLM") throw new Error("Expected streamed deterministic NO_LLM route");
          if (typeof delta?.text !== "string" || !delta.text.includes("Halo")) throw new Error("Expected streamed greeting delta");
          if (done?.usage?.totalTokens !== 0) throw new Error("Streamed deterministic smoke must use 0 tokens");
          if (done?.estimatedCostUsd !== 0) throw new Error("Streamed deterministic smoke must cost 0 USD");
          console.log("ai_core_chat_stream_smoke=PASS");
          NODE

      - name: Verify Gemini production inference
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS             -o /tmp/ai-models -w "%{http_code}"             --connect-timeout 15 --max-time 30             -H "x-admin-api-key: $ADMIN_API_KEY"             "$API_BASE_URL/ai/models")
          echo "ai_models_http=$code"
          test "$code" = "200"

          model_id=$(node - <<'NODE'
          const fs = require("fs");
          const models = JSON.parse(fs.readFileSync("/tmp/ai-models", "utf8"));
          const target = models.find((m) => m.modelId === "gemini-3.8-flash" && m.isActive === true);
          if (!target) throw new Error("Active gemini-3.8-flash is not registered");
          process.stdout.write(String(target.id));
          NODE
          )

          smoke_code=""
          for attempt in $(seq 1 6); do
            rm -f /tmp/gemini-model-smoke
            smoke_code=$(curl --http1.1 -L -sS               -o /tmp/gemini-model-smoke -w "%{http_code}"               --connect-timeout 15 --max-time 45               -X POST               -H "Content-Type: application/json"               -H "x-admin-api-key: $ADMIN_API_KEY"               "$API_BASE_URL/ai/models/$model_id/smoke-test" || true)
            echo "gemini_model_smoke_attempt=$attempt/6 http=${smoke_code:-curl-error}"

            if [ "$smoke_code" = "200" ]; then
              break
            fi

            if [[ "$smoke_code" = "502" || "$smoke_code" = "503" || "$smoke_code" = "504" || "$smoke_code" = "000" ]]; then
              if [ "$attempt" -lt 6 ]; then
                sleep $((attempt * 5))
                continue
              fi
            fi

            echo "::error::Gemini production inference failed with HTTP ${smoke_code:-curl-error}"
            cat /tmp/gemini-model-smoke 2>/dev/null || true
            exit 1
          done
          test "$smoke_code" = "200"

          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/gemini-model-smoke", "utf8"));
          if (value.ok !== true) throw new Error("Gemini smoke did not return ok=true");
          if (value.provider !== "google") throw new Error("Expected google provider");
          if (value.model !== "gemini-3.8-flash") throw new Error("Unexpected Gemini model");
          if (value.outputReceived !== true) throw new Error("Gemini returned no text");
          if (!Number.isFinite(value.latencyMs) || value.latencyMs < 0) throw new Error("Invalid Gemini latency");
          console.log("gemini_model_smoke=PASS model="+value.model+" latencyMs="+value.latencyMs+" totalTokens="+(value.usage?.totalTokens ?? "unknown"));
          NODE

      - name: Verify AI Core Data Tool schema readiness
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS \
            -o /tmp/ai-core-data-tools-readiness -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/core-chat/data-tools/readiness")
          echo "ai_core_data_tools_readiness_http=$code"
          test "$code" = "200"
          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-data-tools-readiness", "utf8"));
          if (value.status !== "ok") {
            throw new Error("AI Core Data Tool schema readiness is degraded: " + JSON.stringify(value));
          }
          if (value.tools?.sportCenterBookingLookup?.ready !== true) {
            throw new Error("Sport Center booking Data Tool is not ready");
          }
          if (value.tools?.tenantOutstandingSummary?.ready !== true) {
            throw new Error("Tenant outstanding Data Tool is not ready");
          }
          console.log("ai_core_data_tools_readiness=PASS");
          NODE

      - name: Verify AI Core Data Tool execution
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          payload='{"message":"cek booking SC-0992","mode":"ask","modelPolicy":"smart"}'
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS \
            -o /tmp/ai-core-data-tool-execution -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Content-Type: application/json" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d "$payload" \
            "$API_BASE_URL/ai/core-chat/messages")
          echo "ai_core_data_tool_execution_http=$code"
          test "$code" = "200"

          # Do not print the response: it may contain customer/business data.
          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-data-tool-execution", "utf8"));
          if (value.route !== "DATA_TOOL") throw new Error("Expected DATA_TOOL route");
          if (value.dataTool !== "SPORT_CENTER_BOOKING_LOOKUP") throw new Error("Expected Sport Center booking tool");
          if (value.usage?.totalTokens !== 0) throw new Error("Data Tool execution must use 0 tokens");
          if (value.estimatedCostUsd !== 0) throw new Error("Data Tool execution must cost 0 USD");
          if (value.data?.failed === true) throw new Error("Sport Center Data Tool query failed");
          if (value.data?.found !== true) throw new Error("Expected production smoke booking SC-0992 to exist");
          console.log("ai_core_data_tool_execution=PASS");
          NODE

      - name: Inspect ZeroLLM host readiness
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/zerollm/readiness" > /tmp/zerollm-readiness
          cat /tmp/zerollm-readiness
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/zerollm-readiness","utf8")); if(v.provider!=="zerollm"||v.loopbackOnly!==true) throw new Error("Invalid ZeroLLM readiness payload");'

      - name: Verify Coding Workspace GitHub repository discovery
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o /tmp/github-repositories -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/github/repositories?q=Core-AI-Foundation")
          echo "github_repository_discovery_http=$code"
          test "$code" = "200"
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/github-repositories","utf8")); if(!Array.isArray(v.repositories)) throw new Error("Expected repositories array"); if(!v.repositories.some(r=>r.fullName==="Travelintrips/Core-AI-Foundation")) throw new Error("Core-AI-Foundation not returned by GitHub discovery"); console.log("github_repository_discovery=PASS count="+v.repositories.length);'

      - name: Verify public sitemap for Googlebot
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -sS -D /tmp/sitemap-headers -o /tmp/sitemap-body -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "User-Agent: Googlebot" \
            "$PUBLIC_SITEMAP_URL")
          content_type=$(awk -F': ' 'tolower($1)=="content-type" {gsub("\r","",$2); print tolower($2)}' /tmp/sitemap-headers | tail -n1)
          echo "public_sitemap_http=$code content_type=${content_type:-missing}"
          test "$code" = "200"
          case "$content_type" in
            application/xml*|text/xml*) ;;
            *)
              echo "Unexpected sitemap Content-Type: ${content_type:-missing}"
              cat /tmp/sitemap-headers
              exit 1
              ;;
          esac
          grep -q '<urlset' /tmp/sitemap-body
          grep -q '<loc>https://aifront.cstlogistic.co.id/' /tmp/sitemap-body
          if grep -q 'https://aicore.cstlogistic.co.id/' /tmp/sitemap-body; then
            echo "Public sitemap still contains retired aicore URLs"
            exit 1
          fi

          legacy_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -sS -D /tmp/legacy-sitemap-headers -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "User-Agent: Googlebot" \
            "$LEGACY_SITEMAP_URL")
          legacy_location=$(awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' /tmp/legacy-sitemap-headers | tail -n1)
          echo "legacy_sitemap_http=$legacy_code location=${legacy_location:-missing}"
          test "$legacy_code" = "301"
          test "$legacy_location" = "$PUBLIC_SITEMAP_URL"

      - name: Report Hostinger verification failure
        if: failure()
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set +e
          payload=$(node -e 'console.log(JSON.stringify({
            source:"hostinger",
            kind:"production_verification_failed",
            title:"Hostinger production verification failed",
            summary:"GitHub Actions Hostinger Production Verify failed for expected commit "+process.env.EXPECTED_SHA,
            severity:"critical",
            riskClass:"GUARDED",
            repository:"Travelintrips/Core-AI-Foundation",
            branch:"main",
            headSha:process.env.EXPECTED_SHA,
            environment:"production",
            fingerprint:"hostinger:production:"+process.env.EXPECTED_SHA,
            metadata:{workflow:"Hostinger Production Verify",runId:process.env.GITHUB_RUN_ID}
          }))')
          curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d "$payload" \
            "$API_BASE_URL/ai/incidents" || true

      - name: Verification summary
        run: |
          echo "Production commit verified: $EXPECTED_SHA"
          echo "Health/readiness: PASS"
          echo "Admin auth guard: PASS"
          echo "Authenticated Coding Workspace smoke: PASS"
          echo "Public sitemap Googlebot fetch: PASS"
