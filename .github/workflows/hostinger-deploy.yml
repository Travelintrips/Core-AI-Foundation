# Hostinger native Git deployment trigger marker
name: Hostinger Production Verify

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI Verify
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hostinger-production-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Hostinger native deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
      PUBLIC_SITEMAP_URL: https://aifront.cstlogistic.co.id/sitemap.xml
      LEGACY_SITEMAP_URL: https://aicore.cstlogistic.co.id/sitemap.xml

    steps:
      - uses: actions/checkout@v7

      - name: Resolve production verification target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "latest_main_sha=$latest_main_sha"
          echo "latest_main_sha=$latest_main_sha" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA"

          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$EXPECTED_SHA" != "$latest_main_sha" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale production verification trigger. expected_sha=$EXPECTED_SHA latest_main_sha=$latest_main_sha"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for stable exact production commit
        if: steps.target.outputs.stale != 'true'
        shell: bash
        run: bash scripts/hostinger-production-probe.sh

      - name: Verify readiness
        if: steps.target.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Hostinger starts accepting traffic before all sequential runtime
          # initializers have necessarily finished. Keep readiness strict, but
          # allow the autonomous runtime a bounded startup grace period.
          max_attempts=12
          for attempt in $(seq 1 "$max_attempts"); do
            code=$(curl --http1.1 --retry 2 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 30 -L --silent --show-error \
              -o /tmp/full -w "%{http_code}" "$API_BASE_URL/healthz/full" || true)

            echo "readiness_attempt=$attempt/$max_attempts http=$code"
            cat /tmp/full 2>/dev/null || true
            echo

            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/full; then
              echo "readiness=PASS"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Readiness did not become healthy within the bounded startup grace period."
              exit 1
            fi

            sleep 10
          done

      - name: Verify admin auth guard
        if: steps.target.outputs.stale != 'true'
        shell: bash
        run: |
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o /tmp/tasks -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 "$API_BASE_URL/ai/coding/tasks")
          echo "coding_tasks_unauthenticated_http=$code"
          test "$code" = "401"

      - name: Verify SMTP transport for login email
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS             -o /tmp/email-diagnostic -w "%{http_code}"             --connect-timeout 15 --max-time 30             -H "x-admin-api-key: $ADMIN_API_KEY"             "$API_BASE_URL/internal/auth/email-diagnostics")
          echo "email_diagnostics_http=$code"
          cat /tmp/email-diagnostic
          test "$code" = "200"
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/email-diagnostic","utf8")); if(v.ok!==true || v.category!=="OK") throw new Error("SMTP transport is not healthy"); console.log("smtp_transport=PASS");'

      - name: Verify authenticated Coding Workspace
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o /tmp/tasks-auth -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/tasks")
          echo "coding_tasks_authenticated_http=$code"
          test "$code" = "200"
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/tasks-auth","utf8")); if(!Array.isArray(v)) throw new Error("Expected coding tasks array"); console.log("coding_tasks_authenticated_payload=array");'

      - name: Verify deterministic AI Core Chat smoke
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          smoke_chat() {
            local message="$1"
            local output="$2"
            local payload
            payload=$(node -e 'console.log(JSON.stringify({message:process.argv[1],mode:"ask",modelPolicy:"smart"}))' "$message")
            code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o "$output" -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -H "Content-Type: application/json" \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              -d "$payload" \
              "$API_BASE_URL/ai/core-chat/messages")
            echo "ai_core_chat_smoke_http=$code message=$message"
            cat "$output"
            test "$code" = "200"
            node - "$output" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const value = JSON.parse(fs.readFileSync(path, "utf8"));
          if (value.kind !== "answer") throw new Error("Expected answer response");
          if (value.route !== "NO_LLM") throw new Error("Expected NO_LLM deterministic route");
          if (value.usage?.totalTokens !== 0) throw new Error("Deterministic smoke must use 0 tokens");
          if (value.estimatedCostUsd !== 0) throw new Error("Deterministic smoke must cost 0 USD");
          if (value.workload !== "DETERMINISTIC") throw new Error("Expected DETERMINISTIC workload");
          if (value.costClass !== "ZERO") throw new Error("Expected ZERO cost class");
          NODE
          }

          smoke_chat "hello" /tmp/ai-core-chat-hello
          smoke_chat "/routing" /tmp/ai-core-chat-routing

          stream_payload='{"message":"hello","mode":"ask","modelPolicy":"smart"}'
          stream_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -N -sS \
            -o /tmp/ai-core-chat-stream -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d "$stream_payload" \
            "$API_BASE_URL/ai/core-chat/messages/stream")
          echo "ai_core_chat_stream_smoke_http=$stream_code"
          cat /tmp/ai-core-chat-stream
          test "$stream_code" = "200"
          grep -q '^event: meta' /tmp/ai-core-chat-stream
          grep -q '^event: delta' /tmp/ai-core-chat-stream
          grep -q '^event: done' /tmp/ai-core-chat-stream
          node - <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("/tmp/ai-core-chat-stream", "utf8").replace(/\r/g, "");
          const blocks = raw.split("\n\n").filter(Boolean);
          const events = blocks.map((block) => {
            const lines = block.split("\n");
            const event = lines.find((line) => line.startsWith("event:"))?.slice(6).trim();
            const data = lines.filter((line) => line.startsWith("data:")).map((line) => line.slice(5).trimStart()).join("\n");
            return { event, data: data ? JSON.parse(data) : null };
          });
          const meta = events.find((item) => item.event === "meta")?.data;
          const delta = events.find((item) => item.event === "delta")?.data;
          const done = events.find((item) => item.event === "done")?.data;
          if (meta?.route !== "NO_LLM") throw new Error("Expected streamed deterministic NO_LLM route");
          if (typeof delta?.text !== "string" || !delta.text.includes("Halo")) throw new Error("Expected streamed greeting delta");
          if (done?.usage?.totalTokens !== 0) throw new Error("Streamed deterministic smoke must use 0 tokens");
          if (done?.estimatedCostUsd !== 0) throw new Error("Streamed deterministic smoke must cost 0 USD");
          console.log("ai_core_chat_stream_smoke=PASS");
          NODE

      - name: Verify AI Core WhatsApp general chat E2E
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          code=$(curl --http1.1 --retry 1 --retry-delay 2 --retry-all-errors -L -sS             -o /tmp/ai-core-wa-e2e -w "%{http_code}"             --connect-timeout 15 --max-time 120             -X POST             -H "Content-Type: application/json"             -H "x-admin-api-key: $ADMIN_API_KEY"             "$API_BASE_URL/ai/core-chat/whatsapp/e2e" || true)
          echo "ai_core_whatsapp_e2e_http=${code:-curl-error}"
          cat /tmp/ai-core-wa-e2e 2>/dev/null || true
          echo
          test "$code" = "200"

          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-wa-e2e", "utf8"));
          if (value.ok !== true) throw new Error("WhatsApp E2E did not report ok=true");
          if (value.mode !== "voice_note") throw new Error("WhatsApp E2E did not exercise voice-note mode");
          if (value.inputSource !== "whatsapp_voice") throw new Error("WhatsApp E2E did not reach WhatsApp voice input path");
          if (value.delivery?.status !== "sent") throw new Error("WhatsApp E2E delivery was not sent");
          if (value.webhookStatus !== 200) throw new Error("WhatsApp webhook did not return 200");
          if (typeof value.senderSuffix !== "string" || value.senderSuffix.length < 2) {
            throw new Error("WhatsApp E2E sender identity was not resolved");
          }
          console.log(
            "ai_core_whatsapp_e2e=PASS"+
            " mode="+String(value.mode ?? "unknown")+
            " inputSource="+String(value.inputSource ?? "unknown")+
            " route="+String(value.route ?? "unknown")+
            " delivery="+String(value.delivery?.status ?? "unknown")+
            " senderSuffix="+value.senderSuffix
          );
          NODE

      - name: Verify schema-aware AI Core Chat database queries
        if: steps.target.outputs.stale != 'true'
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: node scripts/ai-core-admin-db-smoke.mjs

      - name: Verify GCP Ollama worker and Economy routing
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          workers_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS             -o /tmp/ollama-workers -w "%{http_code}"             --connect-timeout 15 --max-time 30             -H "x-admin-api-key: $ADMIN_API_KEY"             "$API_BASE_URL/ai/cluster/workers")
          echo "ollama_worker_registry_http=$workers_code"
          test "$workers_code" = "200"

          node - <<'NODE'
          const fs = require("fs");
          const workers = JSON.parse(fs.readFileSync("/tmp/ollama-workers", "utf8"));
          if (!Array.isArray(workers)) throw new Error("Expected worker capacity array");
          const worker = workers.find((w) => w.workerName === "gcp-ollama-01");
          if (!worker) throw new Error("gcp-ollama-01 is not registered");
          if (!["online", "idle", "busy"].includes(String(worker.status).toLowerCase())) {
            throw new Error("gcp-ollama-01 is not online: " + String(worker.status));
          }
          if (worker.leaseValid !== true) throw new Error("gcp-ollama-01 lease is not valid");
          if (worker.providerSlug !== "ollama") throw new Error("Unexpected provider: " + String(worker.providerSlug));
          if (worker.modelId !== "qwen2.5-coder:7b") throw new Error("Unexpected model: " + String(worker.modelId));
          // gcp-ollama-01 is a durable outbound pull worker. AI Core queues
          // work for it and the worker invokes its loopback Ollama runtime;
          // a public Ollama endpoint is intentionally not required.
          if (worker.runtimeKind !== "ollama_remote_pull") {
            throw new Error("Unexpected Ollama runtime: " + String(worker.runtimeKind));
          }
          if (worker.endpointUrl != null && worker.endpointUrl !== "") {
            throw new Error("Remote pull Ollama worker must not expose an endpoint");
          }
          console.log(
            "gcp_ollama_worker=PASS status="+worker.status+
            " runningJobs="+String(worker.runningJobs)+
            " availableSlots="+String(worker.availableSlots)+
            " leaseValid="+String(worker.leaseValid)
          );
          NODE

          # A healthy remote pull worker can legitimately be saturated by production work.
          # Wait briefly for a free slot before exercising Economy routing so deployment
          # verification does not fail merely because all model slots are busy.
          capacity_ready=false
          for capacity_attempt in $(seq 1 10); do
            workers_code=$(curl --http1.1 -L -sS \
              -o /tmp/ollama-workers -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              "$API_BASE_URL/ai/cluster/workers" || true)
            if [ "$workers_code" = "200" ] && node - <<'NODE'
          const fs = require("fs");
          const workers = JSON.parse(fs.readFileSync("/tmp/ollama-workers", "utf8"));
          const worker = Array.isArray(workers)
            ? workers.find((w) => w.workerName === "gcp-ollama-01")
            : null;
          const ready =
            worker &&
            worker.leaseValid === true &&
            ["online", "idle", "busy"].includes(String(worker.status).toLowerCase()) &&
            Number(worker.availableSlots ?? 0) > 0;
          if (worker) {
            console.log(
              "ollama_capacity_wait status="+String(worker.status)+
              " runningJobs="+String(worker.runningJobs)+
              " availableSlots="+String(worker.availableSlots)
            );
          }
          process.exit(ready ? 0 : 1);
          NODE
            then
              capacity_ready=true
              break
            fi
            if [ "$capacity_attempt" -lt 10 ]; then sleep 10; fi
          done

          if [ "$capacity_ready" != "true" ]; then
            echo "::warning::gcp-ollama-01 is healthy but remained saturated; skipping Economy invocation smoke for this production verification."
            echo "ollama_economy=SKIPPED reason=worker_saturated"
          else
            payload='{"message":"Jawab tepat: GCP_OLLAMA_CI_OK","mode":"ask","modelPolicy":"economy"}'
            economy_ok=false
            for attempt in $(seq 1 3); do
            started=$(date +%s)
            code=$(curl --http1.1 -L -sS               -o /tmp/ai-core-ollama-smoke -w "%{http_code}"               --connect-timeout 15 --max-time 75               -H "Content-Type: application/json"               -H "x-admin-api-key: $ADMIN_API_KEY"               -d "$payload"               "$API_BASE_URL/ai/core-chat/messages" || true)
            elapsed=$(( $(date +%s) - started ))
            echo "ollama_economy_attempt=$attempt/3 http=${code:-curl-error} elapsed_s=$elapsed"

            if [ "$code" = "200" ] && node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-ollama-smoke", "utf8"));
          const ok =
            value.route === "LOCAL" &&
            value.provider === "ollama" &&
            value.model === "qwen2.5-coder:7b" &&
            value.reply?.trim() === "GCP_OLLAMA_CI_OK" &&
            value.estimatedCostUsd === 0;
          process.exit(ok ? 0 : 1);
          NODE
            then
              economy_ok=true
              break
            fi

              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done

            if [ "$economy_ok" != "true" ]; then
              echo "::error::GCP Ollama Economy routing smoke failed after capacity became available"
              cat /tmp/ai-core-ollama-smoke 2>/dev/null || true
              exit 1
            fi

            node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-ollama-smoke", "utf8"));
          console.log(
            "gcp_ollama_economy=PASS"+
            " route="+value.route+
            " provider="+value.provider+
            " model="+value.model+
            " latencyMs="+String(value.latencyMs ?? "unknown")+
            " totalTokens="+String(value.usage?.totalTokens ?? "unknown")+
            " estimatedCostUsd="+String(value.estimatedCostUsd)
          );
          NODE
          fi

      - name: Verify AI Core cloud routing
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS \
            -o /tmp/ai-models -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/models")
          echo "ai_models_http=$code"
          test "$code" = "200"

          node - <<'NODE'
          const fs = require("fs");
          const models = JSON.parse(fs.readFileSync("/tmp/ai-models", "utf8"));
          const target = models.find((m) => m.modelId === "gemini-3.8-flash" && m.isActive === true);
          if (!target) throw new Error("Active gemini-3.8-flash is not registered");
          console.log("gemini_primary_registered=PASS id="+target.id);
          NODE

          payload='{"message":"Reply with exactly AI_CORE_CLOUD_OK","mode":"ask","modelPolicy":"cloud"}'
          smoke_code=""
          for attempt in $(seq 1 4); do
            rm -f /tmp/ai-core-cloud-smoke
            smoke_code=$(curl --http1.1 -L -sS \
              -o /tmp/ai-core-cloud-smoke -w "%{http_code}" \
              --connect-timeout 15 --max-time 75 \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              -d "$payload" \
              "$API_BASE_URL/ai/core-chat/messages" || true)
            echo "ai_core_cloud_smoke_attempt=$attempt/4 http=${smoke_code:-curl-error}"

            if [ "$smoke_code" = "200" ]; then
              break
            fi

            if [[ "$smoke_code" = "500" || "$smoke_code" = "502" || "$smoke_code" = "503" || "$smoke_code" = "504" || "$smoke_code" = "000" ]]; then
              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 5))
                continue
              fi
            fi

            echo "::error::AI Core cloud routing smoke failed with HTTP ${smoke_code:-curl-error}"
            cat /tmp/ai-core-cloud-smoke 2>/dev/null || true
            exit 1
          done
          test "$smoke_code" = "200"

          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-cloud-smoke", "utf8"));
          if (!["CLOUD","CLOUD_FALLBACK"].includes(value.route)) {
            throw new Error("Expected CLOUD or CLOUD_FALLBACK route, got "+String(value.route));
          }
          if (typeof value.provider !== "string" || !value.provider) {
            throw new Error("Cloud smoke returned no provider");
          }
          if (["ollama","zerollm"].includes(value.provider)) {
            throw new Error("Cloud policy must not fall back to local provider");
          }
          if (typeof value.reply !== "string" || value.reply.trim().length === 0) {
            throw new Error("Cloud routing returned no reply text");
          }
          console.log(
            "ai_core_cloud_routing=PASS route="+value.route+
            " provider="+value.provider+
            " model="+String(value.model ?? "unknown")+
            " totalTokens="+String(value.usage?.totalTokens ?? "unknown")
          );
          NODE

      - name: Verify AI Core Data Tool schema readiness
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS \
            -o /tmp/ai-core-data-tools-readiness -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/core-chat/data-tools/readiness")
          echo "ai_core_data_tools_readiness_http=$code"
          test "$code" = "200"
          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-data-tools-readiness", "utf8"));
          if (value.status !== "ok") {
            throw new Error("AI Core Data Tool schema readiness is degraded: " + JSON.stringify(value));
          }
          if (value.tools?.sportCenterBookingLookup?.ready !== true) {
            throw new Error("Sport Center booking Data Tool is not ready");
          }
          if (value.tools?.tenantOutstandingSummary?.ready !== true) {
            throw new Error("Tenant outstanding Data Tool is not ready");
          }
          console.log("ai_core_data_tools_readiness=PASS");
          NODE

      - name: Verify AI Core Data Tool execution
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          payload='{"message":"cek booking SC-0992","mode":"ask","modelPolicy":"smart"}'
          data_tool_ok=false
          for attempt in $(seq 1 4); do
            code=$(curl --http1.1 -L -sS \
              -o /tmp/ai-core-data-tool-execution -w "%{http_code}" \
              --connect-timeout 15 --max-time 45 \
              -H "Content-Type: application/json" \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              -d "$payload" \
              "$API_BASE_URL/ai/core-chat/messages" || true)
            echo "ai_core_data_tool_execution_attempt=$attempt/4 http=${code:-curl-error}"

            if [ "$code" = "200" ] && node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-data-tool-execution", "utf8"));
          process.exit(value.data?.failed === true ? 1 : 0);
          NODE
            then
              data_tool_ok=true
              break
            fi

            # Print only the bounded server diagnostic, never booking/customer payload.
            if [ "$code" = "200" ]; then
              node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-data-tool-execution", "utf8"));
          const warning = typeof value.warning === "string"
            ? value.warning.replace(/[\\r\\n\\t]+/g, " ").slice(0, 500)
            : "no diagnostic returned";
          console.error("::warning::Sport Center Data Tool attempt failed: " + warning);
          NODE
            fi

            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
          done

          if [ "$data_tool_ok" != "true" ]; then
            echo "::error::Sport Center Data Tool query failed after bounded retries"
            exit 1
          fi

          # Do not print the response: it may contain customer/business data.
          node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-data-tool-execution", "utf8"));
          if (value.route !== "DATA_TOOL") throw new Error("Expected DATA_TOOL route");
          if (value.dataTool !== "SPORT_CENTER_BOOKING_LOOKUP") throw new Error("Expected Sport Center booking tool");
          if (value.usage?.totalTokens !== 0) throw new Error("Data Tool execution must use 0 tokens");
          if (value.estimatedCostUsd !== 0) throw new Error("Data Tool execution must cost 0 USD");
          if (value.data?.found !== true) throw new Error("Expected production smoke booking SC-0992 to exist");
          console.log("ai_core_data_tool_execution=PASS");
          NODE

      - name: Inspect ZeroLLM host readiness
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/zerollm/readiness" > /tmp/zerollm-readiness
          cat /tmp/zerollm-readiness
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/zerollm-readiness","utf8")); if(v.provider!=="zerollm"||v.loopbackOnly!==true) throw new Error("Invalid ZeroLLM readiness payload");'

      - name: Verify Coding Workspace GitHub repository discovery
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o /tmp/github-repositories -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/github/repositories?q=Core-AI-Foundation")
          echo "github_repository_discovery_http=$code"
          test "$code" = "200"
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/github-repositories","utf8")); if(!Array.isArray(v.repositories)) throw new Error("Expected repositories array"); if(!v.repositories.some(r=>r.fullName==="Travelintrips/Core-AI-Foundation")) throw new Error("Core-AI-Foundation not returned by GitHub discovery"); console.log("github_repository_discovery=PASS count="+v.repositories.length);'

      - name: Verify public sitemap for Googlebot
        if: steps.target.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -sS -D /tmp/sitemap-headers -o /tmp/sitemap-body -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "User-Agent: Googlebot" \
            "$PUBLIC_SITEMAP_URL")
          content_type=$(awk -F': ' 'tolower($1)=="content-type" {gsub("\r","",$2); print tolower($2)}' /tmp/sitemap-headers | tail -n1)
          echo "public_sitemap_http=$code content_type=${content_type:-missing}"
          test "$code" = "200"
          case "$content_type" in
            application/xml*|text/xml*) ;;
            *)
              echo "Unexpected sitemap Content-Type: ${content_type:-missing}"
              cat /tmp/sitemap-headers
              exit 1
              ;;
          esac
          grep -q '<urlset' /tmp/sitemap-body
          grep -q '<loc>https://aifront.cstlogistic.co.id/' /tmp/sitemap-body
          if grep -q 'https://aicore.cstlogistic.co.id/' /tmp/sitemap-body; then
            echo "Public sitemap still contains retired aicore URLs"
            exit 1
          fi

          legacy_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -sS -D /tmp/legacy-sitemap-headers -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "User-Agent: Googlebot" \
            "$LEGACY_SITEMAP_URL")
          legacy_location=$(awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' /tmp/legacy-sitemap-headers | tail -n1)
          echo "legacy_sitemap_http=$legacy_code location=${legacy_location:-missing}"
          test "$legacy_code" = "301"
          test "$legacy_location" = "$PUBLIC_SITEMAP_URL"

      - name: Report Hostinger verification failure
        if: failure() && steps.target.outputs.stale != 'true'
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set +e
          payload=$(node -e 'console.log(JSON.stringify({
            source:"hostinger",
            kind:"production_verification_failed",
            title:"Hostinger production verification failed",
            summary:"GitHub Actions Hostinger Production Verify failed for expected commit "+process.env.EXPECTED_SHA,
            severity:"critical",
            riskClass:"GUARDED",
            repository:"Travelintrips/Core-AI-Foundation",
            branch:"main",
            headSha:process.env.EXPECTED_SHA,
            environment:"production",
            fingerprint:"hostinger:production:"+process.env.EXPECTED_SHA,
            metadata:{workflow:"Hostinger Production Verify",runId:process.env.GITHUB_RUN_ID}
          }))')
          curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d "$payload" \
            "$API_BASE_URL/ai/incidents" || true

      - name: Verification summary
        if: steps.target.outputs.stale != 'true'
        run: |
          echo "Production commit verified: $EXPECTED_SHA"
          echo "Health/readiness: PASS"
          echo "Admin auth guard: PASS"
          echo "Authenticated Coding Workspace smoke: PASS"
          echo "Admin DB metadata, revenue, streaming and follow-up: PASS"
          echo "GCP Ollama worker + Economy routing: PASS"
          echo "Public sitemap Googlebot fetch: PASS"

      - name: Stale trigger summary
        if: steps.target.outputs.stale == 'true'
        run: |
          echo "Skipped stale production verification trigger."
          echo "Triggered SHA: $EXPECTED_SHA"
          echo "Current main SHA: ${{ steps.target.outputs.latest_main_sha }}"
