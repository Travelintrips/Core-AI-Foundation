  verify_chat:
    name: Smoke deterministic AI Core Chat
    needs: [plan, baseline]
    if: >-
      needs.baseline.result == 'success' &&
      needs.plan.outputs.verify_chat == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}

    steps:
      - name: Verify deterministic AI Core Chat smoke
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          smoke_chat() {
            local message="$1"
            local output="$2"
            local payload
            payload=$(node -e 'console.log(JSON.stringify({message:process.argv[1],mode:"ask",modelPolicy:"smart"}))' "$message")
            code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o "$output" -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -H "Content-Type: application/json" \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              -d "$payload" \
              "$API_BASE_URL/ai/core-chat/messages")
            echo "ai_core_chat_smoke_http=$code message=$message"
            cat "$output"
            test "$code" = "200"
            node - "$output" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const value = JSON.parse(fs.readFileSync(path, "utf8"));
          if (value.kind !== "answer") throw new Error("Expected answer response");
          if (value.route !== "NO_LLM") throw new Error("Expected NO_LLM deterministic route");
          if (value.usage?.totalTokens !== 0) throw new Error("Deterministic smoke must use 0 tokens");
          if (value.estimatedCostUsd !== 0) throw new Error("Deterministic smoke must cost 0 USD");
          if (value.workload !== "DETERMINISTIC") throw new Error("Expected DETERMINISTIC workload");
          if (value.costClass !== "ZERO") throw new Error("Expected ZERO cost class");
          NODE
          }

          smoke_chat "hello" /tmp/ai-core-chat-hello
          smoke_chat "/routing" /tmp/ai-core-chat-routing

          stream_payload='{"message":"hello","mode":"ask","modelPolicy":"smart"}'
          stream_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -N -sS \
            -o /tmp/ai-core-chat-stream -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d "$stream_payload" \
            "$API_BASE_URL/ai/core-chat/messages/stream")
          echo "ai_core_chat_stream_smoke_http=$stream_code"
          cat /tmp/ai-core-chat-stream
          test "$stream_code" = "200"
          grep -q '^event: meta' /tmp/ai-core-chat-stream
          grep -q '^event: delta' /tmp/ai-core-chat-stream
          grep -q '^event: done' /tmp/ai-core-chat-stream
          node - <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("/tmp/ai-core-chat-stream", "utf8").replace(/\r/g, "");
          const blocks = raw.split("\n\n").filter(Boolean);
          const events = blocks.map((block) => {
            const lines = block.split("\n");
            const event = lines.find((line) => line.startsWith("event:"))?.slice(6).trim();
            const data = lines.filter((line) => line.startsWith("data:")).map((line) => line.slice(5).trimStart()).join("\n");
            return { event, data: data ? JSON.parse(data) : null };
          });
          const meta = events.find((item) => item.event === "meta")?.data;
          const delta = events.find((item) => item.event === "delta")?.data;
          const done = events.find((item) => item.event === "done")?.data;
          if (meta?.route !== "NO_LLM") throw new Error("Expected streamed deterministic NO_LLM route");
          if (typeof delta?.text !== "string" || !delta.text.includes("Halo")) throw new Error("Expected streamed greeting delta");
          if (done?.usage?.totalTokens !== 0) throw new Error("Streamed deterministic smoke must use 0 tokens");
          if (done?.estimatedCostUsd !== 0) throw new Error("Streamed deterministic smoke must cost 0 USD");
          console.log("ai_core_chat_stream_smoke=PASS");
          NODE



