name: Hostinger Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - ai-platform
          - customer-portal
          - api
      method:
        description: Hostinger transport method
        required: true
        default: check
        type: choice
        options:
          - check
          - sftp
          - git

permissions:
  contents: read

jobs:
  deploy:
    name: Prepare Hostinger deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: core-ai-foundation-build

      - name: Validate deployment target
        run: |
          echo "Target: ${{ inputs.target }}"
          test -d . || exit 1

      - name: Prepare frontend deployment packages
        if: inputs.target == 'all' || inputs.target == 'ai-platform' || inputs.target == 'customer-portal'
        run: |
          echo "Frontend deployment adapter ready"
          find . -maxdepth 5 -type d | sort

      - name: Prepare API deployment package
        if: inputs.target == 'all' || inputs.target == 'api'
        run: |
          echo "API deployment adapter ready"
          find . -maxdepth 5 -type d | sort

      - name: Transport configuration guard
        run: |
          echo "Selected method: ${{ inputs.method }}"
          if [ "${{ inputs.method }}" = "check" ]; then
            echo "Transport only validated. Upload is disabled."
            exit 0
          fi
          if [ -z "${{ secrets.HOSTINGER_DEPLOY_METHOD }}" ]; then
            echo "Missing HOSTINGER_DEPLOY_METHOD secret"
            exit 1
          fi
          echo "Transport configured: ${{ secrets.HOSTINGER_DEPLOY_METHOD }}"
