  verify_ollama:
    name: Smoke GCP Ollama Economy
    needs: [plan, baseline]
    if: >-
      needs.baseline.result == 'success' &&
      needs.plan.outputs.verify_ollama == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}

    steps:
      - name: Verify GCP Ollama worker and Economy routing
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"

          workers_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS             -o /tmp/ollama-workers -w "%{http_code}"             --connect-timeout 15 --max-time 30             -H "x-admin-api-key: $ADMIN_API_KEY"             "$API_BASE_URL/ai/cluster/workers")
          echo "ollama_worker_registry_http=$workers_code"
          test "$workers_code" = "200"

          node - <<'NODE'
          const fs = require("fs");
          const workers = JSON.parse(fs.readFileSync("/tmp/ollama-workers", "utf8"));
          if (!Array.isArray(workers)) throw new Error("Expected worker capacity array");
          const worker = workers.find((w) => w.workerName === "gcp-ollama-01");
          if (!worker) throw new Error("gcp-ollama-01 is not registered");
          if (worker.providerSlug !== "ollama") throw new Error("Unexpected provider: " + String(worker.providerSlug));
          if (worker.modelId !== "qwen2.5-coder:7b") throw new Error("Unexpected model: " + String(worker.modelId));
          if (worker.runtimeKind !== "ollama_remote_pull") {
            throw new Error("Unexpected Ollama runtime: " + String(worker.runtimeKind));
          }
          if (worker.endpointUrl != null && worker.endpointUrl !== "") {
            throw new Error("Remote pull Ollama worker must not expose an endpoint");
          }
          const status = String(worker.status).toLowerCase();
          const awake = ["online", "idle", "busy"].includes(status) && worker.leaseValid === true;
          const sleeping = status === "offline" && worker.leaseValid !== true;
          if (!awake && !sleeping) {
            throw new Error("gcp-ollama-01 is in an unexpected lifecycle state: " + status);
          }
          console.log(
            "gcp_ollama_worker=PASS status="+worker.status+
            " lifecycle="+(awake ? "awake" : "idle_shutdown")+
            " runningJobs="+String(worker.runningJobs)+
            " availableSlots="+String(worker.availableSlots)+
            " leaseValid="+String(worker.leaseValid)
          );
          NODE

          # A healthy remote pull worker can legitimately be saturated by production work.
          # Wait briefly for a free slot before exercising Economy routing so deployment
          # verification does not fail merely because all model slots are busy.
          capacity_ready=false
          for capacity_attempt in $(seq 1 10); do
            workers_code=$(curl --http1.1 -L -sS \
              -o /tmp/ollama-workers -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -H "x-admin-api-key: $ADMIN_API_KEY" \
              "$API_BASE_URL/ai/cluster/workers" || true)
            if [ "$workers_code" = "200" ] && node - <<'NODE'
          const fs = require("fs");
          const workers = JSON.parse(fs.readFileSync("/tmp/ollama-workers", "utf8"));
          const worker = Array.isArray(workers)
            ? workers.find((w) => w.workerName === "gcp-ollama-01")
            : null;
          const ready =
            worker &&
            worker.leaseValid === true &&
            ["online", "idle", "busy"].includes(String(worker.status).toLowerCase()) &&
            Number(worker.availableSlots ?? 0) > 0;
          if (worker) {
            console.log(
              "ollama_capacity_wait status="+String(worker.status)+
              " runningJobs="+String(worker.runningJobs)+
              " availableSlots="+String(worker.availableSlots)
            );
          }
          process.exit(ready ? 0 : 1);
          NODE
            then
              capacity_ready=true
              break
            fi
            if [ "$capacity_attempt" -lt 10 ]; then sleep 10; fi
          done

          if [ "$capacity_ready" != "true" ]; then
            echo "::warning::gcp-ollama-01 is healthy but remained saturated; skipping Economy invocation smoke for this production verification."
            echo "ollama_economy=SKIPPED reason=worker_saturated"
          else
            payload='{"message":"Jawab tepat: GCP_OLLAMA_CI_OK","mode":"ask","modelPolicy":"economy"}'
            economy_ok=false
            for attempt in $(seq 1 3); do
            started=$(date +%s)
            code=$(curl --http1.1 -L -sS               -o /tmp/ai-core-ollama-smoke -w "%{http_code}"               --connect-timeout 15 --max-time 75               -H "Content-Type: application/json"               -H "x-admin-api-key: $ADMIN_API_KEY"               -d "$payload"               "$API_BASE_URL/ai/core-chat/messages" || true)
            elapsed=$(( $(date +%s) - started ))
            echo "ollama_economy_attempt=$attempt/3 http=${code:-curl-error} elapsed_s=$elapsed"

            if [ "$code" = "200" ] && node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-ollama-smoke", "utf8"));
          const ok =
            value.route === "LOCAL" &&
            value.provider === "ollama" &&
            value.model === "qwen2.5-coder:7b" &&
            value.reply?.trim() === "GCP_OLLAMA_CI_OK" &&
            value.estimatedCostUsd === 0;
          process.exit(ok ? 0 : 1);
          NODE
            then
              economy_ok=true
              break
            fi

              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done

            if [ "$economy_ok" != "true" ]; then
              echo "::error::GCP Ollama Economy routing smoke failed after capacity became available"
              cat /tmp/ai-core-ollama-smoke 2>/dev/null || true
              exit 1
            fi

            node - <<'NODE'
          const fs = require("fs");
          const value = JSON.parse(fs.readFileSync("/tmp/ai-core-ollama-smoke", "utf8"));
          console.log(
            "gcp_ollama_economy=PASS"+
            " route="+value.route+
            " provider="+value.provider+
            " model="+value.model+
            " latencyMs="+String(value.latencyMs ?? "unknown")+
            " totalTokens="+String(value.usage?.totalTokens ?? "unknown")+
            " estimatedCostUsd="+String(value.estimatedCostUsd)
          );
          NODE
          fi



