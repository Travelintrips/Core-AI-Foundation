name: Hostinger Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - ai-platform
          - customer-portal
          - api
      method:
        description: Hostinger transport method
        required: true
        default: check
        type: choice
        options:
          - check
          - sftp
          - git
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Hostinger deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: core-ai-foundation-build

      - name: Validate deployment
        run: |
          echo "Target: ${{ inputs.target || 'all' }}"
          find . -maxdepth 3 -type d | sort

      - name: Deployment metadata
        id: release
        run: |
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "target=${{ inputs.target || 'all' }}" >> "$GITHUB_OUTPUT"

      - name: Transport guard
        run: |
          if [ "${{ inputs.method || 'sftp' }}" = "check" ]; then
            echo "Validation only"
            exit 0
          fi
          if [ "${{ inputs.method || 'sftp' }}" = "sftp" ]; then
            test -n "${{ secrets.HOSTINGER_SFTP_HOST }}"
            test -n "${{ secrets.HOSTINGER_SFTP_USERNAME }}"
            test -n "${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}"
          fi

      - name: Release summary
        run: |
          echo "Deployment release"
          echo "Commit: ${{ steps.release.outputs.commit_sha }}"
          echo "Target: ${{ steps.release.outputs.target }}"
          echo "Time: ${{ steps.release.outputs.deploy_time }}"
