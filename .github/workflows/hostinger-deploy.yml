name: Hostinger Production Verify

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI Verify
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hostinger-production-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Hostinger native deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: https://aicore.cstlogistic.co.id/api
      PUBLIC_SITEMAP_URL: https://aifront.cstlogistic.co.id/sitemap.xml
      LEGACY_SITEMAP_URL: https://aicore.cstlogistic.co.id/sitemap.xml

    steps:
      - name: Wait for exact production commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS -D /tmp/headers -o /tmp/body -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 "$API_BASE_URL/healthz" || true)
            live_sha=$(awk -F': ' 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2); print $2}' /tmp/headers | tail -n1)
            marker=$(awk -F': ' 'tolower($1)=="x-cst-release-marker" {gsub("\r","",$2); print $2}' /tmp/headers | tail -n1)
            echo "attempt=$attempt http=$code live_sha=${live_sha:-missing} expected_sha=$EXPECTED_SHA marker=${marker:-missing}"
            if [ "$code" = "200" ] && [ "$live_sha" = "$EXPECTED_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not reach expected commit $EXPECTED_SHA"
          exit 1

      - name: Verify readiness
        shell: bash
        run: |
          curl --fail --silent --show-error "$API_BASE_URL/healthz/full" > /tmp/full
          cat /tmp/full
          grep -q '"status":"ok"' /tmp/full

      - name: Verify admin auth guard
        shell: bash
        run: |
          code=$(curl -L -sS -o /tmp/tasks -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 "$API_BASE_URL/ai/coding/tasks")
          echo "coding_tasks_unauthenticated_http=$code"
          test "$code" = "401"

      - name: Verify authenticated Coding Workspace
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl -L -sS -o /tmp/tasks-auth -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/tasks")
          echo "coding_tasks_authenticated_http=$code"
          test "$code" = "200"
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/tasks-auth","utf8")); if(!Array.isArray(v)) throw new Error("Expected coding tasks array"); console.log("coding_tasks_authenticated_payload=array");'

      - name: Inspect ZeroLLM host readiness
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          curl --fail --silent --show-error \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/zerollm/readiness" > /tmp/zerollm-readiness
          cat /tmp/zerollm-readiness
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/zerollm-readiness","utf8")); if(v.provider!=="zerollm"||v.loopbackOnly!==true) throw new Error("Invalid ZeroLLM readiness payload");'

      - name: Verify Coding Workspace GitHub repository discovery
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl -L -sS -o /tmp/github-repositories -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            "$API_BASE_URL/ai/coding/github/repositories?q=Core-AI-Foundation")
          echo "github_repository_discovery_http=$code"
          test "$code" = "200"
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/github-repositories","utf8")); if(!Array.isArray(v.repositories)) throw new Error("Expected repositories array"); if(!v.repositories.some(r=>r.fullName==="Travelintrips/Core-AI-Foundation")) throw new Error("Core-AI-Foundation not returned by GitHub discovery"); console.log("github_repository_discovery=PASS count="+v.repositories.length);'

      - name: Verify public sitemap for Googlebot
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -D /tmp/sitemap-headers -o /tmp/sitemap-body -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "User-Agent: Googlebot" \
            "$PUBLIC_SITEMAP_URL")
          content_type=$(awk -F': ' 'tolower($1)=="content-type" {gsub("\r","",$2); print tolower($2)}' /tmp/sitemap-headers | tail -n1)
          echo "public_sitemap_http=$code content_type=${content_type:-missing}"
          test "$code" = "200"
          case "$content_type" in
            application/xml*|text/xml*) ;;
            *)
              echo "Unexpected sitemap Content-Type: ${content_type:-missing}"
              cat /tmp/sitemap-headers
              exit 1
              ;;
          esac
          grep -q '<urlset' /tmp/sitemap-body
          grep -q '<loc>https://aifront.cstlogistic.co.id/' /tmp/sitemap-body
          if grep -q 'https://aicore.cstlogistic.co.id/' /tmp/sitemap-body; then
            echo "Public sitemap still contains retired aicore URLs"
            exit 1
          fi

          legacy_code=$(curl -sS -D /tmp/legacy-sitemap-headers -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "User-Agent: Googlebot" \
            "$LEGACY_SITEMAP_URL")
          legacy_location=$(awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' /tmp/legacy-sitemap-headers | tail -n1)
          echo "legacy_sitemap_http=$legacy_code location=${legacy_location:-missing}"
          test "$legacy_code" = "301"
          test "$legacy_location" = "$PUBLIC_SITEMAP_URL"

      - name: Report Hostinger verification failure
        if: failure()
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set +e
          payload=$(node -e 'console.log(JSON.stringify({
            source:"hostinger",
            kind:"production_verification_failed",
            title:"Hostinger production verification failed",
            summary:"GitHub Actions Hostinger Production Verify failed for expected commit "+process.env.EXPECTED_SHA,
            severity:"critical",
            riskClass:"GUARDED",
            repository:"Travelintrips/Core-AI-Foundation",
            branch:"main",
            headSha:process.env.EXPECTED_SHA,
            environment:"production",
            fingerprint:"hostinger:production:"+process.env.EXPECTED_SHA,
            metadata:{workflow:"Hostinger Production Verify",runId:process.env.GITHUB_RUN_ID}
          }))')
          curl --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -H "x-admin-api-key: $ADMIN_API_KEY" \
            -d "$payload" \
            "$API_BASE_URL/ai/incidents" || true

      - name: Verification summary
        run: |
          echo "Production commit verified: $EXPECTED_SHA"
          echo "Health/readiness: PASS"
          echo "Admin auth guard: PASS"
          echo "Authenticated Coding Workspace smoke: PASS"
          echo "Public sitemap Googlebot fetch: PASS"
