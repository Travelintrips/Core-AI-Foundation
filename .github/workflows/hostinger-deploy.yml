name: Hostinger Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - ai-platform
          - customer-portal
          - api
      method:
        description: Hostinger transport method
        required: true
        default: sftp
        type: choice
        options:
          - check
          - sftp
          - git
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Hostinger deployment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: core-ai-foundation-build

      - name: Validate deployment
        run: |
          echo "Target: ${{ inputs.target || 'all' }}"
          find . -maxdepth 3 -type d | sort

      - name: Deployment metadata
        id: release
        run: |
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "target=${{ inputs.target || 'all' }}" >> "$GITHUB_OUTPUT"

      - name: Transport guard
        run: |
          if [ "${{ inputs.method || 'sftp' }}" = "check" ]; then exit 0; fi
          test -n "${{ secrets.HOSTINGER_SFTP_HOST }}"
          test -n "${{ secrets.HOSTINGER_SFTP_USERNAME }}"
          test -n "${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}"

      - name: Upload AI Platform
        if: inputs.method == 'sftp' && (inputs.target == 'all' || inputs.target == 'ai-platform')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          key: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
          source: ai-platform/dist/*
          target: ${{ secrets.HOSTINGER_AI_PATH }}

      - name: Upload Customer Portal
        if: inputs.method == 'sftp' && (inputs.target == 'all' || inputs.target == 'customer-portal')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          key: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
          source: customer-portal/dist/*
          target: ${{ secrets.HOSTINGER_CUSTOMER_PATH }}

      - name: Upload API
        if: inputs.method == 'sftp' && (inputs.target == 'all' || inputs.target == 'api')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          key: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
          source: api-server/dist/*
          target: ${{ secrets.HOSTINGER_API_PATH }}

      - name: Health check
        if: inputs.method == 'sftp'
        run: |
          if [ -n "${{ secrets.HOSTINGER_AI_URL }}" ]; then curl --fail --silent "${{ secrets.HOSTINGER_AI_URL }}" >/dev/null; fi
          if [ -n "${{ secrets.HOSTINGER_CUSTOMER_URL }}" ]; then curl --fail --silent "${{ secrets.HOSTINGER_CUSTOMER_URL }}" >/dev/null; fi
          if [ -n "${{ secrets.HOSTINGER_API_HEALTH_URL }}" ]; then curl --fail --silent "${{ secrets.HOSTINGER_API_HEALTH_URL }}" >/dev/null; fi

      - name: Release summary
        run: |
          echo "Commit: ${{ steps.release.outputs.commit_sha }}"
          echo "Target: ${{ steps.release.outputs.target }}"
          echo "Time: ${{ steps.release.outputs.deploy_time }}"
