# Hostinger native Git deployment trigger marker
name: Hostinger Production Verify

on:
  workflow_dispatch:
    inputs:
      verify_ollama:
        description: "Run the GCP Ollama/Economy production smoke"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - "true"
          - "false"
      verify_whatsapp:
        description: "Run the real WhatsApp voice-note delivery E2E"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - "true"
          - "false"
  workflow_run:
    workflows:
      - CI Verify
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hostinger-production-verify
  cancel-in-progress: true

jobs:
  plan:
    name: Plan production verification
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}
    outputs:
      stale: ${{ steps.target.outputs.stale }}
      latest_main_sha: ${{ steps.target.outputs.latest_main_sha }}
      verify_mcp: ${{ steps.verify_scope.outputs.verify_mcp }}
      verify_coding: ${{ steps.verify_scope.outputs.verify_coding }}
      verify_chat: ${{ steps.verify_scope.outputs.verify_chat }}
      verify_data: ${{ steps.verify_scope.outputs.verify_data }}
      verify_cloud: ${{ steps.verify_scope.outputs.verify_cloud }}
      verify_zerollm: ${{ steps.verify_scope.outputs.verify_zerollm }}
      verify_sitemap: ${{ steps.verify_scope.outputs.verify_sitemap }}
      scope_reason: ${{ steps.verify_scope.outputs.reason }}
      verify_ollama: ${{ steps.ollama_scope.outputs.verify_ollama }}
      ollama_reason: ${{ steps.ollama_scope.outputs.reason }}
      verify_whatsapp: ${{ steps.whatsapp_scope.outputs.verify_whatsapp }}
      whatsapp_reason: ${{ steps.whatsapp_scope.outputs.reason }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve production verification target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "latest_main_sha=$latest_main_sha"
          echo "latest_main_sha=$latest_main_sha" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA"

          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$EXPECTED_SHA" != "$latest_main_sha" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale production verification trigger. expected_sha=$EXPECTED_SHA latest_main_sha=$latest_main_sha"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect production verification scope
        id: verify_scope
        if: steps.target.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail

          verify_mcp=false
          verify_coding=false
          verify_chat=false
          verify_data=false
          verify_cloud=false
          verify_zerollm=false
          verify_sitemap=false
          reason="selective"

          set_all_scopes() {
            verify_mcp=true
            verify_coding=true
            verify_chat=true
            verify_data=true
            verify_cloud=true
            verify_zerollm=true
            verify_sitemap=true
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            set_all_scopes
            reason="manual_dispatch_full_verify"
          else
            base_sha=""
            if git rev-parse "${EXPECTED_SHA}^1" >/dev/null 2>&1; then
              base_sha=$(git rev-parse "${EXPECTED_SHA}^1")
            fi

            if [ -z "$base_sha" ]; then
              set_all_scopes
              reason="parent_unavailable_full_verify"
            else
              changed_files=$(git diff --name-only "$base_sha" "$EXPECTED_SHA")
              printf 'verification_scope_changed_files=\n%s\n' "$changed_files"

              while IFS= read -r file; do
                [ -z "$file" ] && continue
                case "$file" in
                  docs/*|*.md|*.mdx|*.txt|*/__tests__/*|*.test.ts|*.test.tsx|*.spec.ts|*.spec.tsx)
                    ;;
                  .github/workflows/hostinger-deploy.yml)
                    # Workflow-only edits should verify the smoke domain whose
                    # actual step changed. Trigger/concurrency/scope plumbing
                    # stays on the always-on exact-SHA/readiness/auth/SMTP baseline.
                    workflow_diff=$(git diff -U2 "$base_sha" "$EXPECTED_SHA" -- "$file")

                    if grep -Eiq 'Verify live MCP discovery|server/discover|tools/list|mcp_native_event_discovery' <<< "$workflow_diff"; then
                      verify_mcp=true
                    fi
                    if grep -Eiq 'Verify authenticated Coding Workspace|Verify Coding Workspace GitHub repository discovery|coding_tasks_authenticated|github_repository_discovery' <<< "$workflow_diff"; then
                      verify_coding=true
                    fi
                    if grep -Eiq 'Verify deterministic AI Core Chat smoke|ai_core_chat_smoke|ai_core_chat_stream_smoke' <<< "$workflow_diff"; then
                      verify_chat=true
                    fi
                    if grep -Eiq 'Verify schema-aware AI Core Chat database queries|Verify AI Core Data Tool|ai-core-admin-db-smoke|data_tools_readiness|data_tool_execution' <<< "$workflow_diff"; then
                      verify_data=true
                    fi
                    if grep -Eiq 'Verify AI Core cloud routing|ai_core_cloud_smoke|gemini_primary_registered' <<< "$workflow_diff"; then
                      verify_cloud=true
                    fi
                    if grep -Eiq 'Inspect ZeroLLM host readiness|zerollm/readiness' <<< "$workflow_diff"; then
                      verify_zerollm=true
                    fi
                    if grep -Eiq 'Verify public sitemap for Googlebot|PUBLIC_SITEMAP_URL|legacy_sitemap_http' <<< "$workflow_diff"; then
                      verify_sitemap=true
                    fi

                    reason="hostinger_workflow_diff_selective:$file"
                    ;;
                  .github/workflows/hostinger-nodejs-deploy.yml|scripts/hostinger-*)
                    # Deployment mechanics are covered by exact-SHA convergence
                    # and readiness; they do not require unrelated product smoke.
                    reason="deploy_orchestration_baseline:$file"
                    ;;
                  package.json|pnpm-lock.yaml)
                    set_all_scopes
                    reason="shared_runtime_dependency_change:$file"
                    break
                    ;;
                  lib/api-spec/*|lib/api-zod/*|lib/api-client-react/*)
                    set_all_scopes
                    reason="shared_api_contract_change:$file"
                    break
                    ;;
                  artifacts/api-server/src/migrations/*|artifacts/api-server/src/repositories/*|artifacts/api-server/src/db*|artifacts/api-server/src/database*)
                    set_all_scopes
                    reason="shared_data_layer_change:$file"
                    break
                    ;;
                  artifacts/api-server/src/routes/ai-core-chat.ts)
                    # Central chat route owns MCP/events, coding control, Data Tool,
                    # provider routing and ZeroLLM entry points. WhatsApp remains
                    # governed by the dedicated whatsapp_scope detector below.
                    verify_mcp=true
                    verify_coding=true
                    verify_chat=true
                    verify_data=true
                    verify_cloud=true
                    verify_zerollm=true
                    ;;
                  artifacts/api-server/src/*mcp*|artifacts/api-server/src/*Mcp*|artifacts/api-server/src/**/*mcp*|artifacts/api-server/src/**/*Mcp*)
                    verify_mcp=true
                    ;;
                  artifacts/api-server/src/routes/coding-*|artifacts/api-server/src/routes/aicoding-*|artifacts/api-server/src/services/*coding*|artifacts/api-server/src/services/*Coding*)
                    verify_coding=true
                    ;;
                  artifacts/api-server/src/**/*dataTool*|artifacts/api-server/src/**/*DataTool*|artifacts/api-server/src/**/*serviceNormalization*|artifacts/api-server/src/**/*goalRepository*)
                    verify_data=true
                    ;;
                  artifacts/api-server/src/**/*zerollm*|artifacts/api-server/src/**/*ZeroLlm*|artifacts/api-server/src/**/*ZeroLLM*)
                    verify_zerollm=true
                    ;;
                  artifacts/api-server/src/services/aiCoreWorkloadRouterService.ts)
                    # Workload classification/model selection changes affect
                    # deterministic chat behavior and cloud provider routing,
                    # but not MCP, Data Tool, Coding Workspace or ZeroLLM.
                    verify_chat=true
                    verify_cloud=true
                    ;;
                  artifacts/api-server/src/**/*provider*|artifacts/api-server/src/**/*Provider*|artifacts/api-server/src/**/*model*|artifacts/api-server/src/**/*Model*|artifacts/api-server/src/**/*aiExecution*)
                    verify_cloud=true
                    ;;
                  artifacts/customer-portal/*|artifacts/customer-portal/**/*|**/sitemap*|**/robots.txt)
                    verify_sitemap=true
                    ;;
                  artifacts/ai-platform/*|artifacts/ai-platform/**/*)
                    # AI Platform UI-only changes use the always-on baseline.
                    ;;
                  artifacts/api-server/src/*|artifacts/api-server/src/**/*|scripts/*|lib/*)
                    set_all_scopes
                    reason="unclassified_runtime_change:$file"
                    break
                    ;;
                  *)
                    set_all_scopes
                    reason="unclassified_path:$file"
                    break
                    ;;
                esac
              done <<< "$changed_files"
            fi
          fi

          echo "verify_mcp=$verify_mcp" >> "$GITHUB_OUTPUT"
          echo "verify_coding=$verify_coding" >> "$GITHUB_OUTPUT"
          echo "verify_chat=$verify_chat" >> "$GITHUB_OUTPUT"
          echo "verify_data=$verify_data" >> "$GITHUB_OUTPUT"
          echo "verify_cloud=$verify_cloud" >> "$GITHUB_OUTPUT"
          echo "verify_zerollm=$verify_zerollm" >> "$GITHUB_OUTPUT"
          echo "verify_sitemap=$verify_sitemap" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "verification_scope reason=$reason mcp=$verify_mcp coding=$verify_coding chat=$verify_chat data=$verify_data cloud=$verify_cloud zerollm=$verify_zerollm sitemap=$verify_sitemap"

      - name: Detect whether Ollama verification is required
        id: ollama_scope
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          MANUAL_OLLAMA_MODE: ${{ inputs.verify_ollama || 'auto' }}
        run: |
          set -euo pipefail

          mode="${MANUAL_OLLAMA_MODE:-auto}"
          if [ "$mode" = "true" ]; then
            echo "verify_ollama=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_force" >> "$GITHUB_OUTPUT"
            echo "ollama_scope=RUN reason=manual_force"
            exit 0
          fi
          if [ "$mode" = "false" ]; then
            echo "verify_ollama=false" >> "$GITHUB_OUTPUT"
            echo "reason=manual_skip" >> "$GITHUB_OUTPUT"
            echo "ollama_scope=SKIP reason=manual_skip"
            exit 0
          fi

          base_sha=""
          if git rev-parse "${EXPECTED_SHA}^1" >/dev/null 2>&1; then
            base_sha=$(git rev-parse "${EXPECTED_SHA}^1")
          fi

          # Fail safe when the parent cannot be inspected: run the full Ollama
          # smoke rather than accidentally skipping a sensitive deployment.
          if [ -z "$base_sha" ]; then
            echo "verify_ollama=true" >> "$GITHUB_OUTPUT"
            echo "reason=parent_unavailable" >> "$GITHUB_OUTPUT"
            echo "ollama_scope=RUN reason=parent_unavailable"
            exit 0
          fi

          changed_files=$(git diff --name-only "$base_sha" "$EXPECTED_SHA")
          printf 'changed_files_since_parent=\n%s\n' "$changed_files"

          verify_ollama=false
          reason="no_ollama_sensitive_change"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              artifacts/api-server/src/scripts/remoteOllamaWorker.ts|\
              artifacts/api-server/src/services/*Ollama*.ts|\
              artifacts/api-server/src/services/*ollama*.ts|\
              artifacts/api-server/src/services/gcpOllamaVmLifecycleService.ts|\
              artifacts/api-server/src/services/jobDispatcherService.ts|\
              artifacts/api-server/src/services/jobWorkerService.ts|\
              artifacts/api-server/src/services/workerClusterService.ts|\
              artifacts/api-server/src/routes/cluster.ts|\
              scripts/ai-gpu-idle-guard.sh|\
              scripts/install-shared-gpu-image-gateway.sh)
                verify_ollama=true
                reason="sensitive_path:$file"
                break
                ;;
              .github/workflows/hostinger-deploy.yml)
                # This verifier also contains MCP/WA/Data Tool checks. Only
                # wake Ollama when the workflow diff changes Ollama/Economy
                # scope or its production smoke, not for unrelated verifier edits.
                if git diff -U0 "$base_sha" "$EXPECTED_SHA" -- "$file" \
                  | grep -Eiq '^[+-].*(ollama|economy|verify_ollama|gcp_ollama|gcp-ollama|LOCAL.*provider|worker.*capacity)'; then
                  verify_ollama=true
                  reason="ollama_verifier_diff:$file"
                  break
                fi
                ;;
              artifacts/api-server/src/routes/ai-core-chat.ts)
                # ai-core-chat.ts is shared by MCP/WA/Data Tool flows. Only
                # changes that touch local-model routing should wake Ollama.
                if git diff -U0 "$base_sha" "$EXPECTED_SHA" -- "$file" \
                  | grep -Eiq '^[+-].*(ollama|economy|modelPolicy|REMOTE_OLLAMA|providerSlug|localModel|route.*LOCAL)'; then
                  verify_ollama=true
                  reason="local_routing_diff:$file"
                  break
                fi
                ;;
            esac
          done <<< "$changed_files"

          echo "verify_ollama=$verify_ollama" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "ollama_scope=$([ "$verify_ollama" = "true" ] && echo RUN || echo SKIP) reason=$reason"

      - name: Detect whether WhatsApp verification is required
        id: whatsapp_scope
        if: steps.target.outputs.stale != 'true'
        shell: bash
        env:
          MANUAL_WHATSAPP_MODE: ${{ inputs.verify_whatsapp || 'auto' }}
        run: |
          set -euo pipefail

          mode="${MANUAL_WHATSAPP_MODE:-auto}"
          if [ "$mode" = "true" ]; then
            echo "verify_whatsapp=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_force" >> "$GITHUB_OUTPUT"
            echo "whatsapp_scope=RUN reason=manual_force"
            exit 0
          fi
          if [ "$mode" = "false" ]; then
            echo "verify_whatsapp=false" >> "$GITHUB_OUTPUT"
            echo "reason=manual_skip" >> "$GITHUB_OUTPUT"
            echo "whatsapp_scope=SKIP reason=manual_skip"
            exit 0
          fi

          base_sha=""
          if git rev-parse "${EXPECTED_SHA}^1" >/dev/null 2>&1; then
            base_sha=$(git rev-parse "${EXPECTED_SHA}^1")
          fi

          if [ -z "$base_sha" ]; then
            echo "verify_whatsapp=true" >> "$GITHUB_OUTPUT"
            echo "reason=parent_unavailable" >> "$GITHUB_OUTPUT"
            echo "whatsapp_scope=RUN reason=parent_unavailable"
            exit 0
          fi

          changed_files=$(git diff --name-only "$base_sha" "$EXPECTED_SHA")
          verify_whatsapp=false
          reason="no_whatsapp_sensitive_change"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              artifacts/api-server/src/routes/coding-whatsapp-webhook.ts|\
              artifacts/api-server/src/services/aiCoreWhatsappChatService.ts|\
              artifacts/api-server/src/services/codingWhatsappNotificationService.ts|\
              artifacts/api-server/src/services/codingWhatsappTaskRuntimeService.ts)
                verify_whatsapp=true
                reason="whatsapp_sensitive_path:$file"
                break
                ;;
              artifacts/api-server/src/routes/ai-core-chat.ts)
                if git diff -U0 "$base_sha" "$EXPECTED_SHA" -- "$file" \
                  | grep -Eiq '^[+-].*(whatsapp|voice_note|whatsapp_voice|AI_CORE_WA|WA_E2E|delivery)'; then
                  verify_whatsapp=true
                  reason="whatsapp_chat_diff:$file"
                  break
                fi
                ;;
              .github/workflows/hostinger-deploy.yml)
                if git diff -U0 "$base_sha" "$EXPECTED_SHA" -- "$file" \
                  | grep -Eiq '^[+-].*(whatsapp|verify_whatsapp|wa_e2e|voice-note|voice_note)'; then
                  verify_whatsapp=true
                  reason="whatsapp_verifier_diff:$file"
                  break
                fi
                ;;
            esac
          done <<< "$changed_files"

          echo "verify_whatsapp=$verify_whatsapp" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "whatsapp_scope=$([ "$verify_whatsapp" = "true" ] && echo RUN || echo SKIP) reason=$reason"

      - name: Stale trigger summary
        if: steps.target.outputs.stale == 'true'
        run: |
          echo "Skipped stale production verification trigger."
          echo "Triggered SHA: $EXPECTED_SHA"
          echo "Current main SHA: ${{ steps.target.outputs.latest_main_sha }}"


  baseline:
    name: Verify exact production baseline
    needs: plan
    if: >-
      needs.plan.result == 'success' &&
      needs.plan.outputs.stale != 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Wait for stable exact production commit
        shell: bash
        run: bash scripts/hostinger-production-probe.sh

      - name: Verify readiness
        shell: bash
        run: |
          set -euo pipefail

          # Hostinger starts accepting traffic before all sequential runtime
          # initializers have necessarily finished. Keep readiness strict, but
          # allow the autonomous runtime a bounded startup grace period.
          max_attempts=12
          for attempt in $(seq 1 "$max_attempts"); do
            code=$(curl --http1.1 --retry 2 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 30 -L --silent --show-error \
              -o /tmp/full -w "%{http_code}" "$API_BASE_URL/healthz/full" || true)

            echo "readiness_attempt=$attempt/$max_attempts http=$code"
            cat /tmp/full 2>/dev/null || true
            echo

            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/full; then
              echo "readiness=PASS"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Readiness did not become healthy within the bounded startup grace period."
              exit 1
            fi

            sleep 10
          done

      - name: Verify admin auth guard
        shell: bash
        run: |
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS -o /tmp/tasks -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 "$API_BASE_URL/ai/coding/tasks")
          echo "coding_tasks_unauthenticated_http=$code"
          test "$code" = "401"

      - name: Verify SMTP transport for login email
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors -L -sS             -o /tmp/email-diagnostic -w "%{http_code}"             --connect-timeout 15 --max-time 30             -H "x-admin-api-key: $ADMIN_API_KEY"             "$API_BASE_URL/internal/auth/email-diagnostics")
          echo "email_diagnostics_http=$code"
          cat /tmp/email-diagnostic
          test "$code" = "200"
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/email-diagnostic","utf8")); if(v.ok!==true || v.category!=="OK") throw new Error("SMTP transport is not healthy"); console.log("smtp_transport=PASS");'



  verify_mcp:
    name: Smoke MCP discovery/events
    needs: [plan, baseline]
    if: >-
      needs.baseline.result == 'success' &&
      needs.plan.outputs.verify_mcp == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      API_BASE_URL: ${{ vars.AI_CORE_VERIFY_BASE_URL || vars.AI_CORE_API_BASE_URL || 'https://aicore.cstlogistic.co.id/api' }}

    steps:
      - name: Verify live MCP discovery and native events
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$API_BASE_URL/ai/core-chat/mcp"

          discover_payload='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{}}'
          discover_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors \
            -sS -D /tmp/mcp-discover.headers -o /tmp/mcp-discover.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: CST-AI-Core-MCP-Discovery-Probe/2.0" \
            --data-binary "$discover_payload" \
            "$endpoint")
          echo "mcp_server_discover_http=$discover_code"
          test "$discover_code" = "200"
          node - <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync("/tmp/mcp-discover.json", "utf8"));
          const result = body?.result;
          if (result?.resultType !== "complete") throw new Error("MCP server/discover did not return a complete result");
          const versions = Array.isArray(result?.supportedVersions) ? result.supportedVersions : [];
          if (!versions.includes("2026-07-28")) throw new Error("Required MCP Events protocol version 2026-07-28 is not live");
          if (!versions.includes("2025-06-18")) throw new Error("Backward-compatible MCP protocol version 2025-06-18 is not live");
          if (!result?.capabilities || typeof result.capabilities.events !== "object") {
            throw new Error("Native MCP events capability is not live");
          }
          if (typeof result?.serverInfo?.version !== "string" || !result.serverInfo.version.trim()) {
            throw new Error("MCP server/discover returned no server version");
          }
          console.log("mcp_native_event_discovery=PASS version="+result.serverInfo.version);
          NODE
          server_version=$(node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/mcp-discover.json","utf8"))?.result?.serverInfo?.version; if(typeof v!=="string"||!v.trim()) process.exit(1); process.stdout.write(v.trim())')
          discover_header_version=$(awk -F': ' 'tolower($1)=="x-mcp-server-version" {gsub("\r","",$2); print $2}' /tmp/mcp-discover.headers | tail -n1)
          echo "mcp_server_version=$server_version header_version=${discover_header_version:-missing}"
          test "$discover_header_version" = "$server_version"
          grep -Eqi '^cache-control:.*no-store' /tmp/mcp-discover.headers

          initialize_payload='{"jsonrpc":"2.0","id":11,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"cst-production-verify","version":"2.0"}}}'
          initialize_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors \
            -sS -D /tmp/mcp-initialize.headers -o /tmp/mcp-initialize.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: CST-AI-Core-MCP-Initialize-Probe/2.0" \
            --data-binary "$initialize_payload" \
            "$endpoint")
          echo "mcp_initialize_2026_http=$initialize_code"
          test "$initialize_code" = "200"
          node - <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync("/tmp/mcp-initialize.json", "utf8"));
          const result = body?.result;
          if (result?.protocolVersion !== "2026-07-28") {
            throw new Error("MCP initialize did not negotiate protocol 2026-07-28");
          }
          if (!result?.capabilities || typeof result.capabilities.events !== "object") {
            throw new Error("MCP initialize did not expose native events capability");
          }
          console.log("mcp_events_protocol_negotiation=PASS protocol="+result.protocolVersion);
          NODE
          initialize_header_version=$(awk -F': ' 'tolower($1)=="x-mcp-server-version" {gsub("\r","",$2); print $2}' /tmp/mcp-initialize.headers | tail -n1)
          echo "mcp_initialize_header_version=${initialize_header_version:-missing}"
          test "$initialize_header_version" = "$server_version"
          grep -Eqi '^cache-control:.*no-store' /tmp/mcp-initialize.headers

          tools_payload='{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          tools_code=$(curl --http1.1 --retry 3 --retry-delay 2 --retry-all-errors \
            -sS -D /tmp/mcp-tools.headers -o /tmp/mcp-tools.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 30 \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: CST-AI-Core-MCP-Discovery-Probe/2.0" \
            --data-binary "$tools_payload" \
            "$endpoint")
          echo "mcp_tools_http=$tools_code"
          test "$tools_code" = "200"
          node - <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync("/tmp/mcp-tools.json", "utf8"));
          const tools = body?.result?.tools;
          if (!Array.isArray(tools)) throw new Error("MCP tools/list did not return tools array");
          const names = new Set(tools.map((tool) => tool.name));
          const expected = [
            "query_ai_core",
            "send_ai_core_command",
            "get_ai_core_task_progress",
            "subscribe_ai_core_events",
            "read_ai_core_events",
            "ack_ai_core_event",
            "unsubscribe_ai_core_events",
            "get_profile",
          ];
          for (const name of expected) {
            if (!names.has(name)) throw new Error("Missing live MCP tool: " + name);
          }
          const queryTool = tools.find((tool) => tool.name === "query_ai_core");
          const queryScopes = queryTool?.securitySchemes?.[0]?.scopes;
          if (!Array.isArray(queryScopes) || !queryScopes.includes("ai_core.progress")) {
            throw new Error("query_ai_core is not exposed on read-only ai_core.progress scope");
          }
          if (queryTool?.annotations?.readOnlyHint !== true || queryTool?.annotations?.destructiveHint !== false) {
            throw new Error("query_ai_core is not annotated as read-only");
          }
          for (const tool of tools.filter((tool) => expected.slice(3, 7).includes(tool.name))) {
            const scopes = tool?.securitySchemes?.[0]?.scopes;
            if (!Array.isArray(scopes) || !scopes.includes("ai_core.events")) {
              throw new Error("Event tool not exposed on dedicated ai_core.events scope: " + tool.name);
            }
          }
          console.log("mcp_tool_discovery=PASS count="+tools.length);
          NODE
          tools_header_version=$(awk -F': ' 'tolower($1)=="x-mcp-server-version" {gsub("\r","",$2); print $2}' /tmp/mcp-tools.headers | tail -n1)
          echo "mcp_tools_header_version=${tools_header_version:-missing}"
          test "$tools_header_version" = "$server_version"
          grep -Eqi '^cache-control:.*no-store' /tmp/mcp-tools.headers



