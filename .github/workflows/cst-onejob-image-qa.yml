name: CST DEV One-Job QA Image Provenance

on:
  pull_request:
    paths:
      - ".github/workflows/cst-onejob-image-qa.yml"
      - "deploy/hostinger-dev/**"
      - "scripts/dev/stamp-dev-build-sha.mjs"
      - "scripts/dev/stamp-dev-build-sha.test.mjs"
      - "scripts/dev/cst-onejob-ci-image-runtime-smoke.mjs"
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cst-onejob-image-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-image:
    name: Build and check DEV image without deployment
    # A fork or unrelated PR must not consume this bounded pilot QA lane.
    if: >-
      github.repository == 'Travelintrips/Core-AI-Foundation' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.head_ref == 'feat/cst-ai-team-scoped-readiness-20261118' ||
         github.head_ref == 'integration/cst-dev-onejob-one-batch-20261120')) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/feat/cst-ai-team-scoped-readiness-20261118' ||
         github.ref == 'refs/heads/integration/cst-dev-onejob-one-batch-20261120')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test fail-closed source stamping
        run: node --test scripts/dev/stamp-dev-build-sha.test.mjs
      - name: Verify runtime smoke denies execution outside isolated QA
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/dev/cst-onejob-ci-image-runtime-smoke.mjs
          set +e
          node scripts/dev/cst-onejob-ci-image-runtime-smoke.mjs > /tmp/cst-smoke-deny.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -qx "CI_RUNTIME_SMOKE_DENIED_INVALID_SCOPE" /tmp/cst-smoke-deny.txt
      - name: Build actual image with exact checked-out commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          echo "QA_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          docker build \
            --file deploy/hostinger-dev/Dockerfile \
            --build-arg "GITHUB_SHA=$SOURCE_SHA" \
            --label "cst.qa.source_commit=$SOURCE_SHA" \
            --label "cst.qa.scope=DEV_ONEJOB_IMAGE_PROVENANCE_ONLY" \
            --label "cst.qa.prod_deploy=false" \
            --tag cst-core-onejob-dev-image-qa:local \
            .
      - name: Readback embedded SHA and image label without network
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=cst-core-onejob-dev-image-qa:local
          IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          ACTUAL_MARKER="$(docker run --rm --network none --entrypoint cat "$IMAGE" /app/.cst-build-sha)"
          ACTUAL_LABEL="$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "cst.qa.source_commit"}}')"
          test "$ACTUAL_MARKER" = "$QA_SOURCE_SHA"
          test "$ACTUAL_LABEL" = "$QA_SOURCE_SHA"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "cst.qa.prod_deploy"}}')" = false
          echo "CST_DEV_QA_IMAGE_SOURCE_PROVENANCE_PASS"
          echo "Image digest: $IMAGE_ID"
          echo "Source: $QA_SOURCE_SHA"
      - name: Smoke actual Super Admin UI plus API in zero-network QA image
        shell: bash
        env:
          QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # No host port, credentials, DB network, signer or PROD access.
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=48m \
            --tmpfs /run:rw,nosuid,nodev,size=24m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 100 --memory 750m \
            -e CST_ONEJOB_IMAGE_SMOKE_QA=true \
            -e QA_SOURCE_SHA="$QA_SOURCE_SHA" \
            -e APP_ENV=development -e NODE_ENV=development \
            -e AI_DISPATCHER_ENABLED=false \
            -e OLLAMA_WORKER_RUNTIME_ENABLED=false \
            -e CST_DEV_ONEJOB_OWNER_APPROVAL_ENABLED=false \
            -e CST_DEV_ONEJOB_BROKER_ENABLED=false \
            --entrypoint node cst-core-onejob-dev-image-qa:local \
            /app/scripts/dev/cst-onejob-ci-image-runtime-smoke.mjs
      - name: Prevent accidental QA image deployment
        shell: bash
        run: |
          echo "NO IMAGE PUSH / NO DEV OR PROD DEPLOY / NO DB CONNECTION / NO SIGNER CHANGE"
