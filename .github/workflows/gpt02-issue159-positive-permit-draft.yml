name: GPT02 DEV Positive Permit Proposal (Disposable Only)

on:
  pull_request:
    branches: [develop]
    paths:
      - "docs/dev/gpt02-issue159-positive-dispatch-permit.PROPOSED.sql"
      - "docs/dev/gpt02-issue159-exact-bridge-stage-role.PROPOSED.sql"
      - "docs/dev/gpt02-issue159-release-claim-fence.PROPOSED.sql"
      - "docs/dev/gpt02-issue159-held-claim-readback.PROPOSED.sql"
      - "docs/dev/gpt02-issue159-issuer-reader-locked-recovery.md"
      - "deploy/ai-coding-standalone-dev/gpt02-issue159-issuer-reader.service"
      - "deploy/ai-coding-standalone-dev/gpt02-issue159-operational-signer@.service"
      - "scripts/dev/test_gpt02_issue159_issuer_reader_sysusers.py"
      - "deploy/ai-coding-standalone-dev/gpt02_issue159_positive_permit_handoff.py"
      - "deploy/ai-coding-standalone-dev/gpt02_issue159_positive_release_broker.py"
      - "deploy/ai-coding-standalone-dev/gpt02_issue159_bridge_handoff_preflight.py"
      - "deploy/ai-coding-standalone-dev/gpt02_issue159_exact_bridge_stage.py"
      - "artifacts/api-server/src/services/localCodingControlBridgeService.ts"
      - "artifacts/api-server/src/services/gpt02RecoveryGenericClaimQuarantine.ts"
      - "artifacts/api-server/src/services/__tests__/gpt02RecoveryGenericClaimQuarantine.test.ts"
      - "scripts/dev/prepare_gpt02_issue159_approval_request.py"
      - "scripts/dev/test_gpt02_issue159_approval_request_prepare.py"
      - "scripts/dev/test_gpt02_issue159_positive_permit_pg.py"
      - "scripts/dev/test_gpt02_issue159_positive_permit_handoff.py"
      - "scripts/dev/test_gpt02_issue159_positive_release_broker.py"
      - "scripts/dev/test_gpt02_issue159_bridge_handoff_preflight.py"
      - "scripts/dev/test_gpt02_issue159_exact_bridge_stage.py"
      - "scripts/dev-gpt02-issue159-release-authorization.mjs"
      - "scripts/dev-gpt02-issue159-release-authorization.test.mjs"
      - "scripts/dev-gpt02-issue159-claim-admission.mjs"
      - "scripts/dev-gpt02-issue159-claim-admission.test.mjs"
      - "scripts/dev-gpt02-gateway-bridge.mjs"
      - "scripts/dev-gpt02-gateway-bridge.test.mjs"
      - ".github/workflows/gpt02-issue159-positive-permit-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed source (no deploy)
        uses: actions/checkout@v4
      - name: Disposable PostgreSQL 16 one-use ledger regressions
        run: python3 scripts/dev/test_gpt02_issue159_positive_permit_pg.py
      - name: Assert no runtime deployment path
        run: |
          test ! -f scripts/dev/gpt02_issue159_positive_permit_apply_live.py
          echo "NO_LIVE_MIGRATION_NO_DEPLOY"

  existing-verifier-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed source (no deploy)
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned verification dependency
        run: python3 -m pip install --no-cache-dir cryptography==50.0.2
      - name: Verify pinned existing four-signature verifier handoff
        env:
          PYTHONPATH: "deploy/ai-coding-standalone-dev:scripts/dev"
        run: |
          set -euo pipefail
          python3 scripts/dev/test_gpt02_issue159_positive_permit_handoff.py -q
          python3 scripts/dev/test_gpt02_issue159_positive_release_broker.py -q
          python3 scripts/dev/test_gpt02_issue159_bridge_handoff_preflight.py -q
          python3 scripts/dev/test_gpt02_issue159_exact_bridge_stage.py -q
          python3 scripts/dev/test_gpt02_issue159_approval_request_prepare.py -q
          python3 -m py_compile \
            deploy/ai-coding-standalone-dev/gpt02_issue159_positive_permit_handoff.py \
            deploy/ai-coding-standalone-dev/gpt02_issue159_positive_release_broker.py \
            deploy/ai-coding-standalone-dev/gpt02_issue159_bridge_handoff_preflight.py \
            deploy/ai-coding-standalone-dev/gpt02_issue159_exact_bridge_stage.py \
            scripts/dev/test_gpt02_issue159_positive_permit_handoff.py \
            scripts/dev/test_gpt02_issue159_positive_release_broker.py \
            scripts/dev/test_gpt02_issue159_bridge_handoff_preflight.py \
            scripts/dev/test_gpt02_issue159_exact_bridge_stage.py \
            scripts/dev/prepare_gpt02_issue159_approval_request.py \
            scripts/dev/test_gpt02_issue159_approval_request_prepare.py
      - name: Preserve no-grant no-dispatch boundary
        run: |
          set -euo pipefail
          grep -Fq 'releaseDecision": "NO_GO"' \
            deploy/ai-coding-standalone-dev/gpt02_issue159_positive_permit_handoff.py
          ! grep -Eq 'dispatchPermitted": True|authorizationGranted": True|signingPermitted": True' \
            deploy/ai-coding-standalone-dev/gpt02_issue159_positive_permit_handoff.py

  custody-unit-source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
      - name: Assert reader boot gate and each signer's own explicit opt-in
        run: |
          set -euo pipefail
          python3 scripts/dev/test_gpt02_issue159_issuer_reader_sysusers.py -q
          test ! -f scripts/dev/gpt02_issue159_issuer_reader_install_credential_live.py
          echo "PASS_CUSTODY_STARTUP_GUARDS_NO_CREDENTIAL_ACTIVATION"

  synthetic-signed-release-to-existing-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
      - name: Verify signed release contract and existing once-only gateway
        run: |
          set -euo pipefail
          node --test scripts/dev-gpt02-issue159-release-authorization.test.mjs
          node --test scripts/dev-gpt02-issue159-claim-admission.test.mjs
          node --test scripts/dev-gpt02-gateway-bridge.test.mjs
      - name: Reject any release adapter network/worker side effects
        run: |
          set -euo pipefail
          ! grep -Eq 'dispatchOnce\(|gateway\.send\(' scripts/dev-gpt02-issue159-release-authorization.mjs
          ! grep -Eq 'dispatchOnce\(|gateway\.send\(' scripts/dev-gpt02-issue159-claim-admission.mjs
          echo "NO_ACTUAL_GATEWAY_DISPATCH_OR_RELEASE_CREDENTIALS"
