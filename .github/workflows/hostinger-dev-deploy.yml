name: Hostinger DEV Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy AI Core DEV (isolated VPS)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 28
    env:
      DEV_DOMAIN: dev-aicore.cstlogistic.co.id
      PROD_DOMAIN: aicore.cstlogistic.co.id
      DEV_VPS_IP: 72.61.210.205
      EXPECTED_SHA: ${{ github.sha }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - name: Require current develop commit before any DNS action
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/develop | awk '{print $1}')"
          test "$current" = "$EXPECTED_SHA" || {
            echo "::error::Stale develop commit; refusing DEV promotion"; exit 1;
          }
          echo "dev_target_sha=$EXPECTED_SHA"

      - name: Wait for CI-gated VPS DEV build and exact release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 105); do
            rm -f /tmp/vps-dev.headers /tmp/vps-dev.json
            code="$(curl --silent --show-error --connect-timeout 5 --max-time 9 \
              --resolve "$DEV_DOMAIN:443:$DEV_VPS_IP" \
              -D /tmp/vps-dev.headers -o /tmp/vps-dev.json \
              -w '%{http_code}' "https://$DEV_DOMAIN/api/healthz" || true)"
            sha="$(awk -F': ' 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2);print $2}' \
              /tmp/vps-dev.headers 2>/dev/null | tail -n1)"
            if [[ "$code" == 200 && "$sha" == "$EXPECTED_SHA" ]] &&
               jq -e '.status == "ok"' /tmp/vps-dev.json >/dev/null; then
              echo "VPS_DEV_SHA=PASS sha=$sha"
              exit 0
            fi
            if (( attempt % 12 == 0 )); then
              echo "vps_dev_wait=$attempt http=$code current_sha=$sha expected_sha=$EXPECTED_SHA"
            fi
            sleep 10
          done
          echo "::error::VPS DEV did not converge to current develop after CI."
          exit 1

      - name: Check isolated DEV frontend, protected jobs and unchanged production
        shell: bash
        run: |
          set -euo pipefail
          base="https://$DEV_DOMAIN"
          pin="--resolve $DEV_DOMAIN:443:$DEV_VPS_IP"
          html_code="$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
            $pin -o /tmp/dev-index.html -w '%{http_code}' "$base/" || true)"
          test "$html_code" = 200 && grep -qi '<html' /tmp/dev-index.html
          asset="$(grep -oE '/assets/[^"]+\.js' /tmp/dev-index.html | head -n 1 || true)"
          test -n "$asset" || { echo "::error::DEV static JS asset missing"; exit 1; }
          curl --fail --silent --show-error --connect-timeout 5 --max-time 12 \
            $pin -o /dev/null "$base$asset"
          anon="$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
            $pin -o /dev/null -w '%{http_code}' "$base/api/dev-center/jobs" || true)"
          [[ "$anon" == 401 || "$anon" == 403 ]] ||
            { echo "::error::DEV anonymous dashboard authorization failed http=$anon"; exit 1; }

          prod_before="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 12 \
            -D /tmp/prod.headers -o /tmp/prod.json "https://$PROD_DOMAIN/api/healthz")"
          jq -e '.status == "ok"' /tmp/prod.json >/dev/null
          prod_sha="$(awk -F': ' 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2);print $2}' \
            /tmp/prod.headers | tail -n1)"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$prod_sha" = "$current_main" ||
            { echo "::error::PROD no longer runs exact main; DNS switch blocked"; exit 1; }
          echo "DEV_ISOLATION_SMOKE=PASS asset=200 anonymous=$anon prod_sha=$prod_sha"

      - name: Change only DEV A record after verified independent VPS release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN" ||
            { echo "::error::Hostinger DNS API credentials unavailable"; exit 1; }
          dns="https://developers.hostinger.com/api/dns/v1/zones/cstlogistic.co.id"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$dns" -o /tmp/current-zone.json
          jq -e 'type=="array"' /tmp/current-zone.json >/dev/null
          # A CNAME/AAAA on DEV could route some users to a different application.
          # Do not silently delete or replace unrelated record types.
          jq -e 'all(.[]; .name != "dev-aicore" or .type == "A")' \
            /tmp/current-zone.json >/dev/null ||
            { echo "::error::Ambiguous DEV DNS record types"; exit 1; }
          jq -n --arg ip "$DEV_VPS_IP" \
            '{overwrite:true,zone:[{name:"dev-aicore",type:"A",ttl:300,
            records:[{content:$ip}]}]}' > /tmp/new-zone.json
          curl --fail --silent --show-error --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST --data-binary @/tmp/new-zone.json "$dns/validate" -o /dev/null
          current_ip="$(jq -r '[.[] | select(.name=="dev-aicore" and .type=="A") |
            .records[]?.content] | unique | join(",")' /tmp/current-zone.json)"
          if [[ "$current_ip" != "$DEV_VPS_IP" ]]; then
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -X PUT --data-binary @/tmp/new-zone.json "$dns" -o /dev/null
            echo "DEV_DNS_UPDATED=PASS record=dev-aicore type=A"
          else
            echo "DEV_DNS_ALREADY_CORRECT=PASS"
          fi

      - name: Verify authoritative DNS and public DEV exact SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            for ns in ns1.dns-parking.com ns2.dns-parking.com; do
              resolved="$(dig @"$ns" +short A "$DEV_DOMAIN" | sort -u)"
              if [[ "$resolved" != "$DEV_VPS_IP" ]]; then
                echo "Waiting for $ns DEV DNS propagation attempt=$attempt"
                sleep 10
                continue 2
              fi
            done
            rm -f /tmp/public-dev.headers /tmp/public-dev.json
            code="$(curl --silent --show-error --connect-timeout 6 --max-time 15 \
              -D /tmp/public-dev.headers -o /tmp/public-dev.json -w '%{http_code}' \
              "https://$DEV_DOMAIN/api/healthz" || true)"
            live_sha="$(awk -F': ' 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2);print $2}' \
              /tmp/public-dev.headers | tail -n1)"
            if [[ "$code" == 200 && "$live_sha" == "$EXPECTED_SHA" ]] &&
               jq -e '.status == "ok"' /tmp/public-dev.json >/dev/null; then
              echo "DEV_E2E_PUBLIC=PASS sha=$live_sha dns=$DEV_VPS_IP"
              exit 0
            fi
            echo "DEV_PUBLIC_WAIT attempt=$attempt http=$code"
            sleep 10
          done
          echo "::error::DEV DNS or public exact-release SHA failed."
          exit 1
