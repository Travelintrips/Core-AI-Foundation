name: Hostinger DNS WWW Canary

on:
  push:
    branches:
      - infra/hostinger-runtime-cleanup-20261021

permissions:
  contents: read

jobs:
  dns-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Validate and point DEV www to redirect VPS
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_API_TOKEN:-}" || { echo "HOSTINGER_API_TOKEN missing"; exit 2; }
          base="https://developers.hostinger.com/api"
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          zone="cstlogistic.co.id"
          name="www.dev-bizportal"
          ip="72.61.210.205"

          body=$(jq -nc --arg n "$name" --arg ip "$ip"             '{overwrite:true,zone:[{name:$n,type:"A",ttl:300,records:[{content:$ip}]}]}')

          vcode=$(curl -sS --connect-timeout 8 --max-time 25             -X POST -H "$auth" -H "Content-Type: application/json"             --data-binary "$body" -o /tmp/validate.json -w "%{http_code}"             "$base/dns/v1/zones/$zone/validate") || vcode=000
          echo "validate_http=$vcode"
          cat /tmp/validate.json | jq -c 'if type=="object" then with_entries(select(.key|test("token|secret|key|password|auth";"i")|not)) else . end'
          [ "$vcode" = "200" ]

          ucode=$(curl -sS --connect-timeout 8 --max-time 25             -X PUT -H "$auth" -H "Content-Type: application/json"             --data-binary "$body" -o /tmp/update.json -w "%{http_code}"             "$base/dns/v1/zones/$zone") || ucode=000
          echo "update_http=$ucode"
          cat /tmp/update.json | jq -c 'if type=="object" then with_entries(select(.key|test("token|secret|key|password|auth";"i")|not)) else . end'
          [ "$ucode" = "200" ]

          sleep 5
          curl -fsS --connect-timeout 8 --max-time 25 -H "$auth" "$base/dns/v1/zones/$zone"             | jq -c --arg n "$name" '[.[] | select(.name==$n) | {name,type,ttl,records}]'
