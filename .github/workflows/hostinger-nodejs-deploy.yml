name: Hostinger Node.js Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI Verify
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

# Serialize releases but do not terminate an active Hostinger deploy mid-restart.
# Stale SHA checks inside the job safely skip superseded queued releases.
concurrency:
  group: hostinger-nodejs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Hostinger Node.js (${{ matrix.site }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: internal
            domain: aicore.cstlogistic.co.id
          - site: customer
            domain: aifront.cstlogistic.co.id
        # coding.cstlogistic.co.id is a parked-domain alias of the internal
        # aicore website and therefore follows the internal deployment.
    env:
      HOSTINGER_API_BASE: https://developers.hostinger.com/api
      HOSTINGER_DOMAIN: ${{ matrix.domain }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

    steps:
      - name: Checkout exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Reject stale release trigger
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "latest_main_sha=$latest_main_sha"
          echo "expected_sha=$EXPECTED_SHA"
          if [ "$latest_main_sha" != "$EXPECTED_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale deploy trigger."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect whether runtime deployment is required
        id: deploy_scope
        if: steps.freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            echo "runtime_deploy=RUN reason=manual_dispatch"
            exit 0
          fi

          # Compare against the release that is actually live, not merely
          # EXPECTED_SHA^1. Empty trigger commits can otherwise hide runtime
          # changes that have never reached production.
          health="https://$HOSTINGER_DOMAIN/api/healthz"
          rm -f /tmp/deploy-scope.headers /tmp/deploy-scope.body
          curl --http1.1 --silent --show-error --connect-timeout 5 --max-time 10 \
            -D /tmp/deploy-scope.headers -o /tmp/deploy-scope.body \
            -H "Accept: application/json" \
            -H "User-Agent: CST-AI-Core-Deploy-Scope/1.0" \
            "$health" || true
          base_sha=$(awk -F': ' 'tolower($1)=="x-cst-commit-sha" {gsub("\\r","",$2); print $2}' /tmp/deploy-scope.headers | tail -n1)

          if [ -z "$base_sha" ]; then
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=live_release_unknown_fail_safe" >> "$GITHUB_OUTPUT"
            echo "runtime_deploy=RUN reason=live_release_unknown_fail_safe"
            exit 0
          fi

          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base_sha" || true
          fi
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            echo "reason=live_release_not_in_git_fail_safe" >> "$GITHUB_OUTPUT"
            echo "runtime_deploy=RUN reason=live_release_not_in_git_fail_safe live_sha=$base_sha"
            exit 0
          fi

          echo "runtime_deploy_live_sha=$base_sha expected_sha=$EXPECTED_SHA"
          changed_files=$(git diff --name-only "$base_sha" "$EXPECTED_SHA")
          printf 'runtime_deploy_changed_files=\n%s\n' "$changed_files"

          deploy_required=false
          reason="deploy_neutral_only"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/*|docs/*|*.md|*.mdx|*.txt|*/__tests__/*|*.test.ts|*.test.tsx|*.test.mjs|*.spec.ts|*.spec.tsx)
                ;;
              *)
                deploy_required=true
                reason="runtime_path:$file"
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "deploy_required=$deploy_required" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "runtime_deploy=$([ "$deploy_required" = "true" ] && echo RUN || echo SKIP) reason=$reason"

      - name: Give native Hostinger deploy a short grace period
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true'
        id: native
        shell: bash
        run: |
          set -euo pipefail
          health="https://$HOSTINGER_DOMAIN/api/healthz"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          # When API fallback credentials are unavailable, native Hostinger Git
          # deployment is the only valid path. Give it a realistic bounded
          # window before declaring failure instead of producing a false alarm.
          if [ -z "${HOSTINGER_API_TOKEN:-}" ]; then
            max_attempts=30
            echo "native_grace_mode=extended_no_api_fallback attempts=$max_attempts"
          else
            max_attempts=6
            echo "native_grace_mode=short_with_api_fallback attempts=$max_attempts"
          fi
          for attempt in $(seq 1 "$max_attempts"); do
            rm -f /tmp/native.headers /tmp/native.body
            curl --http1.1 --silent --show-error --connect-timeout 5 --max-time 10 \
              -D /tmp/native.headers -o /tmp/native.body \
              -H "Accept: application/json" \
              -H "User-Agent: CST-AI-Core-Native-Deploy-Grace/1.0" \
              "$health" || true
            live_sha=$(awk -F': ' 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2); print $2}' /tmp/native.headers | tail -n1)
            echo "native_attempt=$attempt live_sha=${live_sha:-missing} expected_sha=$EXPECTED_SHA"
            if [ "$live_sha" = "$EXPECTED_SHA" ] && grep -q '"status":"ok"' /tmp/native.body; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "native_deploy=PASS"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep 10
            fi
          done
          if [ -n "${HOSTINGER_API_TOKEN:-}" ]; then
            echo "::notice::Native Hostinger deploy did not expose the expected SHA within the short grace period; using API fallback."
          else
            echo "::error::Native Hostinger deploy did not expose the expected SHA within the extended grace period, and HOSTINGER_API_TOKEN is unavailable for API fallback."
          fi

      - name: Validate Hostinger deployment credentials
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOSTINGER_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret HOSTINGER_API_TOKEN is not configured."
            exit 1
          fi
          test -n "$HOSTINGER_DOMAIN"

      - name: Resolve Hostinger website
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true'
        id: website
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $HOSTINGER_API_TOKEN"             "$HOSTINGER_API_BASE/hosting/v1/websites?per_page=100"             -o /tmp/websites.json

          username=$(jq -r --arg domain "$HOSTINGER_DOMAIN"             '.data[] | select(.domain == $domain and .website_type == "nodejs" and .is_enabled == true) | .username'             /tmp/websites.json | head -n1)

          if [ -z "$username" ] || [ "$username" = "null" ]; then
            echo "::error::Enabled Node.js website not found for $HOSTINGER_DOMAIN."
            exit 1
          fi

          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "domain=$HOSTINGER_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "website=$HOSTINGER_DOMAIN username=$username"

      - name: Create source archive
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true'
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive_name="aicore-${EXPECTED_SHA}.zip"
          archive_path="/tmp/$archive_name"
          git archive --format=zip --output="$archive_path" HEAD
          printf '%s\n' "$EXPECTED_SHA" > /tmp/.cst-build-sha
          zip -q -j "$archive_path" /tmp/.cst-build-sha
          echo "name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$archive_path")" >> "$GITHUB_OUTPUT"

      - name: Upload source archive to Hostinger
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true'
        id: upload
        shell: bash
        env:
          HOSTINGER_USERNAME: ${{ steps.website.outputs.username }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        run: |
          set -euo pipefail
          jq -n             --arg username "$HOSTINGER_USERNAME"             --arg domain "$HOSTINGER_DOMAIN"             '{username:$username,domain:$domain}' > /tmp/upload-url-request.json

          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $HOSTINGER_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/upload-url-request.json             "$HOSTINGER_API_BASE/hosting/v1/files/upload-urls"             -o /tmp/upload-url.json

          upload_base=$(jq -r '.url' /tmp/upload-url.json)
          auth_key=$(jq -r '.auth_key' /tmp/upload-url.json)
          rest_auth_key=$(jq -r '.rest_auth_key' /tmp/upload-url.json)
          if [ -z "$upload_base" ] || [ "$upload_base" = "null" ]; then
            echo "::error::Hostinger did not return an upload URL."
            exit 1
          fi

          echo "::add-mask::$auth_key"
          echo "::add-mask::$rest_auth_key"

          size=$(stat -c%s "$ARCHIVE_PATH")
          target="${upload_base%/}/$ARCHIVE_NAME?override=true"

          create_code=$(curl --silent --show-error -o /tmp/tus-create.body -D /tmp/tus-create.headers -w "%{http_code}"             -X POST             -H "X-Auth: $auth_key"             -H "X-Auth-Rest: $rest_auth_key"             -H "Tus-Resumable: 1.0.0"             -H "Upload-Length: $size"             -H "Upload-Offset: 0"             "$target")
          if [ "$create_code" != "201" ]; then
            cat /tmp/tus-create.body || true
            echo "::error::Hostinger TUS create returned HTTP $create_code."
            exit 1
          fi

          # Hostinger's official upload API requires PATCH to the SAME
          # file URL used for POST (including ?override=true). The Location
          # header is not the documented PATCH target for this API.
          upload_patch_url="$target"

          # Upload in bounded TUS chunks to avoid resets on large archives.
          # On a transport failure, HEAD the server offset before resending;
          # never blindly repeat a potentially accepted PATCH.
          offset=0
          chunk_size=$((4 * 1024 * 1024))
          retries=0
          while [ "$offset" -lt "$size" ]; do
            bytes=$((size - offset))
            if [ "$bytes" -gt "$chunk_size" ]; then bytes="$chunk_size"; fi
            python3 - "$ARCHIVE_PATH" "$offset" "$bytes" /tmp/tus-chunk.bin <<'PY'
          import sys
          source, offset, size, target = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          with open(source, "rb") as source_file, open(target, "wb") as target_file:
              source_file.seek(offset)
              data = source_file.read(size)
              if len(data) != size:
                  raise SystemExit("short archive read")
              target_file.write(data)
          PY
            patch_code=$(curl --connect-timeout 10 --max-time 90 --silent --show-error \
              -o /tmp/tus-patch.body -D /tmp/tus-patch.headers -w "%{http_code}" \
              -X PATCH -H "X-Auth: $auth_key" -H "X-Auth-Rest: $rest_auth_key" \
              -H "Tus-Resumable: 1.0.0" \
              -H "Content-Type: application/offset+octet-stream" \
              -H "Upload-Offset: $offset" \
              --data-binary @/tmp/tus-chunk.bin "$upload_patch_url") || patch_code=000
            if [ "$patch_code" = "204" ]; then
              next_offset=$(awk -F': ' 'tolower($1)=="upload-offset" {gsub("\r","",$2); print $2}' /tmp/tus-patch.headers | tail -n1)
              if ! [[ "$next_offset" =~ ^[0-9]+$ ]] || [ "$next_offset" -ne "$((offset + bytes))" ]; then
                echo "::error::Unexpected TUS PATCH offset: ${next_offset:-missing}."
                exit 1
              fi
              offset="$next_offset"
              retries=0
              echo "tus_upload_offset=$offset total=$size"
              continue
            fi
            # A failed PATCH may have been accepted; query its true offset.
            head_code=$(curl --connect-timeout 10 --max-time 20 --silent --show-error \
              -o /dev/null -D /tmp/tus-head.headers -w "%{http_code}" \
              -I -H "X-Auth: $auth_key" -H "X-Auth-Rest: $rest_auth_key" \
              -H "Tus-Resumable: 1.0.0" "$upload_patch_url") || head_code=000
            confirmed_offset=$(awk -F': ' 'tolower($1)=="upload-offset" {gsub("\r","",$2); print $2}' /tmp/tus-head.headers | tail -n1)
            if [ "$head_code" != "200" ] || ! [[ "$confirmed_offset" =~ ^[0-9]+$ ]] || [ "$confirmed_offset" -lt "$offset" ] || [ "$confirmed_offset" -gt "$((offset + bytes))" ]; then
              echo "::error::TUS PATCH failed (HTTP $patch_code); server offset could not be verified (HTTP $head_code)."
              exit 1
            fi
            if [ "$confirmed_offset" -gt "$offset" ]; then
              offset="$confirmed_offset"
              retries=0
            else
              retries=$((retries + 1))
              if [ "$retries" -ge 3 ]; then
                echo "::error::TUS upload failed after three verified retries (HTTP $patch_code)."
                exit 1
              fi
              sleep "$((retries * 2))"
            fi
          done
          rm -f /tmp/tus-chunk.bin
          echo "archive_uploaded=$ARCHIVE_NAME bytes=$size"

      - name: Resolve Node.js build settings
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true'
        id: settings
        shell: bash
        env:
          HOSTINGER_USERNAME: ${{ steps.website.outputs.username }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail
          base="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds"

          settings_code=$(curl --silent --show-error -o /tmp/build-settings.json -w "%{http_code}"             -H "Authorization: Bearer $HOSTINGER_API_TOKEN"             "$base/settings")

          if [ "$settings_code" != "200" ]; then
            echo "Stored settings unavailable (HTTP $settings_code); auto-detecting from archive."
            curl --fail-with-body --silent --show-error               -H "Authorization: Bearer $HOSTINGER_API_TOKEN"               "$base/settings/from-archive?archive_path=$ARCHIVE_NAME"               -o /tmp/build-settings.json
          fi

          jq '{
            node_version,
            app_type,
            root_directory,
            output_directory,
            build_script,
            entry_file,
            package_manager
          }' /tmp/build-settings.json > /tmp/build-settings.normalized.json

          if ! jq -e '.node_version != null and .app_type != null and .package_manager != null' /tmp/build-settings.normalized.json >/dev/null; then
            echo "::error::Hostinger Node.js build settings are incomplete."
            cat /tmp/build-settings.json
            exit 1
          fi

          cat /tmp/build-settings.normalized.json

      - name: Reconfirm latest main before fallback build
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true'
        id: fallback_freshness
        shell: bash
        run: |
          set -euo pipefail
          latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "latest_main_sha=$latest_main_sha"
          echo "expected_sha=$EXPECTED_SHA"
          if [ "$latest_main_sha" != "$EXPECTED_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping API fallback because main advanced before the Hostinger build started."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Node.js deployment build
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true' && steps.fallback_freshness.outputs.stale != 'true'
        id: build
        shell: bash
        env:
          HOSTINGER_USERNAME: ${{ steps.website.outputs.username }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail
          base="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds"

          jq             --arg archive "$ARCHIVE_NAME"             '. + {source_type:"archive",source_options:{archive_path:$archive}}'             /tmp/build-settings.normalized.json > /tmp/build-request.json

          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $HOSTINGER_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/build-request.json             "$base"             -o /tmp/build-start.json

          uuid=$(jq -r '.uuid' /tmp/build-start.json)
          if [ -z "$uuid" ] || [ "$uuid" = "null" ]; then
            echo "::error::Hostinger did not return a build UUID."
            cat /tmp/build-start.json
            exit 1
          fi
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "build_uuid=$uuid"

      - name: Wait for Node.js deployment
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true' && steps.fallback_freshness.outputs.stale != 'true'
        shell: bash
        env:
          HOSTINGER_USERNAME: ${{ steps.website.outputs.username }}
          BUILD_UUID: ${{ steps.build.outputs.uuid }}
        run: |
          set -euo pipefail
          base="$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds"

          for attempt in $(seq 1 90); do
            curl --fail-with-body --silent --show-error               -H "Authorization: Bearer $HOSTINGER_API_TOKEN"               "$base/$BUILD_UUID"               -o /tmp/build-status.json

            state=$(jq -r '.state' /tmp/build-status.json)
            echo "build_attempt=$attempt state=$state"

            if [ "$state" = "completed" ]; then
              exit 0
            fi
            if [ "$state" = "failed" ]; then
              curl --silent --show-error                 -H "Authorization: Bearer $HOSTINGER_API_TOKEN"                 "$base/$BUILD_UUID/logs" || true
              echo
              curl --silent --show-error                 -H "Authorization: Bearer $HOSTINGER_API_TOKEN"                 "$base/$BUILD_UUID/analysis" || true
              echo
              exit 1
            fi
            sleep 10
          done

          echo "::error::Hostinger Node.js build timed out."
          exit 1

      - name: Restart Node.js application
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true' && steps.fallback_freshness.outputs.stale != 'true'
        shell: bash
        env:
          HOSTINGER_USERNAME: ${{ steps.website.outputs.username }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $HOSTINGER_API_TOKEN"             "$HOSTINGER_API_BASE/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/server/restart"

      - name: Verify exact live release
        id: verify_release
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required == 'true' && steps.native.outputs.ready != 'true' && steps.fallback_freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          health="https://$HOSTINGER_DOMAIN/api/healthz"
          consecutive_unknown=0
          for attempt in $(seq 1 12); do
            rm -f /tmp/live.headers /tmp/live.body
            curl --http1.1 --silent --show-error --connect-timeout 5 --max-time 10 \
              -D /tmp/live.headers -o /tmp/live.body \
              -H "Accept: application/json" \
              -H "User-Agent: CST-AI-Core-Direct-Deploy/1.0" \
              "$health" || true
            live_sha=$(awk -F': ' 'tolower($1)=="x-cst-commit-sha" {gsub("\r","",$2); print $2}' /tmp/live.headers 2>/dev/null | tail -n1)
            echo "verify_attempt=$attempt live_sha=${live_sha:-missing} expected_sha=$EXPECTED_SHA"
            if [ "$live_sha" = "$EXPECTED_SHA" ] && grep -q '"status":"ok"' /tmp/live.body 2>/dev/null; then
              echo "exact_release=PASS"
              exit 0
            fi
            if [ "$live_sha" = "unknown" ]; then
              consecutive_unknown=$((consecutive_unknown + 1))
              if [ "$consecutive_unknown" -ge 4 ]; then
                echo "::error::Live release repeatedly reports unknown SHA; check embedded .cst-build-sha."
                exit 1
              fi
            else
              consecutive_unknown=0
            fi
            [ "$attempt" -eq 12 ] || sleep 10
          done
          echo "::error::Production did not expose the exact deployed SHA."
          exit 1


      - name: Skip runtime deployment for deploy-neutral change
        id: neutral
        if: steps.freshness.outputs.stale != 'true' && steps.deploy_scope.outputs.deploy_required != 'true'
        shell: bash
        run: |
          echo "::notice::Skipping Hostinger application redeploy because this commit changes deploy-neutral files only."
          echo "runtime_deploy=SKIPPED reason=${{ steps.deploy_scope.outputs.reason }}"

      - name: Assert verified deployment outcome
        if: always()
        shell: bash
        env:
          STALE: ${{ steps.freshness.outputs.stale }}
          DEPLOY_REQUIRED: ${{ steps.deploy_scope.outputs.deploy_required }}
          NATIVE_READY: ${{ steps.native.outputs.ready }}
          FALLBACK_STALE: ${{ steps.fallback_freshness.outputs.stale }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify_release.outcome }}
          NEUTRAL_RESULT: ${{ steps.neutral.outcome }}
        run: |
          set -euo pipefail
          if [ "$STALE" = "true" ] || [ "$FALLBACK_STALE" = "true" ]; then
            echo "DEPLOY_SUPERSEDED: newer main commit exists; no deployment claimed." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::DEPLOY_SUPERSEDED — this run must not be reported as DEPLOYED."
            exit 0
          fi
          if [ "$DEPLOY_REQUIRED" = "true" ]; then
            if [ "$NATIVE_READY" = "true" ] || [ "$VERIFY_RESULT" = "success" ]; then
              echo "DEPLOYED: exact SHA and healthy production verified." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::DEPLOY_NOT_VERIFIED: runtime deployment required but exact live SHA was not verified."
            exit 1
          fi
          if [ "$DEPLOY_REQUIRED" = "false" ] && [ "$NEUTRAL_RESULT" = "success" ]; then
            echo "DEPLOY_SKIPPED_NEUTRAL: runtime unchanged; no new deployment claimed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::DEPLOY_UNCLASSIFIED: no valid deployment or skip result."
          exit 1
