name: GPT02 Issuer Reader Health Cache (DEV only)
on:
  pull_request:
    paths:
      - 'scripts/dev/gpt02-issuer-reader-runtime.ts'
      - 'scripts/dev/test-gpt02-issuer-reader-health-cache.mjs'
      - '.github/workflows/gpt02-issuer-reader-health-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concurrency-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build reader from canonical source
        run: bash scripts/dev/build-gpt02-issuer-reader-runtime.sh
      - name: Verify health caching and fail-closed issuer evidence
        run: node scripts/dev/test-gpt02-issuer-reader-health-cache.mjs
