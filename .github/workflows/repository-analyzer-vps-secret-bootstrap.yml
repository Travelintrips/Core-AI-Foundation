name: Repository Analyzer VPS Secret Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: repository-analyzer-secret-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap isolated analyzer DB secret
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Validate deployment configuration
        env:
          PROVIDER: ${{ vars.ANALYZER_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.ANALYZER_GCP_SERVICE_ACCOUNT }}
          VPS_HOST: ${{ vars.ANALYZER_VPS_HOST }}
          VPS_USER: ${{ vars.ANALYZER_VPS_USER }}
          SSH_KEY: ${{ secrets.ANALYZER_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ANALYZER_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for value in "$PROVIDER" "$SERVICE_ACCOUNT" "$VPS_HOST" "$VPS_USER" "$SSH_KEY" "$KNOWN_HOSTS"; do
            if [ -z "$value" ]; then echo "::error::Missing required analyzer deployment configuration"; exit 1; fi
          done

      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.ANALYZER_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.ANALYZER_GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deliver secret through pinned SSH connection
        env:
          VPS_HOST: ${{ vars.ANALYZER_VPS_HOST }}
          VPS_USER: ${{ vars.ANALYZER_VPS_USER }}
          SSH_KEY: ${{ secrets.ANALYZER_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ANALYZER_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/analyzer_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/analyzer_key ~/.ssh/known_hosts
          # No set -x, stdout secret printing, or SSH host key auto-acceptance.
          gcloud secrets versions access latest \
            --project=aicore-505614 \
            --secret=aicore-repository-analyzer-db \
          | ssh -i ~/.ssh/analyzer_key \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              "$VPS_USER@$VPS_HOST" \
              'umask 077; mkdir -p /root/.aicore-analyzer; cat > /root/.aicore-analyzer/database-url; chmod 600 /root/.aicore-analyzer/database-url'
          ssh -i ~/.ssh/analyzer_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            'test -s /root/.aicore-analyzer/database-url && test "$(stat -c %a /root/.aicore-analyzer/database-url)" = 600'
          echo "Analyzer secret installed; no database connection or job execution attempted."
