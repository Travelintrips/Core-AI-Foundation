name: Hostinger DEV Discovery

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/hostinger-dev-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover safe Hostinger metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOSTINGER_API_BASE: https://developers.hostinger.com/api
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Detect Hostinger API availability
        id: token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOSTINGER_API_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOSTINGER_API_TOKEN is not exposed to the develop branch; skipping optional Hostinger metadata discovery."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: List CST websites and Node.js settings
        if: steps.token.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$HOSTINGER_API_BASE/hosting/v1/websites?per_page=100" \
            -o /tmp/websites.json

          echo "=== CST_WEBSITES ==="
          jq -r '.data[]
            | select(.domain | endswith("cstlogistic.co.id"))
            | [.domain, (.username // ""), (.order_id|tostring), (.website_type // ""), (.is_enabled|tostring)]
            | @tsv' /tmp/websites.json | sort

          for domain in aicore.cstlogistic.co.id aifront.cstlogistic.co.id; do
            username=$(jq -r --arg domain "$domain" '.data[] | select(.domain == $domain) | .username // empty' /tmp/websites.json | head -n1)
            if [ -z "$username" ]; then
              echo "PROD_SITE_MISSING=$domain"
              continue
            fi

            base="$HOSTINGER_API_BASE/hosting/v1/accounts/$username/websites/$domain/nodejs/builds"
            echo "=== BUILD_SETTINGS $domain ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              "$base/settings" | jq '{node_version,app_type,root_directory,output_directory,build_script,entry_file,package_manager}'

            echo "=== ENV_KEYS $domain ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              "$base/settings/env" | jq -r '.[].key' | sort
          done


      - name: Discover independent hosting orders and VPS capacity (read only)
        if: steps.token.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Do not print API responses, access tokens, subscriptions, IPs or credentials.
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$HOSTINGER_API_BASE/hosting/v1/orders?per_page=100" \
            -o /tmp/dev-hosting-orders.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$HOSTINGER_API_BASE/hosting/v1/websites?per_page=100" \
            -o /tmp/dev-hosting-websites.json
          vps_code=$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -w "%{http_code}" -o /tmp/dev-hosting-vps.json \
            "$HOSTINGER_API_BASE/vps/v1/virtual-machines" || true)
          export HOSTINGER_AUDIT_VPS_STATUS="$vps_code"
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const load = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
          const sites = load("/tmp/dev-hosting-websites.json").data;
          const orders = load("/tmp/dev-hosting-orders.json").data;
          if (!Array.isArray(sites) || !Array.isArray(orders)) {
            throw new Error("HOSTINGER_ORDER_INVENTORY_INVALID");
          }
          const dev = sites.filter(s => s.domain === "dev-aicore.cstlogistic.co.id" && s.is_enabled);
          const prod = sites.filter(s => s.domain === "aicore.cstlogistic.co.id" && s.is_enabled);
          if (dev.length !== 1 || prod.length !== 1) {
            throw new Error("HOSTINGER_DEV_OR_PROD_WEBSITE_AMBIGUOUS");
          }
          const assigned = new Map();
          for (const s of sites) {
            const id = String(s.order_id ?? "");
            assigned.set(id, (assigned.get(id) ?? 0) + 1);
          }
          const prodOrder = String(prod[0].order_id);
          const devOrder = String(dev[0].order_id);
          const active = orders.filter(o => o.status === "active");
          const eligible = active.filter(o => String(o.id) !== prodOrder && !assigned.has(String(o.id)));
          const nonprod = active.filter(o => String(o.id) !== prodOrder);
          const summary = {
            devAndProdShareOrder: prodOrder === devOrder,
            devAndProdShareAccount: dev[0].username === prod[0].username,
            totalHostingOrders: orders.length,
            activeHostingOrders: active.length,
            eligibleUnusedIndependentHostingOrders: eligible.map(o => ({
              orderId: o.id,
              plan: o.plan?.name ?? "unknown",
            })),
            allNonProdActiveHostingOrders: nonprod.map(o => ({
              orderId: o.id,
              plan: o.plan?.name ?? "unknown",
              assignedWebsiteCount: assigned.get(String(o.id)) ?? 0,
            })),
          };
          console.log("HOSTINGER_INDEPENDENT_HOSTING=" + JSON.stringify(summary));
          console.log("HOSTINGER_VPS_QUERY_HTTP=" + process.env.HOSTINGER_AUDIT_VPS_STATUS);
          if (process.env.HOSTINGER_AUDIT_VPS_STATUS === "200") {
            const raw = load("/tmp/dev-hosting-vps.json");
            const vms = Array.isArray(raw) ? raw : Array.isArray(raw.data) ? raw.data : [];
            console.log("HOSTINGER_VPS_SUMMARY=" + JSON.stringify(vms.map(vm => ({
              id: vm.id,
              hostname: vm.hostname,
              plan: vm.plan,
              state: vm.state,
              cpus: vm.cpus,
              memoryMb: vm.memory,
            }))));
          }
          NODE
