name: Hostinger DEV Discovery

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/hostinger-dev-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover safe Hostinger metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOSTINGER_API_BASE: https://developers.hostinger.com/api
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Validate API token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOSTINGER_API_TOKEN:-}" ]; then
            echo "::error::HOSTINGER_API_TOKEN is not configured."
            exit 1
          fi

      - name: List CST websites and Node.js settings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "$HOSTINGER_API_BASE/hosting/v1/websites?per_page=100" \
            -o /tmp/websites.json

          echo "=== CST_WEBSITES ==="
          jq -r '.data[]
            | select(.domain | endswith("cstlogistic.co.id"))
            | [.domain, (.username // ""), (.order_id|tostring), (.website_type // ""), (.is_enabled|tostring)]
            | @tsv' /tmp/websites.json | sort

          for domain in aicore.cstlogistic.co.id aifront.cstlogistic.co.id; do
            username=$(jq -r --arg domain "$domain" '.data[] | select(.domain == $domain) | .username // empty' /tmp/websites.json | head -n1)
            if [ -z "$username" ]; then
              echo "PROD_SITE_MISSING=$domain"
              continue
            fi

            base="$HOSTINGER_API_BASE/hosting/v1/accounts/$username/websites/$domain/nodejs/builds"
            echo "=== BUILD_SETTINGS $domain ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              "$base/settings" | jq '{node_version,app_type,root_directory,output_directory,build_script,entry_file,package_manager}'

            echo "=== ENV_KEYS $domain ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              "$base/settings/env" | jq -r '.[].key' | sort
          done
