name: GPT02 Issue159 Four-Signer Contract

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/services/gpt02Issue159FourSignerContract.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159SignerCustodyPolicy.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159PublicTrustHandoff.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159ApprovalAuthorizerEvidence.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159OperatorAuthorizerEvidence.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159IssuerAuthorizerEvidence.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159SignerBoundaryReadiness.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159FourSignerContract.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159SignerCustodyPolicy.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159PublicTrustHandoff.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159ApprovalAuthorizerEvidence.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159OperatorAuthorizerEvidence.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159IssuerAuthorizerEvidence.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159SignerBoundaryReadiness.test.ts'
      - 'deploy/ai-coding-standalone-dev/gpt02_issue159_approval_intent_schema.sql'
      - 'scripts/dev/gpt02_issue159_approval_store_readiness.py'
      - 'scripts/dev/test_gpt02_issue159_approval_store_readiness.py'
      - 'scripts/dev/gpt02_issue159_approval_intent_reader.py'
      - 'scripts/dev/test_gpt02_issue159_approval_intent_reader.py'
      - '.github/workflows/gpt02-issue159-four-signer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify four independent signer domains and custody policy
        working-directory: artifacts/api-server
        run: >-
          pnpm exec vitest run
          src/services/__tests__/gpt02Issue159FourSignerContract.test.ts
          src/services/__tests__/gpt02Issue159SignerCustodyPolicy.test.ts
          src/services/__tests__/gpt02Issue159PublicTrustHandoff.test.ts
          src/services/__tests__/gpt02Issue159ApprovalAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159OperatorAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159IssuerAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159SignerBoundaryReadiness.test.ts
      - name: Verify approval store readiness contract
        run: |
          python3 scripts/dev/test_gpt02_issue159_approval_store_readiness.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_reader.py
      - name: Targeted contract typecheck
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc --noEmit --skipLibCheck --target ES2022
          --module NodeNext --moduleResolution NodeNext --types node
          src/services/gpt02Issue159FourSignerContract.ts
          src/services/gpt02Issue159SignerCustodyPolicy.ts
          src/services/gpt02Issue159PublicTrustHandoff.ts
          src/services/gpt02Issue159ApprovalAuthorizerEvidence.ts
          src/services/gpt02Issue159OperatorAuthorizerEvidence.ts
          src/services/gpt02Issue159IssuerAuthorizerEvidence.ts
          src/services/gpt02Issue159SignerBoundaryReadiness.ts
