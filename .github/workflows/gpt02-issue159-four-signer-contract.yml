name: GPT02 Issue159 Four-Signer Contract

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/services/gpt02Issue159FourSignerContract.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159SignerCustodyPolicy.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159PublicTrustHandoff.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159ApprovalAuthorizerEvidence.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159OperatorAuthorizerEvidence.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159IssuerAuthorizerEvidence.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159IssuerLedgerReadOnly.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159IssuerReaderPool.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159IssuerTrustedReader.ts'
      - 'artifacts/api-server/src/services/gpt02Issue159IssuerReaderSocketClient.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159IssuerTrustedReader.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159IssuerReaderSocketClient.test.ts'
      - 'artifacts/api-server/src/routes/gpt02-issue159-issuer-reader.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/api-server/src/routes/__tests__/gpt02-issue159-issuer-reader.test.ts'
      - 'artifacts/api-server/src/routes/__tests__/gpt02-issue159-issuer-reader-live.test.ts'
      - 'scripts/dev/gpt02-issuer-reader-runtime.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159IssuerRuntimeDirectory.test.ts'
      - 'deploy/dev-hostinger/Dockerfile'
      - 'scripts/dev/build-gpt02-issuer-reader-runtime.sh'
      - 'deploy/dev-hostinger/docker-compose.yml'
      - 'artifacts/api-server/src/services/gpt02Issue159SignerBoundaryReadiness.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159FourSignerContract.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159SignerCustodyPolicy.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159PublicTrustHandoff.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159ApprovalAuthorizerEvidence.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159OperatorAuthorizerEvidence.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159IssuerAuthorizerEvidence.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159IssuerLedgerReadOnly.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159IssuerReaderPool.test.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159SignerBoundaryReadiness.test.ts'
      - 'deploy/ai-coding-standalone-dev/gpt02_issue159_approval_intent_schema.sql'
      - 'deploy/ai-coding-standalone-dev/gpt02_issue159_approval_intent.py'
      - 'deploy/ai-coding-standalone-dev/gpt02_issue159_approval_http.py'
      - 'deploy/ai-coding-standalone-dev/gpt02_issue159_approval_intent_contract.py'
      - 'scripts/dev/gpt02_issue159_approval_store_readiness.py'
      - 'scripts/dev/test_gpt02_issue159_approval_store_readiness.py'
      - 'scripts/dev/gpt02_issue159_approval_intent_reader.py'
      - 'scripts/dev/test_gpt02_issue159_approval_intent_reader.py'
      - 'scripts/dev/test_gpt02_issue159_approval_intent_writer.py'
      - 'scripts/dev/test_gpt02_issue159_approval_intent_contract.py'
      - 'scripts/dev/test_gpt02_issue159_approval_http.py'
      - 'scripts/dev/test_gpt02_issue159_approval_api_route.py'
      - 'artifacts/api-server/src/services/gpt02Issue159PrivateKeyCustodyContract.ts'
      - 'artifacts/api-server/src/services/__tests__/gpt02Issue159PrivateKeyCustodyContract.test.ts'
      - 'scripts/dev/gpt02_issue159_private_key_custody_readiness.py'
      - 'scripts/dev/test_gpt02_issue159_private_key_custody_readiness.py'
      - 'scripts/dev/gpt02_issue159_signer_operational_readiness.py'
      - 'scripts/dev/test_gpt02_issue159_signer_operational_readiness.py'
      - 'deploy/ai-coding-standalone-dev/gpt02_issue159_signer_runtime.py'
      - 'deploy/ai-coding-standalone-dev/gpt02-issue159-signer@.service'
      - 'deploy/ai-coding-standalone-dev/gpt02-issue159-issuer-reader.service'
      - 'scripts/dev/test_gpt02_issue159_signer_runtime.py'
      - 'scripts/dev/fixtures/supabase-root-ca-2021.crt'
      - '.github/workflows/gpt02-issue159-four-signer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify four independent signer domains and custody policy
        working-directory: artifacts/api-server
        run: >-
          pnpm exec vitest run
          src/services/__tests__/gpt02Issue159FourSignerContract.test.ts
          src/services/__tests__/gpt02Issue159SignerCustodyPolicy.test.ts
          src/services/__tests__/gpt02Issue159PublicTrustHandoff.test.ts
          src/services/__tests__/gpt02Issue159ApprovalAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159OperatorAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159IssuerAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159IssuerLedgerReadOnly.test.ts
          src/services/__tests__/gpt02Issue159IssuerReaderPool.test.ts
          src/services/__tests__/gpt02Issue159PrivateKeyCustodyContract.test.ts
          src/services/__tests__/gpt02Issue159SignerBoundaryReadiness.test.ts
      - name: Verify issuer reader socket and admin API integration
        working-directory: artifacts/api-server
        run: >-
          pnpm exec vitest run
          src/services/__tests__/gpt02Issue159IssuerTrustedReader.test.ts
          src/services/__tests__/gpt02Issue159IssuerReaderSocketClient.test.ts
          src/routes/__tests__/gpt02-issue159-issuer-reader.test.ts
          src/routes/__tests__/gpt02-issue159-issuer-reader-live.test.ts
      - name: Verify DynamicUser runtime directory and Docker socket access contract
        working-directory: artifacts/api-server
        run: pnpm exec vitest run src/services/__tests__/gpt02Issue159IssuerRuntimeDirectory.test.ts
      - name: Build standalone read-only issuer reader runtime
        run: |
          bash -n scripts/dev/build-gpt02-issuer-reader-runtime.sh
          bash scripts/dev/build-gpt02-issuer-reader-runtime.sh
          test -s dist/issuer-reader-runtime/gpt02-issuer-reader-runtime.mjs
          node --check dist/issuer-reader-runtime/gpt02-issuer-reader-runtime.mjs
      - name: Verify API workspace types
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server run typecheck
      - name: Verify approval store readiness contract
        run: |
          python3 scripts/dev/test_gpt02_issue159_approval_store_readiness.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_reader.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_writer.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_contract.py
          python3 scripts/dev/test_gpt02_issue159_private_key_custody_readiness.py
          python3 scripts/dev/test_gpt02_issue159_signer_operational_readiness.py
          python3 scripts/dev/test_gpt02_issue159_signer_runtime.py
          systemd-analyze verify deploy/ai-coding-standalone-dev/gpt02-issue159-issuer-reader.service deploy/ai-coding-standalone-dev/gpt02-issue159-signer@.service
          python3 scripts/dev/test_gpt02_issue159_approval_http.py
          python3 scripts/dev/test_gpt02_issue159_approval_api_route.py
      - name: Targeted contract typecheck
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc --noEmit --skipLibCheck --target ES2022
          --module NodeNext --moduleResolution NodeNext --types node
          src/services/gpt02Issue159FourSignerContract.ts
          src/services/gpt02Issue159SignerCustodyPolicy.ts
          src/services/gpt02Issue159PublicTrustHandoff.ts
          src/services/gpt02Issue159ApprovalAuthorizerEvidence.ts
          src/services/gpt02Issue159OperatorAuthorizerEvidence.ts
          src/services/gpt02Issue159IssuerAuthorizerEvidence.ts
          src/services/gpt02Issue159IssuerLedgerReadOnly.ts
          src/services/gpt02Issue159IssuerReaderPool.ts
          src/services/gpt02Issue159PrivateKeyCustodyContract.ts
          src/services/gpt02Issue159SignerBoundaryReadiness.ts
