      - 'deploy/ai-coding-standalone-dev/gpt02-issue159-issuer-reader.sysusers'
      - 'deploy/ai-coding-standalone-dev/gpt02-issue159-issuer-reader.tmpfiles'
      - 'scripts/dev/test_gpt02_issue159_signer_runtime.py'
      - 'scripts/dev/fixtures/supabase-root-ca-2021.crt'
      - '.github/workflows/gpt02-issue159-four-signer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify four independent signer domains and custody policy
        working-directory: artifacts/api-server
        run: >-
          pnpm exec vitest run
          src/services/__tests__/gpt02Issue159FourSignerContract.test.ts
          src/services/__tests__/gpt02Issue159SignerCustodyPolicy.test.ts
          src/services/__tests__/gpt02Issue159PublicTrustHandoff.test.ts
          src/services/__tests__/gpt02Issue159ApprovalAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159OperatorAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159IssuerAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159IssuerLedgerReadOnly.test.ts
          src/services/__tests__/gpt02Issue159IssuerReaderPool.test.ts
          src/services/__tests__/gpt02Issue159PrivateKeyCustodyContract.test.ts
          src/services/__tests__/gpt02Issue159SignerBoundaryReadiness.test.ts
      - name: Verify issuer reader socket and admin API integration
        working-directory: artifacts/api-server
        run: >-
          pnpm exec vitest run
          src/services/__tests__/gpt02Issue159IssuerTrustedReader.test.ts
          src/services/__tests__/gpt02Issue159IssuerReaderSocketClient.test.ts
          src/routes/__tests__/gpt02-issue159-issuer-reader.test.ts
          src/routes/__tests__/gpt02-issue159-issuer-reader-live.test.ts
      - name: Build standalone read-only issuer reader runtime
        run: |
          bash -n scripts/dev/build-gpt02-issuer-reader-runtime.sh
          bash scripts/dev/build-gpt02-issuer-reader-runtime.sh
          test -s dist/issuer-reader-runtime/gpt02-issuer-reader-runtime.mjs
          node --check dist/issuer-reader-runtime/gpt02-issuer-reader-runtime.mjs
      - name: Verify API workspace types
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server run typecheck
      - name: Verify approval store readiness contract
        run: |
          python3 scripts/dev/test_gpt02_issue159_approval_store_readiness.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_reader.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_writer.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_contract.py
          python3 scripts/dev/test_gpt02_issue159_private_key_custody_readiness.py
          python3 scripts/dev/test_gpt02_issue159_signer_operational_readiness.py
          python3 scripts/dev/test_gpt02_issue159_signer_runtime.py
          python3 scripts/dev/test_gpt02_issue159_issuer_reader_sysusers.py
          systemd-analyze verify deploy/ai-coding-standalone-dev/gpt02-issue159-issuer-reader.service deploy/ai-coding-standalone-dev/gpt02-issue159-signer@.service
          python3 scripts/dev/test_gpt02_issue159_approval_http.py
          python3 scripts/dev/test_gpt02_issue159_approval_api_route.py
          # Ephemeral keys only. Test-designated pure signer backend; never
          # start systemd, load hosted credentials or contact PROD.
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_sign_once.py
          # Test no-clobber Hub/Core link output with isolated filesystem fixtures.
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_auto_chain_link.py
          # Verify fail-closed ordering without starting systemd or signing.
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_auto_chain_sequence.py
          # Strictly offline tests: AST-load only the pure slot guard. Never
          # import/run the top-level credential-backed DEV probe in CI.
          python3 -m py_compile scripts/dev/gpt02_issue159_writer_slot_handoff_probe.py
          python3 scripts/dev/test_gpt02_issue159_writer_slot_handoff_probe.py
          # Existing independent supervisor: offline contract test only.
          # Timer stays disabled, auditor NOLOGIN, no database or credentials.
          node --check deploy/ai-coding-standalone-dev/gpt02_issue159_relock_catalog_supervisor.mjs
          node --test scripts/dev/test_gpt02_issue159_relock_catalog_supervisor_offline.mjs
          # Source-only fail-closed guard for a skipped/stale watchdog.
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_relock_supervisor_readiness.py
          # The live VPS intentionally pins /usr/bin/node. The GitHub
          # runner installs node under hostedtoolcache instead. Verify an
          # ephemeral service unit with only that path adapted; never change
          # the real DEV unit or enable the timer in CI.
          relock_service=deploy/ai-coding-standalone-dev/gpt02-issue159-relock-catalog-auditor.service
          relock_timer=deploy/ai-coding-standalone-dev/gpt02-issue159-relock-catalog-auditor.timer
          relock_dropin=deploy/ai-coding-standalone-dev/gpt02-issue159-relock-catalog-auditor.service.d/10-node-jitless.conf
          grep -Fqx 'MemoryDenyWriteExecute=yes' "$relock_service"
          grep -Fqx 'ExecStart=/usr/bin/node --jitless --no-experimental-fetch /opt/ai-coding-standalone-dev/gpt02_issue159_relock_catalog_supervisor.mjs' "$relock_dropin"
          grep -Fqx 'ExecStart=/usr/bin/node /opt/ai-coding-standalone-dev/gpt02_issue159_relock_catalog_supervisor.mjs' "$relock_service"
          node_binary="$(command -v node)"
          test -x "$node_binary"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          sed "s#^ExecStart=/usr/bin/node #ExecStart=${node_binary} #" "$relock_service" > "$verify_dir/gpt02-issue159-relock-catalog-auditor.service"
          cp "$relock_timer" "$verify_dir/gpt02-issue159-relock-catalog-auditor.timer"
          mkdir -p "$verify_dir/gpt02-issue159-relock-catalog-auditor.service.d"
          sed "s#^ExecStart=/usr/bin/node #ExecStart=${node_binary} #" "$relock_dropin" > "$verify_dir/gpt02-issue159-relock-catalog-auditor.service.d/10-node-jitless.conf"
          systemd-analyze verify "$verify_dir/gpt02-issue159-relock-catalog-auditor.service" "$verify_dir/gpt02-issue159-relock-catalog-auditor.timer"
          # Disposable PostgreSQL 17 only: exercise fixed-role relock,
          # transaction rollback, all three live sessions, and repeat windows.
          # No Supabase credentials, no PROD, no signing or dispatch.
          python3 -m py_compile scripts/dev/test_gpt02_issue159_fixed_writer_relock_pg17_REVIEW_ONLY.py
          python3 scripts/dev/test_gpt02_issue159_fixed_writer_relock_pg17_REVIEW_ONLY.py
          # Public-key only, root-private archive fixture, NO live /opt data.
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_historical_archive_audit_readonly.py
          # Recover only an existing, fresh, exact SQLite intent after a packet
          # publication failure. Synthetic fixtures; no live approval or signer.
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_approval_packet_recovery.py
      - name: Targeted contract typecheck
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc --noEmit --skipLibCheck --target ES2022
          --module NodeNext --moduleResolution NodeNext --types node
          src/services/gpt02Issue159FourSignerContract.ts
          src/services/gpt02Issue159SignerCustodyPolicy.ts
          src/services/gpt02Issue159PublicTrustHandoff.ts
          src/services/gpt02Issue159ApprovalAuthorizerEvidence.ts
          src/services/gpt02Issue159OperatorAuthorizerEvidence.ts
          src/services/gpt02Issue159IssuerAuthorizerEvidence.ts
          src/services/gpt02Issue159IssuerLedgerReadOnly.ts
          src/services/gpt02Issue159IssuerReaderPool.ts
          src/services/gpt02Issue159PrivateKeyCustodyContract.ts
          src/services/gpt02Issue159SignerBoundaryReadiness.ts
