  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify four independent signer domains and custody policy
        working-directory: artifacts/api-server
        run: >-
          pnpm exec vitest run
          src/services/__tests__/gpt02Issue159FourSignerContract.test.ts
          src/services/__tests__/gpt02Issue159SignerCustodyPolicy.test.ts
          src/services/__tests__/gpt02Issue159PublicTrustHandoff.test.ts
          src/services/__tests__/gpt02Issue159ApprovalAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159OperatorAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159IssuerAuthorizerEvidence.test.ts
          src/services/__tests__/gpt02Issue159IssuerLedgerReadOnly.test.ts
          src/services/__tests__/gpt02Issue159IssuerReaderPool.test.ts
          src/services/__tests__/gpt02Issue159PrivateKeyCustodyContract.test.ts
          src/services/__tests__/gpt02Issue159SignerBoundaryReadiness.test.ts
      - name: Verify issuer reader socket and admin API integration
        working-directory: artifacts/api-server
        run: >-
          pnpm exec vitest run
          src/services/__tests__/gpt02Issue159IssuerTrustedReader.test.ts
          src/services/__tests__/gpt02Issue159IssuerReaderSocketClient.test.ts
          src/routes/__tests__/gpt02-issue159-issuer-reader.test.ts
          src/routes/__tests__/gpt02-issue159-issuer-reader-live.test.ts
      - name: Build standalone read-only issuer reader runtime
        run: |
          bash -n scripts/dev/build-gpt02-issuer-reader-runtime.sh
          bash scripts/dev/build-gpt02-issuer-reader-runtime.sh
          test -s dist/issuer-reader-runtime/gpt02-issuer-reader-runtime.mjs
          node --check dist/issuer-reader-runtime/gpt02-issuer-reader-runtime.mjs
      - name: Verify API workspace types
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server run typecheck
      - name: Verify approval store readiness contract
        run: |
          python3 scripts/dev/test_gpt02_issue159_approval_store_readiness.py
          python3 scripts/dev/test_gpt02_issue159_lifecycle_catalog_preflight.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_reader.py
          python3 scripts/dev/test_gpt02_issue159_dev_approval_page_release.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_writer.py
          python3 scripts/dev/test_gpt02_issue159_approval_intent_contract.py
          python3 scripts/dev/test_gpt02_issue159_private_key_custody_readiness.py
          python3 scripts/dev/test_gpt02_issue159_signer_operational_readiness.py
          python3 scripts/dev/test_gpt02_issue159_signer_runtime.py
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_sign_once.py
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_signer_approval_guard.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_hub_core_signer_guard.py' -v
          # The live Hub/Core reader unit is owned by AI-Task-Hub, not this repo.
          # Stub only its dependency name in CI; never install/start this stub.
          printf '%s\n' '[Unit]' 'Description=CI-only Hub Core reader dependency stub' '[Service]' 'Type=oneshot' 'ExecStart=/usr/bin/true' > "$RUNNER_TEMP/gpt02-issue159-reader.service"
          systemd-analyze verify "$RUNNER_TEMP/gpt02-issue159-reader.service" deploy/ai-coding-standalone-dev/gpt02-issue159-approval-reader.service 'deploy/ai-coding-standalone-dev/gpt02-issue159-sign-once-operator@.service'
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_sign_once_service_policy.py
          systemd-analyze verify deploy/ai-coding-standalone-dev/gpt02-issue159-sign-once-approval.service
          python3 scripts/dev/test_gpt02_issue159_issuer_reader_sysusers.py
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_approval_reader_runtime.py
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_approval_reader_service.py
          systemd-analyze verify deploy/ai-coding-standalone-dev/gpt02-issue159-approval-reader.service deploy/ai-coding-standalone-dev/gpt02-issue159-issuer-reader.service deploy/ai-coding-standalone-dev/gpt02-issue159-signer@.service
          python3 scripts/dev/test_gpt02_issue159_approval_http.py
          python3 scripts/dev/test_gpt02_issue159_approval_api_route.py
          node scripts/dev/test_gpt02_issue159_magic_link_callback.mjs
          PYTHONPATH=deploy/ai-coding-standalone-dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_writer_broker_contract.py' -v
          GPT02_TEST_TSX_BINARY=artifacts/api-server/node_modules/.bin/tsx PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_cross_language_vectors.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_staged_admission.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_lineage_readback_contract.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_lineage_db_reader.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_lineage_reader_runtime.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_lineage_socket_bridge.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_attestor_preflight.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_attestor_record_once.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_approved_chain_once.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_provision_lineage_reader_interactive.py' -v
          PYTHONPATH=scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_prepare_lineage_sql_editor.py' -v
          PYTHONPATH=scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_stage_core_prep_sql_editor.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_lineage_service_policy.py' -v
          systemd-analyze verify deploy/ai-coding-standalone-dev/gpt02-issue159-lineage-reader.service
          PYTHONPATH=deploy/ai-coding-standalone-dev python3 -m unittest discover -s scripts/dev -p 'test_gpt02_issue159_writer_broker_runtime.py' -v
          PYTHONPATH=deploy/ai-coding-standalone-dev:scripts/dev python3 scripts/dev/test_gpt02_issue159_verifier_service.py
          systemd-analyze verify deploy/ai-coding-standalone-dev/gpt02-issue159-verifier.service
          python3 -m py_compile deploy/ai-coding-standalone-dev/gpt02_issue159_writer_broker_contract.py deploy/ai-coding-standalone-dev/gpt02_issue159_staged_admission.py deploy/ai-coding-standalone-dev/gpt02_issue159_lineage_readback_contract.py deploy/ai-coding-standalone-dev/gpt02_issue159_lineage_db_reader.py deploy/ai-coding-standalone-dev/gpt02_issue159_lineage_reader_runtime.py deploy/ai-coding-standalone-dev/gpt02_issue159_writer_broker_runtime.py
      - name: Verify split-owner writer boundary in isolated PostgreSQL 16
        run: |
          bash -n scripts/dev/test_gpt02_issue159_split_owner_isolated.sh
          bash scripts/dev/test_gpt02_issue159_split_owner_isolated.sh
          bash -n scripts/dev/test_gpt02_issue159_six_rpc_isolated.sh
          bash scripts/dev/test_gpt02_issue159_six_rpc_isolated.sh
          bash -n scripts/dev/test_gpt02_issue159_lineage_reader_grants_isolated.sh
          bash scripts/dev/test_gpt02_issue159_lineage_reader_grants_isolated.sh
      - name: Targeted contract typecheck
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc --noEmit --skipLibCheck --target ES2022
          --module NodeNext --moduleResolution NodeNext --types node
          src/services/gpt02Issue159FourSignerContract.ts
          src/services/gpt02Issue159SignerCustodyPolicy.ts
          src/services/gpt02Issue159PublicTrustHandoff.ts
          src/services/gpt02Issue159ApprovalAuthorizerEvidence.ts
          src/services/gpt02Issue159OperatorAuthorizerEvidence.ts
          src/services/gpt02Issue159IssuerAuthorizerEvidence.ts
          src/services/gpt02Issue159IssuerLedgerReadOnly.ts
          src/services/gpt02Issue159IssuerReaderPool.ts
          src/services/gpt02Issue159PrivateKeyCustodyContract.ts
          src/services/gpt02Issue159SignerBoundaryReadiness.ts
